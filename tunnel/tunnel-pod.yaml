# The tunnel: a WireGuard daemon, the TLS it leads to, and the authenticated
# door the console reaches it through.
#
# Two containers, one pod, and the pairing is not incidental. The tunnel has to
# lead somewhere with TLS, because WebAuthn refuses to run without a secure
# context and refuses a bare IP as the relying party (GOTCHAS 38). Putting
# Caddy here rather than beside the console means the internet egress ACME
# needs belongs to THIS pod, where nothing else can inherit it.
#
# The console is deliberately absent. It reaches the daemon over the network
# now (tunnel/DESIGN-uapi-transport.md), so it stays in agent-stack under
# enforced `restricted` and never joins a privileged pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: genaryx-tunnel
  namespace: agent-tunnel
  labels: { app: genaryx-tunnel, plane: tunnel }
spec:
  replicas: 1
  # One RWO volume holds the issued peers, so never two at once. Recreate also
  # means the NodePort's target is unambiguous during a rollout.
  strategy: { type: Recreate }
  selector: { matchLabels: { app: genaryx-tunnel } }
  template:
    metadata:
      labels: { app: genaryx-tunnel, plane: tunnel }
    spec:
      containers:
        - name: wg
          image: stack/wg:dev
          imagePullPolicy: IfNotPresent
          env:
            - { name: WG_IFACE, value: "wg-op" }
            # 31820, not 51820, and it is load-bearing. The client config the
            # console generates takes its port from what the DAEMON reports,
            # not from a setting, so the daemon must listen on the number the
            # outside world dials or every issued config names a dead port.
            - { name: WG_LISTEN_PORT, value: "31820" }
            # The tunnel leads to TLS in this same pod, so localhost.
            - { name: WG_CONSOLE_HOST, value: "127.0.0.1" }
            - { name: WG_CONSOLE_PORT, value: "443" }
            # The network door. Empty would leave only the unix relay, which is
            # right on a single box and useless here: the console is in another
            # namespace and has no volume to share.
            - { name: WG_PROXY_LISTEN, value: ":9090" }
            - { name: WG_PROXY_CERT, value: "/etc/wg-proxy/tls.crt" }
            - { name: WG_PROXY_KEY, value: "/etc/wg-proxy/tls.key" }
            - { name: WG_PROXY_TOKEN_FILE, value: "/etc/wg-proxy/token" }
          ports:
            - { name: wg, containerPort: 31820, protocol: UDP }
            - { name: uapi, containerPort: 9090 }
          securityContext:
            # Root with one capability. Creating and configuring a TUN
            # interface is not something an unprivileged user can do, and
            # `privileged: true` would hand this container the whole node.
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN"]
          volumeMounts:
            # Issued devices must survive a restart: the daemon holds peers
            # only in memory and the entrypoint saves them on a timer, so an
            # emptyDir would silently revoke every device the moment this pod
            # moved.
            - { name: wgstate, mountPath: /var/lib/wireguard }
            - { name: tun, mountPath: /dev/net/tun }
            - { name: proxy, mountPath: /etc/wg-proxy, readOnly: true }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }

        - name: caddy
          image: stack/caddy:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: CONSOLE_DOMAIN
              valueFrom: { configMapKeyRef: { name: stack-tunnel, key: console_domain } }
            # Across a namespace now, by Service name. This is the one hop the
            # split adds, and it is an ordinary HTTP call to a ClusterIP.
            - { name: CONSOLE_UPSTREAM, value: "genaryx-console.agent-stack:7420" }
            - name: CLOUDFLARE_API_TOKEN
              valueFrom:
                secretKeyRef: { name: stack-tunnel-dns, key: cloudflare_api_token, optional: true }
            - name: ACME_EMAIL
              valueFrom:
                configMapKeyRef: { name: stack-tunnel, key: acme_email, optional: true }
          ports:
            - { name: https, containerPort: 443 }
          securityContext:
            # Kubernetes grants no ambient capabilities, so a non-root process
            # cannot bind 443 however the capability set is written. A high
            # port instead would have to appear in GENARYX_WEB_ORIGIN and in
            # every URL an operator types.
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            # Let's Encrypt rate limits are per name per week, so an emptyDir
            # here would re-issue on every restart until the limit stopped it,
            # and the console would become unreachable in a way that reads like
            # a Caddy bug.
            - { name: caddydata, mountPath: /data }
            - { name: caddyconfig, mountPath: /config }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }

      volumes:
        - name: wgstate
          persistentVolumeClaim: { claimName: wg-state }
        - name: caddydata
          persistentVolumeClaim: { claimName: caddy-data }
        - name: caddyconfig
          emptyDir: {}
        # The certificate the proxy serves, its key, and the bearer it checks.
        # Generated per cluster by install.sh; this repo never sees them.
        - name: proxy
          secret:
            secretName: stack-tunnel-proxy
            items:
              - { key: tls.crt, path: tls.crt }
              - { key: tls.key, path: tls.key }
              - { key: token, path: token }
        # CharDevice, so the kubelet refuses rather than silently creating a
        # directory on a node with no tun device.
        - name: tun
          hostPath: { path: /dev/net/tun, type: CharDevice }
---
# The way in. A NodePort, not a LoadBalancer: it costs nothing on any provider,
# Hetzner may not support UDP load balancers at all, and it answers on EVERY
# node because kube-proxy forwards to the pod wherever it runs. That is what
# retires GOTCHAS 13, where an operator has to ssh to the one node holding the
# console pod.
apiVersion: v1
kind: Service
metadata: { name: genaryx-tunnel, namespace: agent-tunnel }
spec:
  type: NodePort
  selector: { app: genaryx-tunnel }
  ports:
    - { name: wg, protocol: UDP, port: 31820, targetPort: 31820, nodePort: 31820 }
---
# The door the console knocks on. ClusterIP, so it exists only inside the
# cluster; the NetworkPolicy beside it decides who may reach it, and the bearer
# decides whether they are answered.
#
# The name is load-bearing: install.sh puts `wg-uapi.agent-tunnel` and its
# fully qualified form in the certificate's SAN, so renaming this Service
# without regenerating the certificate fails as a TLS error rather than a
# naming one.
apiVersion: v1
kind: Service
metadata: { name: wg-uapi, namespace: agent-tunnel }
spec:
  selector: { app: genaryx-tunnel }
  ports: [{ name: uapi, port: 9090, targetPort: uapi }]
