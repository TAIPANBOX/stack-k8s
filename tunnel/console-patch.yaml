# Three containers in one pod, which is the whole translation.
#
# On one machine (stack-single's compose.yaml) `wg`, `caddy` and `console` are
# three services sharing a named volume for the WireGuard UAPI socket. A unix
# socket cannot cross a pod boundary, so on Kubernetes they become three
# containers in ONE pod sharing an emptyDir. That is not a compromise: it is
# strictly simpler, because the three now also share a network namespace and
# talk over 127.0.0.1 instead of service names.
#
# The privilege split is the point and it survives intact:
#
#   wg       holds NET_ADMIN and /dev/net/tun, and nothing else
#   caddy    holds NET_BIND_SERVICE, to answer on 443, and nothing else
#   console  holds NO capability at all, and manages peers through one socket
#
# The console is what issues and revokes devices, and it does so without the
# ability to configure a network interface. That is the property worth keeping.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: genaryx-console
  namespace: agent-stack
spec:
  template:
    spec:
      containers:
        # ---- the existing console, told about the tunnel --------------------
        - name: console
          env:
            - { name: GENARYX_WG_IFACE, value: "wg-op" }
            # The RELAY socket, not the daemon's own. `wireguard-go` requires
            # its socket to stay 0700 and stops answering if that changes, so
            # the wg container forwards a group-readable one beside it
            # (GOTCHAS 35).
            - { name: GENARYX_WG_UAPI_SOCKET, value: "/var/run/wireguard/console.sock" }
            # The address a phone dials from OUTSIDE. Nothing on the interface
            # can report it and the console refuses to guess; see resources.yaml.
            - name: GENARYX_WG_ENDPOINT_HOST
              valueFrom: { configMapKeyRef: { name: stack-tunnel, key: endpoint_host } }
            # WebAuthn binds credentials to this exact pair, and it must match
            # what the browser addresses through Caddy. A mismatch is refused
            # with an error that reads like a broken passkey rather than a
            # wrong origin (GOTCHAS 38).
            - name: GENARYX_WEB_RP_ID
              valueFrom: { configMapKeyRef: { name: stack-tunnel, key: console_domain } }
            - name: GENARYX_WEB_ORIGIN
              valueFrom: { configMapKeyRef: { name: stack-tunnel, key: console_origin } }
          volumeMounts:
            - { name: wgapi, mountPath: /var/run/wireguard }

        # ---- the tunnel ------------------------------------------------------
        - name: wg
          image: stack/wg:dev
          imagePullPolicy: IfNotPresent
          env:
            - { name: WG_IFACE, value: "wg-op" }
            # 31820, not 51820, and this is load-bearing. The client config the
            # console generates takes its port from what the DAEMON reports
            # (`format!("{host}:{listen_port}")` in wg_operator.rs), not from a
            # separate setting. So if the daemon listened on 51820 while the
            # way in were a NodePort on 31820, every issued config would name a
            # port nothing answers on. Making the daemon listen on the NodePort
            # number keeps the generated config true.
            - { name: WG_LISTEN_PORT, value: "31820" }
            # The uid the console image runs as, so the relay socket is
            # reachable by it and by nothing else.
            - { name: WG_SOCKET_GID, value: "10001" }
            # The tunnel leads to TLS, not to the console directly, because the
            # passkey ceremony is impossible without it. Same pod, so localhost.
            - { name: WG_CONSOLE_HOST, value: "127.0.0.1" }
            - { name: WG_CONSOLE_PORT, value: "443" }
          ports:
            - { name: wg, containerPort: 31820, protocol: UDP }
          securityContext:
            # Root, with exactly one capability. Creating a tun interface and
            # configuring it is not something an unprivileged user can do, and
            # the alternative (privileged: true) would hand this container the
            # whole node. The pod-level runAsNonRoot has to be turned off HERE
            # rather than removed from the pod, so the console keeps it.
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN"]
          volumeMounts:
            # Issued devices must survive a restart, so this is a real volume
            # and not an emptyDir: the daemon holds peers only in memory and
            # the entrypoint saves them to peers.conf on a timer.
            - { name: wgstate, mountPath: /var/lib/wireguard }
            - { name: wgapi, mountPath: /var/run/wireguard }
            - { name: tun, mountPath: /dev/net/tun }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }

        # ---- TLS, inside the tunnel only ------------------------------------
        - name: caddy
          image: stack/caddy:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: CONSOLE_DOMAIN
              valueFrom: { configMapKeyRef: { name: stack-tunnel, key: console_domain } }
            # Same pod. On compose this was `console:7420`.
            - { name: CONSOLE_UPSTREAM, value: "127.0.0.1:7420" }
            # Present -> a real Let's Encrypt certificate over DNS-01. Absent ->
            # Caddy's internal CA, which works only on devices told to trust it.
            # DNS-01 because this publishes nothing on 80/443 to the internet,
            # so HTTP-01 has nothing to answer.
            - name: CLOUDFLARE_API_TOKEN
              valueFrom:
                secretKeyRef: { name: stack-tunnel-dns, key: cloudflare_api_token, optional: true }
            - name: ACME_EMAIL
              valueFrom:
                configMapKeyRef: { name: stack-tunnel, key: acme_email, optional: true }
          ports:
            - { name: https, containerPort: 443 }
          securityContext:
            # Root for the same reason as wg and with a narrower capability:
            # 443 is a privileged port, and Kubernetes does not grant ambient
            # capabilities, so a non-root process cannot bind it however the
            # capability set is written. The alternative is a high port, which
            # would have to appear in GENARYX_WEB_ORIGIN and in every URL an
            # operator types.
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            # Certificates live here. An emptyDir would re-issue on every
            # restart and walk straight into Let's Encrypt's rate limits.
            - { name: caddydata, mountPath: /data }
            - { name: caddyconfig, mountPath: /config }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }

      volumes:
        - name: wgapi
          emptyDir: {}
        - name: wgstate
          persistentVolumeClaim: { claimName: wg-state }
        - name: caddydata
          persistentVolumeClaim: { claimName: caddy-data }
        - name: caddyconfig
          emptyDir: {}
        # The one thing here that reaches outside the container. CharDevice, so
        # the kubelet refuses rather than silently creating a directory if the
        # node has no tun device at all.
        - name: tun
          hostPath: { path: /dev/net/tun, type: CharDevice }
