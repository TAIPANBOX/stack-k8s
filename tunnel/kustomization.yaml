# The operator's road in.
#
#   ./tunnel/up.sh
#
# The base stack plus a tunnel in its own namespace. The console STAYS in
# agent-stack under enforced `restricted` and gains only environment and one
# read-only Secret projection: it reaches the daemon over an authenticated
# network channel rather than a shared unix socket, which is what lets the
# privileged half live apart. See DESIGN-uapi-transport.md, and namespace.yaml
# for what the earlier shape cost.
#
# NOT metered: the way in is a NodePort, free on any provider.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No global `namespace:`: this build spans two, and every object states its own.

resources:
  - ../manifests
  - namespace.yaml
  - tunnel-pod.yaml
  - resources.yaml
  # Yours, not the repository's, and deliberately untracked: while these two
  # names lived in resources.yaml, a `git pull` replaced them with ours.
  # up.sh writes it if it is missing (asking, or from site.example.yaml).
  - site.yaml

patches:
  - path: console-patch.yaml
    target: { kind: Deployment, name: genaryx-console, namespace: agent-stack }
