# The tunnel's own namespace, holding the two containers that genuinely need
# privileges and nothing else.
#
# `privileged`, and the word is exact rather than lazy. `baseline` was tried
# and refuses this pod: it permits one added capability, NET_BIND_SERVICE, and
# forbids hostPath outright, while `wireguard-go` needs NET_ADMIN and
# /dev/net/tun. Kubernetes has three levels and nothing between baseline and
# privileged, so there is no narrower label that admits it.
#
# WHAT CHANGED, AND WHY IT MATTERS
#
# An earlier version put the CONSOLE in here too, because the console managed
# peers over a unix socket and a unix socket cannot cross a pod boundary. That
# cost three things, all of them downstream of that one sentence:
#
#   - the console left a namespace where the API server ENFORCES its posture
#     for one where the pod only promises it
#   - Caddy came with it, and a NetworkPolicy selects a POD, so the console
#     inherited Caddy's way to the open internet, past the gateway that is
#     supposed to be the only metered path out (GOTCHAS 49)
#   - the shared event log had to be reached over NFS across namespaces, and
#     the generated credentials had to exist in two places
#
# The console now reaches this daemon over an authenticated network channel, so
# it stays in `agent-stack` under enforced `restricted` and none of that
# applies. What is privileged here is exactly what has to be: a WireGuard
# daemon and the TLS terminator that lives with it.
#
# `warn: baseline` cannot block anything, but every apply prints what a
# stricter cluster would have refused, so the exception stays loud. The test
# that can actually fail is security-tests.sh 5b, which asserts this namespace
# holds exactly the expected violations and no others.
apiVersion: v1
kind: Namespace
metadata:
  name: agent-tunnel
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/warn-version: latest
