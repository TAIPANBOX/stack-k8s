# Admission policy for the stack's namespace (invariant 58 of CLAUDE.md). Opt-in on a cluster with
# policy/up.sh; the default install opts agent-stack in (deploy.sh). See policy/README.md.
#
# One ClusterImagePolicy per TAIPANBOX repository, so an image is admitted only on the signature of its own
# repository's workflow: a release signed by repository A does not admit an image named for repository B.
# Each policy's glob names the image names of one repository, digest-anchored (`name@sha256:*`, which is how
# the controller matches: the tag is not part of the match), and each policy's identity names that
# repository's release workflow, or stack-k8s's console-image.yml / tunnel-images.yml, on a version tag.
# An image under ghcr.io/taipanbox/ that no policy covers is refused (`no-match-policy: deny`).
#
# The identities were checked on the registry on 2026-10-19 with cosign v3.1.3: each image of a repository
# verifies against that repository's identity below (policy/README.md, "What it admits today").
---
apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: taipanbox-tokenfuse
spec:
  mode: enforce
  images:
    - glob: "ghcr.io/taipanbox/tokenfuse@sha256:*"
    - glob: "ghcr.io/taipanbox/tokenfuse-control-plane@sha256:*"
  authorities:
    - keyless:
        url: https://fulcio.sigstore.dev
        identities:
          - issuer: https://token.actions.githubusercontent.com
            subjectRegExp: '^https://github\.com/TAIPANBOX/tokenfuse/\.github/workflows/release\.yml@refs/tags/v[0-9][A-Za-z0-9._+-]*$'
---
