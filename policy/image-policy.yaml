# Admission policy for the stack's namespace (invariant 58 of CLAUDE.md). Opt-in: policy/up.sh
# applies this file once the controller answers, then opts agent-stack in. See policy/README.md.
#
# taipanbox-signed: every image under ghcr.io/taipanbox/ must carry a keyless signature made by the
# release workflow of a TAIPANBOX repository, on a version tag, through GitHub Actions. Measured on
# the registry 2026-10-19 for the images the manifests name (identities listed in the gate).
apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: taipanbox-signed
spec:
  mode: enforce
  images:
    - glob: "ghcr.io/taipanbox/**"
  authorities:
    - keyless:
        url: https://fulcio.sigstore.dev
        identities:
          - issuer: https://token.actions.githubusercontent.com
            subjectRegExp: '^https://github\.com/TAIPANBOX/[A-Za-z0-9._-]+/\.github/workflows/release\.yml@refs/tags/v[0-9][A-Za-z0-9._+-]*$'
---
# upstream-pinned: images that are not ours and that the policy does not sign. Each one is trusted
# by its digest alone, with the reason it is in the stack. A new upstream image is added here with
# a reason, or it is refused. This policy is enforce; the action is pass for a listed digest only.
apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: upstream-pinned
spec:
  images:
    # reason: the policy-db (postgres), an upstream image, pinned here by digest; the tag is not matched
    - glob: "index.docker.io/library/postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea"
    # reason: the hub's TLS front (Caddy, upstream), pinned by digest in manifests/53-hub-entry.yaml
    - glob: "index.docker.io/library/caddy@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b"
    # reason: the root-key copy in keyryx/manifests/59-keyryx.yaml, a shell-only init container (upstream)
    - glob: "index.docker.io/library/busybox@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e"
  authorities:
    - static:
        action: pass
