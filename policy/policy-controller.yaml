apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook
  namespace: cosign-system
spec:
  selector:
    matchLabels:
      role: webhook
  template:
    metadata:
      labels:
        role: webhook
    spec:
      # To avoid node becoming SPOF, spread our replicas to different nodes.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  role: webhook
              topologyKey: kubernetes.io/hostname
            weight: 100

      serviceAccountName: webhook
      containers:
      - name: webhook
        # This is the Go import path for the binary that is containerized
        # and substituted here.
        image: ghcr.io/sigstore/policy-controller/policy-controller:v0.15.1@sha256:0492bb264fb1d9bdc8e3f343ef542cc85b7dd7c7fd8d9524b453c2bd31a1d128
        args: [
          # Uncomment these to initialize with a custom TUF root.
          # TODO: How to specify the entire TUF directory for multiple
          # TUF roots.
          #"--tuf-mirror", "http://tuf.tuf-system.svc",
          #"--tuf-root", "/var/run/tuf/root.json",
          # Uncomment to customize ClusterImagePolicy resync period
          # "--policy-resync-period", "10h",
        ]
        resources:
          requests:
            cpu: 40m
            memory: 40Mi
          limits:
            cpu: 400m
            memory: 400Mi
        env:
        - name: SYSTEM_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: CONFIG_LOGGING_NAME
          value: config-logging
        - name: METRICS_DOMAIN
          value: sigstore.dev/policy
        - name: WEBHOOK_NAME
          value: webhook
        - name: KUBERNETES_MIN_VERSION
          value: "1.21.0"
        - name: HOME
          value: "/var/run/sigstore"

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL

        volumeMounts:
        - name: homedir
          mountPath: "/var/run/sigstore"
        - name: tuf-root
          mountPath: "/var/run/tuf"
          readOnly: true

        readinessProbe: &probe
          failureThreshold: 6
          initialDelaySeconds: 20
          periodSeconds: 1
          httpGet:
            scheme: HTTPS
            port: 8443
            httpHeaders:
            - name: k-kubelet-probe
              value: "webhook"
        livenessProbe: *probe

      # Our webhook should gracefully terminate by lame ducking first, set this to a sufficiently
      # high value that we respect whatever value it has configured for the lame duck grace period.
      terminationGracePeriodSeconds: 300

      volumes:
      - emptyDir: {}
        name: homedir
      - name: tuf-root
        secret:
          secretName: tuf-root
          # This is marked as optional, since if you are using public
          # instance, TUF root is built in to the cosign container.
          optional: true
          items:
          - key: root
            path: root.json
