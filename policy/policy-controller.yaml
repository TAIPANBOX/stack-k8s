# Sigstore policy-controller v0.15.1, rendered from sigstore/policy-controller at tag v0.15.1
# (commit cc75baab1d34d3bae47bde7bd934bf79e5ca3afc): `kubectl kustomize config/`, plus the Deployment
# in config/webhook.yaml, which that kustomization does not include. Two edits, both in this file:
#   1. the webhook's ko:// build reference is the image the release publishes, pinned by digest;
#   2. config-policy-controller sets no-match-policy: deny (the upstream file carries an example only).
# Installed and switched on by policy/up.sh, never by manifests/kustomization.yaml (invariant 58).
# Changing this file without a new policy/PIN is refused by scripts/verified-images-are-enforced.sh.
apiVersion: v1
kind: Namespace
metadata:
  labels:
    policy.sigstore.dev/include: "false"
  name: cosign-system
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusterimagepolicies.policy.sigstore.dev
spec:
  conversion:
    strategy: Webhook
    webhook:
      clientConfig:
        service:
          name: webhook
          namespace: cosign-system
      conversionReviewVersions:
      - v1beta1
      - v1alpha1
  group: policy.sigstore.dev
  names:
    categories:
    - all
    - sigstore
    kind: ClusterImagePolicy
    plural: clusterimagepolicies
    shortNames:
    - cip
    singular: clusterimagepolicy
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          spec:
            description: Spec holds the desired state of the ClusterImagePolicy (from
              the client).
            properties:
              authorities:
                description: Authorities defines the rules for discovering and validating
                  signatures.
                items:
                  properties:
                    attestations:
                      description: Attestations is a list of individual attestations
                        for this authority, once the signature for this authority
                        has been verified.
                      items:
                        properties:
                          name:
                            description: Name of the attestation. These can then be
                              referenced at the CIP level policy.
                            type: string
                          policy:
                            description: Policy defines all of the matching signatures,
                              and all of the matching attestations (whose attestations
                              are verified).
                            properties:
                              configMapRef:
                                description: ConfigMapRef defines the reference to
                                  a configMap with the policy definition.
                                properties:
                                  key:
                                    description: Key defines the key to pull from
                                      the configmap.
                                    type: string
                                  name:
                                    description: Name is unique within a namespace
                                      to reference a configmap resource.
                                    type: string
                                  namespace:
                                    description: Namespace defines the space within
                                      which the configmap name must be unique.
                                    type: string
                                type: object
                              data:
                                description: Data contains the policy definition.
                                type: string
                              fetchConfigFile:
                                description: 'FetchConfigFile controls whether ConfigFile
                                  will be fetched and made available for CIP level
                                  policy evaluation. Note that this only gets evaluated
                                  (and hence fetched) iff at least one authority matches.
                                  The ConfigFile will then be available in this format:
                                  https://github.com/opencontainers/image-spec/blob/main/config.md'
                                type: boolean
                              includeObjectMeta:
                                description: IncludeObjectMeta controls whether the
                                  ObjectMeta will be included and made available for
                                  CIP level policy evalutation. Note that this only
                                  gets evaluated iff at least one authority matches.
                                type: boolean
                              includeSpec:
                                description: IncludeSpec controls whether resource
                                  `Spec` will be included and made available for CIP
                                  level policy evaluation. Note that this only gets
                                  evaluated iff at least one authority matches. Also
                                  note that because Spec may be of a different shape
                                  depending on the resource being evaluatied (see
                                  MatchResource for filtering) you might want to configure
                                  these to match the policy file to ensure the shape
                                  of the Spec is what you expect when evaling the
                                  policy.
                                type: boolean
                              includeTypeMeta:
                                description: IncludeTypeMeta controls whether the
                                  TypeMeta will be included and made available for
                                  CIP level policy evalutation. Note that this only
                                  gets evaluated iff at least one authority matches.
                                type: boolean
                              remote:
                                description: Remote defines the url to a policy.
                                properties:
                                  sha256sum:
                                    description: Sha256sum defines the exact sha256sum
                                      computed out of the 'body' of the http response.
                                    type: string
                                  url:
                                    description: URL to the policy data.
                                    type: string
                                type: object
                              type:
                                description: Which kind of policy this is, currently
                                  only rego or cue are supported. Furthermore, only
                                  cue is tested :)
                                type: string
                            type: object
                          predicateType:
                            description: PredicateType defines which predicate type
                              to verify. Matches cosign verify-attestation options.
                            type: string
                        type: object
                      type: array
                    ctlog:
                      description: CTLog sets the configuration to verify the authority
                        against a Rekor instance.
                      properties:
                        trustRootRef:
                          description: Use the Public Key from the referred TrustRoot.TLog
                          type: string
                        url:
                          description: URL sets the url to the rekor instance (by
                            default the public rekor.sigstore.dev)
                          type: string
                      type: object
                    key:
                      description: Key defines the type of key to validate the image.
                      properties:
                        data:
                          description: Data contains the inline public key.
                          type: string
                        hashAlgorithm:
                          description: HashAlgorithm always defaults to sha256 if
                            the algorithm hasn't been explicitly set
                          type: string
                        kms:
                          description: KMS contains the KMS url of the public key
                            Supported formats differ based on the KMS system used.
                          type: string
                        secretRef:
                          description: SecretRef sets a reference to a secret with
                            the key.
                          properties:
                            name:
                              description: name is unique within a namespace to reference
                                a secret resource.
                              type: string
                            namespace:
                              description: namespace defines the space within which
                                the secret name must be unique.
                              type: string
                          type: object
                      type: object
                    keyless:
                      description: Keyless sets the configuration to verify the authority
                        against a Fulcio instance.
                      properties:
                        ca-cert:
                          description: CACert sets a reference to CA certificate
                          properties:
                            data:
                              description: Data contains the inline public key.
                              type: string
                            hashAlgorithm:
                              description: HashAlgorithm always defaults to sha256
                                if the algorithm hasn't been explicitly set
                              type: string
                            kms:
                              description: KMS contains the KMS url of the public
                                key Supported formats differ based on the KMS system
                                used.
                              type: string
                            secretRef:
                              description: SecretRef sets a reference to a secret
                                with the key.
                              properties:
                                name:
                                  description: name is unique within a namespace to
                                    reference a secret resource.
                                  type: string
                                namespace:
                                  description: namespace defines the space within
                                    which the secret name must be unique.
                                  type: string
                              type: object
                          type: object
                        identities:
                          description: Identities sets a list of identities.
                          items:
                            properties:
                              issuer:
                                description: Issuer defines the issuer for this identity.
                                type: string
                              issuerRegExp:
                                description: IssuerRegExp specifies a regular expression
                                  to match the issuer for this identity.
                                type: string
                              subject:
                                description: Subject defines the subject for this
                                  identity.
                                type: string
                              subjectRegExp:
                                description: SubjectRegExp specifies a regular expression
                                  to match the subject for this identity.
                                type: string
                            type: object
                          type: array
                        insecureIgnoreSCT:
                          description: InsecureIgnoreSCT omits verifying if a certificate
                            contains an embedded SCT
                          type: boolean
                        trustRootRef:
                          description: Use the Certificate Chain from the referred
                            TrustRoot.CertificateAuthorities and TrustRoot.CTLog
                          type: string
                        url:
                          description: URL defines a url to the keyless instance.
                          type: string
                      type: object
                    name:
                      description: Name is the name for this authority. Used by the
                        CIP Policy validator to be able to reference matching signature
                        or attestation verifications. If not specified, the name will
                        be authority-<index in array>
                      type: string
                    rfc3161timestamp:
                      description: RFC3161Timestamp sets the configuration to verify
                        the signature timestamp against a RFC3161 time-stamping instance.
                      properties:
                        trustRootRef:
                          description: Use the Certificate Chain from the referred
                            TrustRoot.TimeStampAuthorities
                          type: string
                      type: object
                    signatureFormat:
                      description: SignatureFormat specifies the format the authority
                        expects. Supported formats are "legacy" and "bundle". If not
                        specified, the default is "legacy" (cosign's default).
                      type: string
                    source:
                      description: Sources sets the configuration to specify the sources
                        from where to consume the signatures.
                      items:
                        properties:
                          oci:
                            description: OCI defines the registry from where to pull
                              the signature / attestations.
                            type: string
                          signaturePullSecrets:
                            description: SignaturePullSecrets is an optional list
                              of references to secrets in the same namespace as the
                              deploying resource for pulling any of the signatures
                              used by this Source.
                            items:
                              properties:
                                name:
                                  description: 'Name of the referent. This field is
                                    effectively required, but due to backwards compatibility
                                    is allowed to be empty. Instances of this type
                                    with an empty value here are almost certainly
                                    wrong. More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names'
                                  type: string
                              type: object
                            type: array
                          tagPrefix:
                            description: TagPrefix is an optional prefix that signature
                              and attestations have. This is the 'tag based discovery'
                              and in the future once references are fully supported
                              that should likely be the preferred way to handle these.
                            type: string
                        type: object
                      type: array
                    static:
                      description: Static specifies that signatures / attestations
                        are not validated but instead a static policy is applied against
                        matching images.
                      properties:
                        action:
                          description: Action defines how to handle a matching policy.
                          type: string
                        message:
                          description: For fail actions, emit an optional custom message
                          type: string
                      type: object
                  type: object
                type: array
              images:
                description: Images defines the patterns of image names that should
                  be subject to this policy.
                items:
                  properties:
                    glob:
                      description: Glob defines a globbing pattern.
                      type: string
                  type: object
                type: array
              match:
                description: Match allows selecting resources based on their properties.
                items:
                  properties:
                    group:
                      type: string
                    resource:
                      type: string
                    selector:
                      properties:
                        matchExpressions:
                          description: matchExpressions is a list of label selector
                            requirements. The requirements are ANDed.
                          items:
                            properties:
                              key:
                                description: key is the label key that the selector
                                  applies to.
                                type: string
                              operator:
                                description: operator represents a key's relationship
                                  to a set of values. Valid operators are In, NotIn,
                                  Exists and DoesNotExist.
                                type: string
                              values:
                                description: values is an array of string values.
                                  If the operator is In or NotIn, the values array
                                  must be non-empty. If the operator is Exists or
                                  DoesNotExist, the values array must be empty. This
                                  array is replaced during a strategic merge patch.
                                items:
                                  type: string
                                type: array
                            type: object
                          type: array
                        matchLabels:
                          description: matchLabels is a map of {key,value} pairs.
                            A single {key,value} in the matchLabels map is equivalent
                            to an element of matchExpressions, whose key field is
                            "key", the operator is "In", and the values array contains
                            only "value". The requirements are ANDed.
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                      type: object
                    version:
                      type: string
                  type: object
                type: array
              mode:
                description: Mode controls whether a failing policy will be rejected
                  (not admitted), or if errors are converted to Warnings. enforce
                  - Reject (default) warn - allow but warn
                type: string
              policy:
                description: Policy is an optional policy that can be applied against
                  all the successfully validated Authorities. If no authorities pass,
                  this does not even get evaluated, as the Policy is considered failed.
                properties:
                  configMapRef:
                    description: ConfigMapRef defines the reference to a configMap
                      with the policy definition.
                    properties:
                      key:
                        description: Key defines the key to pull from the configmap.
                        type: string
                      name:
                        description: Name is unique within a namespace to reference
                          a configmap resource.
                        type: string
                      namespace:
                        description: Namespace defines the space within which the
                          configmap name must be unique.
                        type: string
                    type: object
                  data:
                    description: Data contains the policy definition.
                    type: string
                  fetchConfigFile:
                    description: 'FetchConfigFile controls whether ConfigFile will
                      be fetched and made available for CIP level policy evaluation.
                      Note that this only gets evaluated (and hence fetched) iff at
                      least one authority matches. The ConfigFile will then be available
                      in this format: https://github.com/opencontainers/image-spec/blob/main/config.md'
                    type: boolean
                  includeObjectMeta:
                    description: IncludeObjectMeta controls whether the ObjectMeta
                      will be included and made available for CIP level policy evalutation.
                      Note that this only gets evaluated iff at least one authority
                      matches.
                    type: boolean
                  includeSpec:
                    description: IncludeSpec controls whether resource `Spec` will
                      be included and made available for CIP level policy evaluation.
                      Note that this only gets evaluated iff at least one authority
                      matches. Also note that because Spec may be of a different shape
                      depending on the resource being evaluatied (see MatchResource
                      for filtering) you might want to configure these to match the
                      policy file to ensure the shape of the Spec is what you expect
                      when evaling the policy.
                    type: boolean
                  includeTypeMeta:
                    description: IncludeTypeMeta controls whether the TypeMeta will
                      be included and made available for CIP level policy evalutation.
                      Note that this only gets evaluated iff at least one authority
                      matches.
                    type: boolean
                  remote:
                    description: Remote defines the url to a policy.
                    properties:
                      sha256sum:
                        description: Sha256sum defines the exact sha256sum computed
                          out of the 'body' of the http response.
                        type: string
                      url:
                        description: URL to the policy data.
                        type: string
                    type: object
                  type:
                    description: Which kind of policy this is, currently only rego
                      or cue are supported. Furthermore, only cue is tested :)
                    type: string
                type: object
            type: object
          status:
            description: Status represents the current state of the ClusterImagePolicy.
              This data may be out of date.
            properties:
              annotations:
                description: Annotations is additional Status fields for the Resource
                  to save some additional State as well as convey more information
                  to the user. This is roughly akin to Annotations on any k8s resource,
                  just the reconciler conveying richer information outwards.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              conditions:
                description: Conditions the latest available observations of a resource's
                  current state.
                items:
                  properties:
                    lastTransitionTime:
                      description: LastTransitionTime is the last time the condition
                        transitioned from one status to another. We use VolatileTime
                        in place of metav1.Time to exclude this from creating equality.Semantic
                        differences (all other things held constant).
                      type: string
                    message:
                      description: A human readable message indicating details about
                        the transition.
                      type: string
                    reason:
                      description: The reason for the condition's last transition.
                      type: string
                    severity:
                      description: Severity with which to treat failures of this type
                        of condition. When this is not specified, it defaults to Error.
                      type: string
                    status:
                      description: Status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: Type of condition.
                      type: string
                  required:
                  - type
                  - status
                  type: object
                type: array
              observedGeneration:
                description: ObservedGeneration is the 'Generation' of the Service
                  that was last processed by the controller.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
