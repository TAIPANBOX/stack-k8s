# Reverses keyryx/heraldyx-findings-patch.yaml (CLAUDE.md invariant 75): heraldyx reads the bus alone again, the
# witness-state mount and the pod affinity to the witness go. The value of HERALDYX_EVENTS is the one
# manifests/45-heraldyx.yaml declares.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heraldyx
  namespace: agent-stack
spec:
  template:
    spec:
      # 45-heraldyx.yaml declares no affinity, so the whole field goes (an empty one would stay).
      affinity: null
      containers:
        - name: heraldyx
          env:
            - name: HERALDYX_EVENTS
              value: "/var/lib/stack/events"
          # Keyed by mountPath, not by name: a delete by name is refused and reverts nothing.
          volumeMounts:
            - mountPath: /var/lib/keyryx-findings
              $patch: delete
      volumes:
        - name: keyryx-findings
          $patch: delete
