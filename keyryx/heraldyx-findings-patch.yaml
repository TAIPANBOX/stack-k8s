# heraldyx reads the Keyryx witness's findings (CLAUDE.md invariant 75). Applied by lib/keyryx-install.sh with
# `kubectl patch --type strategic`, after heraldyx is applied: a patch leaves the last-applied annotation alone, so
# manifests/45-heraldyx.yaml stays what an install without Keyryx applies (invariant 24's mechanism).
# keyryx/heraldyx-findings-unpatch.yaml reverses it.
#
# @decided 2026-10-20 (paraphrased): the findings reach their readers through the witness's own claim,
# keyryx-witness-state, mounted read only through subPath alerts, with each reader placed on the witness's node; no
# new volume is added. The claim is ReadWriteOnce (Longhorn), so heraldyx is pod-affined to the witness, as the
# record-seal is (invariant 70). subPath alerts is the only part of the claim it sees: never data/, where the
# witness key lives. The witness makes alerts/ 0750 and keyryx.ndjson 0640 in group 10001, and heraldyx reads them
# through its supplementalGroups 10001.
#
# HERALDYX_EVENTS names the file itself, never its directory: heraldyx v0.8.1 reads a named *.ndjson entry only
# while it is a regular file, and opens every stream without following a link or waiting on a FIFO.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heraldyx
  namespace: agent-stack
spec:
  template:
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: keyryx-witness
              topologyKey: kubernetes.io/hostname
      containers:
        - name: heraldyx
          env:
            - name: HERALDYX_EVENTS
              value: "/var/lib/stack/events,/var/lib/keyryx-findings/keyryx.ndjson"
          volumeMounts:
            - name: keyryx-findings
              mountPath: /var/lib/keyryx-findings
              subPath: alerts
              readOnly: true
      volumes:
        - name: keyryx-findings
          persistentVolumeClaim:
            claimName: keyryx-witness-state
            readOnly: true
