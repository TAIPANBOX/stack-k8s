# heraldyx reads the Keyryx witness's findings (CLAUDE.md invariant 75). Applied by lib/keyryx-install.sh with
# `kubectl patch --type strategic`, after heraldyx is applied: a patch leaves the last-applied annotation alone, so
# manifests/45-heraldyx.yaml stays what an install without Keyryx applies (invariant 24's mechanism).
# keyryx/heraldyx-findings-unpatch.yaml reverses it.
#
# @decided 2026-10-20 (paraphrased): the findings reach their readers through the witness's own claim,
# keyryx-witness-state, mounted read only through subPath alerts, with each reader placed on the witness's node; no
# new volume is added. The claim is ReadWriteOnce (Longhorn), so heraldyx is pod-affined to the witness, as the
# record-seal is (invariant 70). subPath alerts is the only part of the claim it sees: never data/, where the
# witness key lives. The witness makes alerts/ 0750 and keyryx.ndjson 0640 in group 10001 (the kubelet's fsGroup can make
# the file 0660 on a later start of the witness, which a read-only reader cannot use), and heraldyx reads them
# through its supplementalGroups 10001.
#
# HERALDYX_EVENTS names the file itself, never its directory: heraldyx v0.8.1 reads a named *.ndjson entry only
# while it is a regular file, and opens every stream without following a link or waiting on a FIFO.
#
# The same patch gives heraldyx Keyryx custody's own stream (keyryx v0.2.0, CLAUDE.md invariant 97): custody/ on
# the events claim, mounted read only through subPath custody, and keyryx-custody.ndjson named in HERALDYX_EVENTS.
# heraldyx v0.10.0 reads it as source keyryx and mails key_revoked (high); key_rotated is info, below the "high"
# floor 45-heraldyx.yaml sets. The events claim is ReadWriteMany, so this mount adds no placement.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heraldyx
  namespace: agent-stack
spec:
  template:
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: keyryx-witness
              topologyKey: kubernetes.io/hostname
      containers:
        - name: heraldyx
          # The pin manifests/45-heraldyx.yaml names, carried here too: heraldyx is applied only on a run that names a
          # recipient, so a later run without one would otherwise patch an older heraldyx, which does not know
          # keyryx-custody.ndjson (v0.10.0 is the first) and drops every line of it as foreign. The unpatch leaves the
          # image as it is, which is the pin. scripts/keyryx-custody-announces.sh holds the two equal.
          image: ghcr.io/taipanbox/heraldyx:v0.10.0@sha256:7baa8cdb8508afde33b8366141f433ae4bea1688caefde6b4f5d48a21af183c1
          env:
            - name: HERALDYX_EVENTS
              value: "/var/lib/stack/events,/var/lib/keyryx-findings/keyryx.ndjson,/var/lib/stack/keyryx-custody/keyryx-custody.ndjson"
          volumeMounts:
            - name: keyryx-findings
              mountPath: /var/lib/keyryx-findings
              subPath: alerts
              readOnly: true
            - name: events
              mountPath: /var/lib/stack/keyryx-custody
              subPath: custody
              readOnly: true
      volumes:
        - name: keyryx-findings
          persistentVolumeClaim:
            claimName: keyryx-witness-state
            readOnly: true
