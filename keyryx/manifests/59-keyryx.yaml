# Keyryx on the cluster: key custody and its independent witness (wave 2, L2).
#
# OPT-IN. Not in manifests/kustomization.yaml: `kubectl apply -k manifests/`
# never applies this file. keyryx/up.sh is the only path that does, after it
# has minted the root keys and the policy. Design: wave2/KEYRYX-DESIGN.md
# sections 2 to 5 (5.2 is this file). CLAUDE.md invariants 55 to 57 hold the
# rules this file must keep: the root key is copied in by its own init
# container and never reaches an environment (55); the witness shares nothing
# with custody but the image, and reads the event streams read only (56); only
# labelled consumers reach a Keyryx role, and neither has egress (57).
#
# Images: keyryx v0.1.0, pinned by the index digest of the tag. busybox is
# used once, by the init containers, to copy a root key from a Secret into a
# memory volume: the distroless keyryx image has no shell, and the key file
# must be owned by the role's own uid, which a Secret volume cannot provide.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keyryx-custody
  namespace: agent-stack
  labels: { app.kubernetes.io/part-of: agent-stack }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keyryx-witness
  namespace: agent-stack
  labels: { app.kubernetes.io/part-of: agent-stack }
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keyryx-state
  namespace: agent-stack
  labels: { app.kubernetes.io/part-of: agent-stack }
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keyryx-witness-state
  namespace: agent-stack
  labels: { app.kubernetes.io/part-of: agent-stack }
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keyryx-custody
  namespace: agent-stack
  labels: { app.kubernetes.io/part-of: agent-stack, app.kubernetes.io/name: keyryx-custody }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: keyryx-custody }
  template:
    metadata:
      labels: { app: keyryx-custody, app.kubernetes.io/part-of: agent-stack }
    spec:
      serviceAccountName: keyryx-custody
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 20101
        runAsGroup: 20101
        fsGroup: 20101
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: root-key-copy
          image: busybox@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          command:
            - sh
            - -c
            - >-
              mkdir -p /var/lib/keyryx/data && chmod 0700 /var/lib/keyryx/data &&
              cp /in/root.key /run/keyryx/root.key && chmod 0400 /run/keyryx/root.key
          securityContext:
            runAsNonRoot: true
            runAsUser: 20101
            runAsGroup: 20101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: keyryx-root
              mountPath: /in
              readOnly: true
            - name: keyryx-state
              mountPath: /var/lib/keyryx
            - name: keyryx-key-tmp
              mountPath: /run/keyryx
      containers:
        - name: keyryx
          image: ghcr.io/taipanbox/keyryx:v0.1.2@sha256:9b6d4e0e8988076e90843d9d1625e50a7f248f6be531e144a6950ff9233f7683
          args: [custody]
          env:
            - name: KEYRYX_DATA
              value: /var/lib/keyryx/data
            - name: KEYRYX_ROOT_KEY_FILE
              value: /run/keyryx/root.key
            - name: KEYRYX_POLICY
              value: /etc/keyryx/policy.json
            - name: KEYRYX_ADDR
              value: 0.0.0.0:4340
          ports:
            - name: http
              containerPort: 4340
          readinessProbe:
            httpGet: { path: /healthz, port: 4340 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 4340 }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: keyryx-state
              mountPath: /var/lib/keyryx
            - name: keyryx-key-tmp
              mountPath: /run/keyryx
              readOnly: true
            - name: keyryx-policy
              mountPath: /etc/keyryx
              readOnly: true
      volumes:
        - name: keyryx-root
          secret:
            secretName: keyryx-root
            defaultMode: 0440
        - name: keyryx-key-tmp
          emptyDir: { medium: Memory, sizeLimit: 1Mi }
        - name: keyryx-state
          persistentVolumeClaim:
            claimName: keyryx-state
        - name: keyryx-policy
          configMap:
            name: keyryx-policy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keyryx-witness
  namespace: agent-stack
  labels: { app.kubernetes.io/part-of: agent-stack, app.kubernetes.io/name: keyryx-witness }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: keyryx-witness }
  template:
    metadata:
      labels: { app: keyryx-witness, app.kubernetes.io/part-of: agent-stack }
    spec:
      serviceAccountName: keyryx-witness
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 20100
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: root-key-copy
          image: busybox@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          command:
            - sh
            - -c
            - >-
              mkdir -p /var/lib/keyryx-witness/data && chmod 0700 /var/lib/keyryx-witness/data &&
              mkdir -p /var/lib/keyryx-witness/alerts &&
              mkdir -p /var/lib/keyryx-witness/data/attestations && chmod 0750 /var/lib/keyryx-witness/data/attestations &&
              cp /in/root.key /run/keyryx/root.key && chmod 0400 /run/keyryx/root.key
          securityContext:
            runAsNonRoot: true
            runAsUser: 20100
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: keyryx-witness-root
              mountPath: /in
              readOnly: true
            - name: keyryx-witness-state
              mountPath: /var/lib/keyryx-witness
            - name: keyryx-key-tmp
              mountPath: /run/keyryx
      containers:
        - name: keyryx-witness
          image: ghcr.io/taipanbox/keyryx:v0.1.2@sha256:9b6d4e0e8988076e90843d9d1625e50a7f248f6be531e144a6950ff9233f7683
          args: [witness]
          env:
            - name: KEYRYX_WITNESS_DATA
              value: /var/lib/keyryx-witness/data
            - name: KEYRYX_WITNESS_ROOT_KEY_FILE
              value: /run/keyryx/root.key
            - name: KEYRYX_WITNESS_EVENTS
              value: /var/lib/stack/events
            - name: KEYRYX_WITNESS_ALERTS
              value: /var/lib/keyryx-witness/alerts/keyryx.ndjson
            - name: KEYRYX_WITNESS_ADDR
              value: 0.0.0.0:4341
            # The record the witness countersigns: tenant|directory, the tenant trailryx-node seals as by default
            # (acme) and the directory it seals into, read-only (CLAUDE.md invariant 70). The witness writes its
            # attestation for each sealed root under KEYRYX_WITNESS_DATA/attestations (keyryx v0.1.2).
            - name: KEYRYX_WITNESS_RECORDS
              value: "acme|/var/lib/stack/records"
          ports:
            - name: http
              containerPort: 4341
          readinessProbe:
            httpGet: { path: /healthz, port: 4341 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 4341 }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 512Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: events
              mountPath: /var/lib/stack/events
              readOnly: true
            - name: keyryx-witness-state
              mountPath: /var/lib/keyryx-witness
            - name: keyryx-key-tmp
              mountPath: /run/keyryx
              readOnly: true
            # The trailryx record, read-only. RWO (ReadWriteOnce): the witness shares it only with pods on its own
            # node, which is why the record-seal is pod-affined to the witness (record-seal-patch.yaml, invariant 70).
            - name: trailryx-records
              mountPath: /var/lib/stack/records
              readOnly: true
      volumes:
        - name: keyryx-witness-root
          secret:
            secretName: keyryx-witness-root
            defaultMode: 0440
        - name: keyryx-key-tmp
          emptyDir: { medium: Memory, sizeLimit: 1Mi }
        - name: keyryx-witness-state
          persistentVolumeClaim:
            claimName: keyryx-witness-state
        - name: events
          persistentVolumeClaim:
            claimName: stack-events
        - name: trailryx-records
          persistentVolumeClaim:
            claimName: trailryx-records
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: keyryx-custody
  namespace: agent-stack
  labels: { app.kubernetes.io/part-of: agent-stack }
spec:
  type: ClusterIP
  selector: { app: keyryx-custody }
  ports:
    - name: http
      port: 4340
      targetPort: 4340
---
apiVersion: v1
kind: Service
metadata:
  name: keyryx-witness
  namespace: agent-stack
  labels: { app.kubernetes.io/part-of: agent-stack }
spec:
  type: ClusterIP
  selector: { app: keyryx-witness }
  ports:
    - name: http
      port: 4341
      targetPort: 4341
---
# Only a pod labelled keyryx-consumer: "true" reaches custody. Its egress is
# empty: custody calls nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keyryx-custody-ingress
  namespace: agent-stack
spec:
  podSelector:
    matchLabels: { app: keyryx-custody }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { keyryx-consumer: "true" }
      ports:
        - port: 4340
          protocol: TCP
  egress: []
---
# Only a pod labelled keyryx-witness-client: "true" reaches the witness: the
# console, when it asks for the witness's log. The witness calls nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keyryx-witness-ingress
  namespace: agent-stack
spec:
  podSelector:
    matchLabels: { app: keyryx-witness }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { keyryx-witness-client: "true" }
      ports:
        - port: 4341
          protocol: TCP
  egress: []
