# Keyryx on the cluster: key custody and its independent witness (wave 2, L2).
#
# OPT-IN. Not in manifests/kustomization.yaml: `kubectl apply -k manifests/`
# never applies this file. keyryx/up.sh is the only path that does, after it
# has minted the root keys and the policy. Design: wave2/KEYRYX-DESIGN.md
# sections 2 to 5 (5.2 is this file). CLAUDE.md invariants 55 to 57 hold the
# rules this file must keep: the root key is copied in by its own init
# container and never reaches an environment (55); the witness shares nothing
# with custody but the image, and reads the event streams read only (56); only
# labelled consumers reach a Keyryx role, and neither has egress (57).
#
# Images: keyryx v0.2.0, pinned by the index digest of the tag. busybox is
# used once, by the init containers, to copy a root key from a Secret into a
# memory volume: the distroless keyryx image has no shell, and the key file
# must be owned by the role's own uid, which a Secret volume cannot provide.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keyryx-custody
  namespace: agent-stack
  labels: { app.kubernetes.io/part-of: agent-stack }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keyryx-witness
  namespace: agent-stack
  labels: { app.kubernetes.io/part-of: agent-stack }
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keyryx-state
  namespace: agent-stack
  labels: { app.kubernetes.io/part-of: agent-stack }
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keyryx-witness-state
  namespace: agent-stack
  labels: { app.kubernetes.io/part-of: agent-stack }
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keyryx-custody
  namespace: agent-stack
  labels: { app.kubernetes.io/part-of: agent-stack, app.kubernetes.io/name: keyryx-custody }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: keyryx-custody }
  template:
    metadata:
      labels: { app: keyryx-custody, app.kubernetes.io/part-of: agent-stack }
    spec:
      serviceAccountName: keyryx-custody
      automountServiceAccountToken: false
      # runAsGroup 10001, the bus group: custody's announcements (keyryx-custody.ndjson, keyryx v0.2.0) are read
      # by heraldyx in that group. fsGroup 20101 keeps custody's own state claim in custody's own group, and gives
      # the pod group 20101, which may create a name in custody/ on the events claim (CLAUDE.md invariant 97).
      securityContext:
        runAsNonRoot: true
        runAsUser: 20101
        runAsGroup: 10001
        fsGroup: 20101
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # bus-ready (CLAUDE.md invariants 89 and 97): custody/ on the events claim is made by the bus-owner Job
        # (manifests/11-bus.yaml). kubelet would make a missing subPath itself, as root 0777, and the owner then refuses
        # a directory it did not make, so the pod waits, reading the volume root READ ONLY, for the marker AND for
        # custody/ as the owner leaves it: a marker of an earlier layout, from before custody/, is not enough.
        - name: bus-ready
          image: busybox@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          securityContext: { runAsNonRoot: true, runAsUser: 20101, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          command: ["sh", "-c", "i=0; until [ -f /bus/streams/.layout ] && [ \"$(stat -c %u:%g:%a /bus/custody 2>/dev/null)\" = 20000:20101:771 ]; do i=$((i+1)); if [ $i -gt 300 ]; then echo 'streams/.layout or custody/ is not there: the bus-owner Job has not made the bus'; exit 1; fi; sleep 2; done"]
          volumeMounts: [{ name: events, mountPath: /bus, readOnly: true }]
        # custody's own stream (keyryx v0.2.0, CLAUDE.md invariants 59 and 97), made before custody starts, by
        # custody's uid in the bus group, 0640. keyryx writes its announcements only into a regular file with one
        # link that custody's uid owns (internal/announce/bus.go), so it cannot sit in streams/, where every file is
        # the bus owner's: it sits in custody/, beside the bus, which only the owner and group 20101 may write.
        - name: precreate-streams
          image: busybox@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          command: ["sh", "-c", "umask 027 && { [ -e /var/lib/stack/events/keyryx-custody.ndjson ] || : > /var/lib/stack/events/keyryx-custody.ndjson; } && ls -ln /var/lib/stack/events"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 20101
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: events
              mountPath: /var/lib/stack/events
              subPath: custody
        - name: root-key-copy
          image: busybox@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          command:
            - sh
            - -c
            - >-
              mkdir -p /var/lib/keyryx/data && chmod 0700 /var/lib/keyryx/data &&
              cp /in/root.key /run/keyryx/root.key && chmod 0400 /run/keyryx/root.key
          securityContext:
            runAsNonRoot: true
            runAsUser: 20101
            runAsGroup: 20101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: keyryx-root
              mountPath: /in
              readOnly: true
            - name: keyryx-state
              mountPath: /var/lib/keyryx
            - name: keyryx-key-tmp
              mountPath: /run/keyryx
      containers:
        - name: keyryx
          image: ghcr.io/taipanbox/keyryx:v0.2.0@sha256:ead031a117958ce34c9157937713c000a3d6a0cea86e0ce1d0bc05fce5270c38
          args: [custody]
          env:
            - name: KEYRYX_DATA
              value: /var/lib/keyryx/data
            - name: KEYRYX_ROOT_KEY_FILE
              value: /run/keyryx/root.key
            - name: KEYRYX_POLICY
              value: /etc/keyryx/policy.json
            - name: KEYRYX_ADDR
              value: 0.0.0.0:4340
            # Required from keyryx v0.2.0: every rotation and revocation, made only with `keyryx admin` on the admin
            # socket in KEYRYX_DATA (kubectl exec into this container, as custody's own uid), is announced here as
            # key_rotated or key_revoked. The same path as stack-single's; here it is custody/ on the events claim,
            # mounted at /var/lib/stack/events in this pod alone (CLAUDE.md invariant 97). KEYRYX_ADMIN_KEYS is set
            # nowhere: keyryx v0.2.0 refuses to start when it is.
            - name: KEYRYX_EVENTS
              value: /var/lib/stack/events/keyryx-custody.ndjson
          ports:
            - name: http
              containerPort: 4340
          readinessProbe:
            httpGet: { path: /healthz, port: 4340 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 4340 }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: keyryx-state
              mountPath: /var/lib/keyryx
            - name: keyryx-key-tmp
              mountPath: /run/keyryx
              readOnly: true
            - name: keyryx-policy
              mountPath: /etc/keyryx
              readOnly: true
            # custody/ on the events claim, never streams/: the witness reads streams/, and custody cannot write
            # what the witness reads (CLAUDE.md invariant 56).
            - name: events
              mountPath: /var/lib/stack/events
              subPath: custody
      volumes:
        - name: events
          persistentVolumeClaim:
            claimName: stack-events
        - name: keyryx-root
          secret:
            secretName: keyryx-root
            defaultMode: 0440
        - name: keyryx-key-tmp
          emptyDir: { medium: Memory, sizeLimit: 1Mi }
        - name: keyryx-state
          persistentVolumeClaim:
            claimName: keyryx-state
        - name: keyryx-policy
          configMap:
            name: keyryx-policy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keyryx-witness
  namespace: agent-stack
  labels: { app.kubernetes.io/part-of: agent-stack, app.kubernetes.io/name: keyryx-witness }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: keyryx-witness }
  template:
    metadata:
      labels: { app: keyryx-witness, app.kubernetes.io/part-of: agent-stack }
    spec:
      serviceAccountName: keyryx-witness
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 20100
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      # bus-ready (CLAUDE.md invariant 89, GAPS G3.16): this pod mounts the bus as subPath streams, which
      # the bus-owner Job (manifests/11-bus.yaml) makes. kubelet would make a missing subPath itself, as
      # root 0777, so the pod waits for the owner's marker first, reading the volume root READ ONLY.
      initContainers:
        - name: bus-ready
          image: busybox@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          securityContext: { runAsNonRoot: true, runAsUser: 20100, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          command: ["sh", "-c", "i=0; until [ -f /bus/streams/.layout ]; do i=$((i+1)); if [ $i -gt 300 ]; then echo 'streams/.layout is not there: the bus-owner Job has not made the bus'; exit 1; fi; sleep 2; done"]
          volumeMounts: [{ name: events, mountPath: /bus, readOnly: true }]
        - name: root-key-copy
          image: busybox@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          command:
            - sh
            - -c
            - >-
              mkdir -p /var/lib/keyryx-witness/data && chmod 0700 /var/lib/keyryx-witness/data &&
              mkdir -p /var/lib/keyryx-witness/data/attestations && chmod 0750 /var/lib/keyryx-witness/data/attestations &&
              cp /in/root.key /run/keyryx/root.key && chmod 0400 /run/keyryx/root.key
          securityContext:
            runAsNonRoot: true
            runAsUser: 20100
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: keyryx-witness-root
              mountPath: /in
              readOnly: true
            - name: keyryx-witness-state
              mountPath: /var/lib/keyryx-witness
            - name: keyryx-key-tmp
              mountPath: /run/keyryx
        # The witness's findings, made before the witness starts, by its own uid, in the bus group its readers
        # share (CLAUDE.md invariants 59 and 75): the directory alerts/ 0750 and keyryx.ndjson 0640 (0660 after a later start, the kubelet's fsGroup) on its own
        # state claim. heraldyx and the console mount only that directory, through subPath alerts, read only
        # (keyryx/heraldyx-findings-patch.yaml, keyryx/console-findings-patch.yaml), so they never see data/,
        # where the witness key lives.
        - name: precreate-streams
          image: busybox@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          command: ["sh", "-c", "umask 027 && mkdir -p /var/lib/keyryx-witness/alerts && chmod 0750 /var/lib/keyryx-witness/alerts && { [ -e /var/lib/keyryx-witness/alerts/keyryx.ndjson ] || : > /var/lib/keyryx-witness/alerts/keyryx.ndjson; }"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 20100
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: keyryx-witness-state
              mountPath: /var/lib/keyryx-witness
      containers:
        - name: keyryx-witness
          image: ghcr.io/taipanbox/keyryx:v0.2.0@sha256:ead031a117958ce34c9157937713c000a3d6a0cea86e0ce1d0bc05fce5270c38
          args: [witness]
          env:
            - name: KEYRYX_WITNESS_DATA
              value: /var/lib/keyryx-witness/data
            - name: KEYRYX_WITNESS_ROOT_KEY_FILE
              value: /run/keyryx/root.key
            - name: KEYRYX_WITNESS_EVENTS
              value: /var/lib/stack/events
            # Its findings, off the bus it witnesses, on its own state claim (CLAUDE.md invariant 75): the
            # console and heraldyx read this file through a read-only subPath mount of alerts/.
            - name: KEYRYX_WITNESS_ALERTS
              value: /var/lib/keyryx-witness/alerts/keyryx.ndjson
            - name: KEYRYX_WITNESS_ADDR
              value: 0.0.0.0:4341
            # The record the witness countersigns: tenant|directory, the tenant trailryx-node seals as by default
            # (acme) and the directory it seals into, read-only (CLAUDE.md invariant 70). The witness writes its
            # attestation for each sealed root under KEYRYX_WITNESS_DATA/attestations (keyryx v0.1.2).
            - name: KEYRYX_WITNESS_RECORDS
              value: "acme|/var/lib/stack/records"
          ports:
            - name: http
              containerPort: 4341
          readinessProbe:
            httpGet: { path: /healthz, port: 4341 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 4341 }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 1Gi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: events
              mountPath: /var/lib/stack/events
              readOnly: true
              subPath: streams
            - name: keyryx-witness-state
              mountPath: /var/lib/keyryx-witness
            - name: keyryx-key-tmp
              mountPath: /run/keyryx
              readOnly: true
            # The trailryx record, read-only. RWO (ReadWriteOnce): the witness shares it only with pods on its own
            # node, which is why the record-seal is pod-affined to the witness (record-seal-patch.yaml, invariant 70).
            - name: trailryx-records
              mountPath: /var/lib/stack/records
              readOnly: true
      volumes:
        - name: keyryx-witness-root
          secret:
            secretName: keyryx-witness-root
            defaultMode: 0440
        - name: keyryx-key-tmp
          emptyDir: { medium: Memory, sizeLimit: 1Mi }
        - name: keyryx-witness-state
          persistentVolumeClaim:
            claimName: keyryx-witness-state
        # Read only on the claim as well as on the mount (invariant 75): a
        # container added later that mounts this volume cannot write the bus.
        - name: events
          persistentVolumeClaim:
            claimName: stack-events
            readOnly: true
        - name: trailryx-records
          persistentVolumeClaim:
            claimName: trailryx-records
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: keyryx-custody
  namespace: agent-stack
  labels: { app.kubernetes.io/part-of: agent-stack }
spec:
  type: ClusterIP
  selector: { app: keyryx-custody }
  ports:
    - name: http
      port: 4340
      targetPort: 4340
---
apiVersion: v1
kind: Service
metadata:
  name: keyryx-witness
  namespace: agent-stack
  labels: { app.kubernetes.io/part-of: agent-stack }
spec:
  type: ClusterIP
  selector: { app: keyryx-witness }
  ports:
    - name: http
      port: 4341
      targetPort: 4341
---
# Only a pod labelled keyryx-consumer: "true" reaches custody. Its egress is
# empty: custody calls nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keyryx-custody-ingress
  namespace: agent-stack
spec:
  podSelector:
    matchLabels: { app: keyryx-custody }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { keyryx-consumer: "true" }
      ports:
        - port: 4340
          protocol: TCP
  egress: []
---
# Only a pod labelled keyryx-witness-client: "true" reaches the witness: the
# console, when it asks for the witness's log. The witness calls nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keyryx-witness-ingress
  namespace: agent-stack
spec:
  podSelector:
    matchLabels: { app: keyryx-witness }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { keyryx-witness-client: "true" }
      ports:
        - port: 4341
          protocol: TCP
  egress: []
