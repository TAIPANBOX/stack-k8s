# Reverses keyryx/record-seal-patch.yaml (CLAUDE.md invariants 69 and 70): the signer, its custody URL and credential
# file come off, the consumer label goes, the pod affinity to the witness goes, and the credential and witness-state mounts go with
# them. The credential secret and the policy stay, because keyryx/down.sh and the opt-out say so.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: record-seal
  namespace: agent-stack
spec:
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            keyryx-consumer: null
        spec:
          affinity: null
          containers:
            - name: trailryx
              env:
                - name: TRAILRYX_SIGNER
                  $patch: delete
                - name: TRAILRYX_KEYRYX_URL
                  $patch: delete
                - name: TRAILRYX_KEYRYX_CREDENTIAL_FILE
                  $patch: delete
                - name: TRAILRYX_KEYRYX_KID
                  $patch: delete
                - name: TRAILRYX_WITNESS_ATTESTATIONS
                  $patch: delete
              # Keyed by mountPath, not by name: a delete by name is refused and reverts nothing.
              volumeMounts:
                - mountPath: /run/keyryx-client
                  $patch: delete
                - mountPath: /var/lib/stack/attestations
                  $patch: delete
          volumes:
            - name: keyryx-client
              $patch: delete
            - name: witness-attestations
              $patch: delete
