# The record-seal CronJob signs each sealed root through Keyryx, and reads the witness's attestations (CLAUDE.md
# invariants 69 and 70). Applied by lib/keyryx-install.sh with `kubectl patch --type strategic`, after `apply -k`: a
# patch leaves the last-applied annotation alone, so the default manifests/40-routines-and-secrets.yaml stays what the
# default install applies (invariant 24's mechanism). keyryx/record-seal-unpatch.yaml reverses it.
#
# Two ReadWriteOnce (Longhorn) claims are shared with the witness: trailryx-records (the record) and
# keyryx-witness-state (its attestations). A RWO volume is mounted on one node, so the record-seal is pod-affined to
# the witness, which runs on that node. The witness state is mounted through subPath data/attestations only, so the
# record-seal never sees the witness key, which sits in the same claim's data directory.
#
# TRAILRYX_WITNESS_ATTESTATIONS points at the read-only attestations mount. keyryx v0.1.2 writes each attestation 0640
# and its directories 0750, and the witness runs as group 10001, so the record-seal (uid 10001) reads the files and
# nothing else of the witness's state (CLAUDE.md invariant 70).
#
# TRAILRYX_KEYRYX_KID is read from the stack-wiring ConfigMap, which lib/keyryx-install.sh fills with custody's kid
# before this patch is applied (CLAUDE.md invariant 73). It is not optional: a seal with no pin refuses to start.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: record-seal
  namespace: agent-stack
spec:
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            keyryx-consumer: "true"
        spec:
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: keyryx-witness
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: trailryx
              env:
                - name: TRAILRYX_SIGNER
                  value: keyryx
                - name: TRAILRYX_KEYRYX_URL
                  value: http://keyryx-custody.agent-stack.svc.cluster.local:4340
                - name: TRAILRYX_KEYRYX_CREDENTIAL_FILE
                  value: /run/keyryx-client/credential
                - name: TRAILRYX_KEYRYX_KID
                  valueFrom: { configMapKeyRef: { name: stack-wiring, key: TRAILRYX_KEYRYX_KID, optional: false } }
                - name: TRAILRYX_WITNESS_ATTESTATIONS
                  value: /var/lib/stack/attestations
              volumeMounts:
                - name: keyryx-client
                  mountPath: /run/keyryx-client
                  readOnly: true
                - name: witness-attestations
                  mountPath: /var/lib/stack/attestations
                  subPath: data/attestations
                  readOnly: true
          volumes:
            - name: keyryx-client
              secret:
                secretName: keyryx-trailryx-client
                defaultMode: 0440
                items:
                  - key: credential
                    path: credential
            - name: witness-attestations
              persistentVolumeClaim:
                claimName: keyryx-witness-state
                readOnly: true
