# Reverses keyryx/wardryx-patch.yaml: the image the default manifest pins, the three signer
# variables and the v2 deadline gone, the client volume gone, the label gone.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wardryx
  namespace: agent-stack
spec:
  template:
    metadata:
      labels:
        keyryx-consumer: null
    spec:
      containers:
        - name: wardryx
          image: ghcr.io/taipanbox/wardryx:v2.4.0@sha256:8a110dec235fd81c3907ed769d2c31a8e095767fbae4fa29316631eff5228e97
          env:
            - name: WARDRYX_APPROVAL_SIGNER
              $patch: delete
            - name: WARDRYX_KEYRYX_URL
              $patch: delete
            - name: WARDRYX_KEYRYX_CREDENTIAL_FILE
              $patch: delete
            - name: WARDRYX_APPROVAL_V2_UNTIL
              $patch: delete
          volumeMounts:
            - name: keyryx-client
              $patch: delete
      volumes:
        - name: keyryx-client
          $patch: delete
