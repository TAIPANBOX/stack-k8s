# Reverses keyryx/wardryx-patch.yaml: the image the default manifest pins, the three signer
# variables and the v2 deadline gone, the client volume gone, the label gone.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wardryx
  namespace: agent-stack
spec:
  template:
    metadata:
      labels:
        keyryx-consumer: null
    spec:
      containers:
        - name: wardryx
          image: ghcr.io/taipanbox/wardryx:v2.3.0@sha256:eaa8cff9fe3722f7040e9f9b3aac2f57c5e66afb7a012a0eda1a62e63b647543
          env:
            - name: WARDRYX_APPROVAL_SIGNER
              $patch: delete
            - name: WARDRYX_KEYRYX_URL
              $patch: delete
            - name: WARDRYX_KEYRYX_CREDENTIAL_FILE
              $patch: delete
            - name: WARDRYX_APPROVAL_V2_UNTIL
              $patch: delete
          volumeMounts:
            - name: keyryx-client
              $patch: delete
      volumes:
        - name: keyryx-client
          $patch: delete
