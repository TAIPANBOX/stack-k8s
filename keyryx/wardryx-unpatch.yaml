# Reverses keyryx/wardryx-patch.yaml: the image the default manifest pins, the three signer
# variables and the v2 deadline gone, the client volume gone, the label gone.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wardryx
  namespace: agent-stack
spec:
  template:
    metadata:
      labels:
        keyryx-consumer: null
    spec:
      containers:
        - name: wardryx
          image: ghcr.io/taipanbox/wardryx:v2.5.0@sha256:67470f6568cbbcec5c4b7c3bc4d52f7d86e98d6b166cd2ee6979d91f6e0c4779
          env:
            - name: WARDRYX_APPROVAL_SIGNER
              $patch: delete
            - name: WARDRYX_KEYRYX_URL
              $patch: delete
            - name: WARDRYX_KEYRYX_CREDENTIAL_FILE
              $patch: delete
            - name: WARDRYX_APPROVAL_V2_UNTIL
              $patch: delete
          # A volumeMount is keyed by mountPath in a strategic merge, not by name: a delete
          # by name is refused by the API server and reverts nothing (invariant 75's gate).
          volumeMounts:
            - mountPath: /run/keyryx-client
              $patch: delete
      volumes:
        - name: keyryx-client
          $patch: delete
