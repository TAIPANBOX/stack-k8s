# Reverses keyryx/wardryx-patch.yaml: the image the default manifest pins, the three signer
# variables and the v2 deadline gone, the client volume gone, the label gone.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wardryx
  namespace: agent-stack
spec:
  template:
    metadata:
      labels:
        keyryx-consumer: null
    spec:
      containers:
        - name: wardryx
          image: ghcr.io/taipanbox/wardryx:v2.2.1@sha256:67718da5ef5551767156ef0ea893765f448c484fcbb5dcce5923a0ca83b8c309
          env:
            - name: WARDRYX_APPROVAL_SIGNER
              $patch: delete
            - name: WARDRYX_KEYRYX_URL
              $patch: delete
            - name: WARDRYX_KEYRYX_CREDENTIAL_FILE
              $patch: delete
            - name: WARDRYX_APPROVAL_V2_UNTIL
              $patch: delete
          volumeMounts:
            - name: keyryx-client
              $patch: delete
      volumes:
        - name: keyryx-client
          $patch: delete
