# The delegation plane, vouchryx: the service that issues an agent its token (CLAUDE.md invariants 24
# and 54). It is in the DEFAULT install and runs agents-only: no identity provider, no trusted issuer.
# An agent is enrolled in the registry (ConfigMap vouchryx-agents, written by lib/vouchryx-mint.sh and
# by agent-tokens/up.sh), and vouchryx issues it a short-lived token for the one audience the stack
# names. The doors verify that token against vouchryx's own key set and revocation list (invariant 54)
# and wardryx verifies it again (invariant 63).
#
# @decided 2026-10-19 (paraphrased): the default install runs the agent token as the door credential,
# so vouchryx is part of it. Trusting an upstream identity provider stays a separate, opt-in decision,
# made by delegation/up.sh with three inputs named in advance (invariant 24).
#
# VOUCHRYX_AGENTS is REQUIRED: vouchryx refuses to start with neither an upstream issuer nor an enrolled
# agent, and the default install enrols the operator's agent at deploy time. VOUCHRYX_TRUSTED_ISSUERS and
# the workload issuers are optional: an install with no IdP starts with the registry alone.
#
# Reachable only from the doors (the gateway and the MCP broker), wardryx, the console and the agent pods
# (58-agent-tokens-network.yaml): a ClusterIP Service and NetworkPolicies that admit port 4310 from
# nothing else.
#
# The signing key and the revoke key are minted once, into the vouchryx-keys Secret, by lib/vouchryx-mint.sh
# on the deploy path. Without that Secret vouchryx waits in CreateContainerConfigError, by design.
#
# Two things the header of this file used to say are no longer true, and are recorded for the reader of the
# history: the plane is no longer opt-in, and its delegation door on the gateway is no longer a kubectl patch.
# The gateway's door is a manifest value now (10-planes.yaml), and its key set is fetched from this Service
# by an init container at start.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vouchryx-state
  namespace: agent-stack
  labels: { app: vouchryx, plane: money }
spec:
  # One writer, one pod: ordinary RWO. Holds VOUCHRYX_REVOCATIONS_PATH, so a
  # revocation survives a pod restart (requirement 3 below) rather than
  # resetting to "nothing revoked" the moment the pod is rescheduled.
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vouchryx
  namespace: agent-stack
  labels: { app: vouchryx, plane: money }
spec:
  replicas: 1
  # One RWO state volume (the revocation store), so never two pods at once:
  # a rolling update would wait for a second pod that cannot attach the same
  # disk, and sit there. Same reasoning as tokenfuse-cloud in 10-planes.yaml.
  strategy: { type: Recreate }
  selector: { matchLabels: { app: vouchryx } }
  template:
    metadata:
      labels: { app: vouchryx, plane: money }
    spec:
      # No workload here talks to the Kubernetes API; see CLAUDE.md
      # invariant 15. Without this every pod carries a projected token for
      # the namespace default ServiceAccount, bound to nothing today but
      # usable by a compromised container for discovery and SelfSubjectReview,
      # and by any future RBAC binding an operator adds to `default`.
      automountServiceAccountToken: false
      # 65532 is the distroless nonroot uid this image ships (the same image
      # runs `vouchryx-demo` too, via a command override, so nothing here
      # needs a second image).
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      # Leave a dead node in 30 s, not the default 300 s. CLAUDE.md
      # invariant 21. This pod holds a ReadWriteOnce claim (the revocation
      # store); on Longhorn, once evicted, it is force-deleted and its volume
      # released (the installers set node-down-pod-deletion-policy), so the
      # replacement attaches it elsewhere. On storage that cannot move a
      # volume (k3d's local-path) the replacement waits Pending for the node,
      # exactly as before.
      tolerations:
        - { key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
        - { key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
      # Creates both files vouchryx appends to before it starts, as its own uid (CLAUDE.md
      # invariant 59, GOTCHAS 135). An existing file is left as it is. Mode 0640, group 10001: the
      # events file is for the bus readers, and the revocation list is owned by this uid either way.
      initContainers:
        - name: precreate-streams
          image: busybox@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 10001, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          command: ["sh", "-c", "for f in /var/lib/stack/events/vouchryx.ndjson /var/lib/stack/delegation/revocations.ndjson; do if [ ! -e \"$f\" ]; then umask 027; : > \"$f\"; fi; done; ls -ln /var/lib/stack/events /var/lib/stack/delegation"]
          volumeMounts: [{ name: events, mountPath: /var/lib/stack/events }, { name: delegation-state, mountPath: /var/lib/stack/delegation }]
      containers:
        - name: vouchryx
          image: ghcr.io/taipanbox/vouchryx:v0.6.0@sha256:4a2b6b31be44b5391974785bdfca597a88bcc5ddd834d50830bd6b9537e9ab3d
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/vouchryx"]
          env:
            # vouchryx binds 127.0.0.1 by DEFAULT. In a pod that default fails
            # exactly the way tokenfuse-cloud's does in 10-planes.yaml: the
            # container runs, the readiness probe fails forever, because
            # kubelet probes the pod IP and the Service has no endpoint to
            # send to. 0.0.0.0 is the pod's own network namespace, which the
            # NetworkPolicy below is what actually narrows: ClusterIP, no
            # NodePort, no hostPort, and ingress admitted from exactly the
            # gateway and the console.
            - { name: VOUCHRYX_ADDR, value: "0.0.0.0:4310" }
            # This vouchryx instance's own address: the `iss` it puts on every
            # token it mints, and the `aud` an upstream-issued subject/actor
            # token must carry to be accepted here. In-cluster Service DNS,
            # not localhost: the one substantive change from stack-up's
            # up.sh, which wires this to 127.0.0.1 because there it genuinely
            # is one host.
            - { name: VOUCHRYX_ISSUER, value: "http://vouchryx:4310" }
            - name: VOUCHRYX_SIGNING_KEY
              value: "/etc/vouchryx/keys/signing.pem"
            # The operator's own upstream issuer(s): iss|aud|jwks-path, one
            # per line. delegation/up.sh refuses to apply this manifest at
            # all unless it already has this value (CLAUDE.md invariant 24),
            # so there is no permissive default here to fall back to.
            - name: VOUCHRYX_TRUSTED_ISSUERS
              valueFrom: { configMapKeyRef: { name: vouchryx-trusted-issuers, key: trusted_issuers, optional: true } }
            # The revocation bearer: a plain 32-byte hex credential, not a
            # signing key, generated by delegation/up.sh the same way
            # hub/add-site.sh mints a site key. Never printed to a log; see
            # that script's own header.
            # The one audience an agent token carries (CLAUDE.md invariant 54). The doors and wardryx verify
            # against the same value; vouchryx issues nothing for any other audience.
            - { name: VOUCHRYX_ALLOWED_AUDIENCES, value: "https://vouchryx.agent-stack.invalid" }
            # The agent registry: one line per enrolled agent, written by lib/vouchryx-mint.sh (the operator's
            # agent at deploy time) and replaced by agent-tokens/up.sh. Required: see the header.
            - name: VOUCHRYX_AGENTS
              valueFrom: { configMapKeyRef: { name: vouchryx-agents, key: agents } }
            # The cluster's own workload issuer, for an agent pod's projected token. Optional: an install with
            # no agent pod has none (agent-tokens/up.sh writes it when there is one).
            - name: VOUCHRYX_WORKLOAD_ISSUERS
              valueFrom: { configMapKeyRef: { name: vouchryx-workload, key: issuers, optional: true } }
            - name: VOUCHRYX_REVOKE_KEYS
              valueFrom: { secretKeyRef: { name: vouchryx-keys, key: revoke_key } }
            # Persisted on the volume above, so a revocation survives a pod
            # restart. Losing this path is not a smaller version of
            # delegation, it is delegation that forgets what it revoked.
            - { name: VOUCHRYX_REVOCATIONS_PATH, value: "/var/lib/stack/delegation/revocations.ndjson" }
            # Journalled on the same shared bus every other plane's history
            # lives on (README, "Fact 1").
            - { name: VOUCHRYX_EVENTS_PATH, value: "/var/lib/stack/events/vouchryx.ndjson" }
          ports: [{ name: http, containerPort: 4310 }]
          volumeMounts:
            - { name: signing-key, mountPath: /etc/vouchryx/keys, readOnly: true }
            - { name: trusted-issuer-jwks, mountPath: /etc/vouchryx/trusted, readOnly: true }
            - { name: workload-jwks, mountPath: /etc/vouchryx/workload, readOnly: true }
            - { name: delegation-state, mountPath: /var/lib/stack/delegation }
            - { name: events, mountPath: /var/lib/stack/events }
          # Stop taking traffic before stopping: the endpoint leaves the
          # Service while this sleeps. CLAUDE.md invariant 21.
          lifecycle: { preStop: { sleep: { seconds: 5 } } }
          readinessProbe:
            httpGet: { path: /.well-known/jwks.json, port: http }
            initialDelaySeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: signing-key
          secret:
            secretName: vouchryx-keys
            items: [{ key: signing.pem, path: signing.pem }]
        # The operator's own upstream IdP JWKS, delivered here at enable time
        # by delegation/up.sh, and referenced by the trusted_issuers key in
        # VOUCHRYX_TRUSTED_ISSUERS above. A ConfigMap, not a Secret: a JWKS is
        # a set of PUBLIC keys, the other half of the key pair that signed the
        # operator's subject/actor tokens, and holds nothing this cluster
        # needs to keep confidential.
        - name: trusted-issuer-jwks
          configMap: { name: vouchryx-trusted-issuers, optional: true, items: [{ key: idp.jwks.json, path: idp.jwks.json }] }
        - name: workload-jwks
          configMap: { name: vouchryx-workload-jwks, optional: true, defaultMode: 0444, items: [{ key: jwks.json, path: jwks.json }] }
        - name: delegation-state
          persistentVolumeClaim: { claimName: vouchryx-state }
        - name: events
          persistentVolumeClaim: { claimName: stack-events }
---
apiVersion: v1
kind: Service
metadata: { name: vouchryx, namespace: agent-stack, labels: { app: vouchryx, plane: money } }
spec:
  type: ClusterIP
  selector: { app: vouchryx }
  ports: [{ name: http, port: 4310, targetPort: http }]
---
# Requirement 4: a ClusterIP Service reachable by nothing but the gateway
# (which polls /v1/revocations and verifies chains against the JWKS it was
# handed at enable time) and the console (which posts /v1/revoke). Not added
# to `manifests/53-hub-entry.yaml`'s door: the hub entry is opt-in on its own
# and unrelated to this plane, and nothing routes vouchryx through it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vouchryx-ingress
  namespace: agent-stack
spec:
  podSelector: { matchLabels: { app: vouchryx } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: tokenfuse-gateway } }
        - podSelector: { matchLabels: { plane: console } }
        - podSelector: { matchLabels: { app: wardryx } }
        - podSelector: { matchLabels: { app: tokenfuse-mcp-broker } }
      ports:
        - { protocol: TCP, port: 4310 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-egress-vouchryx
  namespace: agent-stack
spec:
  podSelector: { matchLabels: { app: tokenfuse-gateway } }
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector: { matchLabels: { app: vouchryx } }
      ports:
        - { protocol: TCP, port: 4310 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: console-egress-vouchryx
  namespace: agent-stack
spec:
  podSelector: { matchLabels: { plane: console } }
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector: { matchLabels: { app: vouchryx } }
      ports:
        - { protocol: TCP, port: 4310 }
---
# wardryx polls vouchryx's key set and its revocation list (invariant 63). Its own egress rule: the
# policy plane otherwise reaches nothing new.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wardryx-egress-vouchryx
  namespace: agent-stack
spec:
  podSelector: { matchLabels: { app: wardryx } }
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector: { matchLabels: { app: vouchryx } }
      ports:
        - { protocol: TCP, port: 4310 }
---
# The MCP broker asks vouchryx for the revocation list when it checks an agent token (invariant 54).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: broker-egress-vouchryx
  namespace: agent-stack
spec:
  podSelector: { matchLabels: { app: tokenfuse-mcp-broker } }
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector: { matchLabels: { app: vouchryx } }
      ports:
        - { protocol: TCP, port: 4310 }
