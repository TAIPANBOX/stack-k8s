apiVersion: v1
kind: Namespace
metadata:
  name: agent-stack
  labels:
    # The whole namespace runs unprivileged, non-root, no host access. Declared
    # here so the API server enforces it rather than each pod promising it.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
# The shared event log the planes couple through (README, "Fact 1").
# ReadWriteMany because four components need it at once and they are spread
# across nodes: the gateway and wardryx append, idryx loads from it, the
# console's bus tails it. On k3s the default `local-path` class is RWO, so this
# claim needs an RWX class (nfs-server-provisioner or Longhorn) - named
# explicitly so a cluster without one fails loudly at apply time instead of
# scheduling every pod onto one node by accident.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stack-events
  namespace: agent-stack
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: stack-rwx
  resources:
    requests:
      storage: 5Gi
---
# The money plane's own state. `tokenfuse-cloud` keeps runs, budgets, incidents
# and the savings ledger in memory and snapshots them to `TOKENFUSE_CLOUD_DATA`
# every two seconds; with that variable unset it keeps NOTHING, which on one
# long-lived box looks survivable and on Kubernetes is not: a rollout, an
# eviction or a drained node is an ordinary Tuesday, and each one silently
# resets the fleet's whole spend history to zero. A plane that governs money
# gets a volume. See ../GOTCHAS.md, item 12.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cloud-state
  namespace: agent-stack
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
# The console's own state: operator record, enrolled passkeys, the verdryx and
# engram stores it writes as it runs. One writer, so ordinary RWO.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: console-state
  namespace: agent-stack
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
# The record plane's store. Its own claim and not a corner of `stack-events`,
# because the two are different things that happen to be NDJSON: the events
# claim is a BUS that four components append to and anything may read, and this
# is a tamper-evident STORE of sealed segments, their manifests and one cursor
# per source file. Putting a hash-chained record inside the volume its own
# inputs live in would mean an operator clearing space on the bus could delete
# the evidence about it.
#
# ReadWriteOnce and not RWX on purpose: `record-seal` is the only writer, it is
# `concurrencyPolicy: Forbid`, and the store takes no cross-process lock, so a
# second writer would be two minters of one shard. RWO makes that structural
# rather than a promise, and it needs no RWX storage class, which the events
# claim does.
#
# 2Gi matches the two claims above. METERED: a claim provisions a real disk on
# every provider and is billed from creation. Some providers round up to their
# own minimum, so 2Gi requested is not always 2Gi billed.
#
# @yurii 2026-08-28 authorised this claim.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trailryx-records
  namespace: agent-stack
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: stack-wiring
  namespace: agent-stack
data:
  # Service DNS, not localhost: the one substantive change from `up.sh`, which
  # wires everything to 127.0.0.1 because there it genuinely is one host.
  TOKENFUSE_CLOUD_URL: "http://tokenfuse-cloud:8080"
  WARDRYX_URL: "http://wardryx:8090"
  IDRYX_URL: "http://idryx:8081"
  EVENTS_DIR: "/var/lib/stack/events"
  # The trust domain the record plane is told to accept, and it is a
  # PLACEHOLDER until an operator sets it to what this cluster's agents
  # actually carry.
  #
  # There is no defensible default. The plane accepts an event only if its
  # agent id begins `agent://<domain>/`, matched against exactly ONE value, and
  # a default install here carries no single one: the drill agents are
  # `mockryx.local`, the gateway's are whatever a caller sends in
  # `x-fuse-agent-id`.
  #
  # Getting it wrong is safe and loud rather than silent, since
  # TAIPANBOX/trailryx#50: a run that stores nothing and refuses only for the
  # domain it was handed does NOT move its cursor and says
  # `cursor: NOT moved` with the reason. Before that fix the same mistake
  # marked every line read and no correction recovered them.
  TRAILRYX_TRUST_DOMAIN: "set-me.invalid"
  TOKENFUSE_EVENTS_PATH: "/var/lib/stack/events/tokenfuse.ndjson"
  # The control plane writes its own file: it emits incidents, the gateway
  # emits one event per call, and the two have nothing to do with each other in
  # volume or in meaning. idryx loads the gateway's file by name to build an
  # identity graph; heraldyx reads the directory and picks up both.
  TOKENFUSE_CLOUD_EVENTS_PATH: "/var/lib/stack/events/tokenfuse-cloud.ndjson"
  WARDRYX_EVENTS_PATH: "/var/lib/stack/events/wardryx.ndjson"
  # Where wardryx keeps every policy set it makes effective, named by that
  # set's own policy_version. It is a directory on the SAME already-provisioned
  # stack-events volume, so this costs no new storage.
  #
  # Unset, wardryx serves exactly as before and loses one thing: a decision it
  # records names a policy_version, and the rules behind that name are gone at
  # the next `/v1/policies` write, because the policy store is a live control
  # surface where writes overwrite and deletes remove. `wardryx replay` then
  # reports every such decision as not-archived and can examine none of them.
  # The loss is one-way: replay works forward from the day this is set and can
  # never be applied to decisions recorded before it.
  WARDRYX_POLICY_ARCHIVE: "/var/lib/stack/events/wardryx-policy-archive"
  # The drill harness writes here too, and until 2026-08-03 it did not write
  # anywhere. It ran, it found gaps, and `sim_finding` reached nothing: the
  # notifier has a sentence for that type and the operator was never going to
  # see it. Same shape as the control plane's exporter being off, one plane
  # over. Its own file for the same reason as the others.
  MOCKRYX_EVENTS_PATH: "/var/lib/stack/events/mockryx.ndjson"
  # quality-drift's own config, mirroring stack-up/routines.sh's
  # ROUTINE_VERDRYX_BASELINE and ROUTINE_VERDRYX_WINDOW (see README under
  # "Scheduled governance runs" there). Baseline is empty on purpose: it names
  # which eval run counts as "before", which is a choice this repo cannot make
  # for you, and there is no default that would not be a guess. Empty means
  # the CronJob in 40-routines-and-secrets.yaml runs and skips, same as the
  # routine it mirrors does when unset. Edit this ConfigMap to turn it on.
  ROUTINE_VERDRYX_BASELINE: ""
  ROUTINE_VERDRYX_WINDOW: "5"
---
# The environment descriptor, which is the piece a Kubernetes deployment has
# no other way to produce.
#
# On a customer box `taipan up` writes `~/.taipan/environments/<name>.json`,
# and the console treats that file as the answer to "what am I looking at".
# Two of its panels resolve from NOTHING ELSE: the Bus (and therefore the
# delegation Graph built from it) and the Identity plane read the descriptor
# only - there is no environment variable that can tell them. Here that has a
# consequence worth being blunt about: with no descriptor, the console's bus
# does not report an empty cluster, it starts its DEMO feeder, writes fixture
# events into a scratch directory, and the Graph tab then draws a fleet of
# `agent://taipanbox.dev/demo/*` identities that do not exist. A governance
# console showing invented agents as real is the worst failure mode available
# to it, and on a cluster it was the DEFAULT. See ../GOTCHAS.md, item 16.
#
# So the manifests write the descriptor themselves. It holds no secret: URLs
# the cluster already publishes as Services, the shared event directory, and
# REFERENCES to key labels. The keys those labels point at live in a sibling
# `<name>.keys.json` that this repo does not ship (see secrets.example.yaml);
# without it the money and policy planes fall back to their env vars, which is
# why the console still works on a throwaway cluster and why a real one can
# hand it real credentials without editing any of this.
apiVersion: v1
kind: ConfigMap
metadata:
  name: stack-environment
  namespace: agent-stack
data:
  k8s.json: |
    {
      "name": "k8s",
      "created_at": "2026-07-25T00:00:00Z",
      "host": "agent-stack.svc.cluster.local",
      "services": {
        "cloud":   { "url": "http://tokenfuse-cloud:8080" },
        "gateway": { "url": "http://tokenfuse-gateway:4100", "mode": "enforce" },
        "wardryx": { "url": "http://wardryx:8090" },
        "idryx":   { "url": "http://idryx:8081" }
      },
      "events": {
        "dir": "/var/lib/stack/events",
        "files": {
          "tokenfuse": "/var/lib/stack/events/tokenfuse.ndjson",
          "wardryx": "/var/lib/stack/events/wardryx.ndjson"
        }
      },
      "keys": {
        "cloud_admin_ref": "taipan/k8s/cloud_admin",
        "wardryx_admin_ref": "taipan/k8s/wardryx_admin"
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wardryx-policy
  namespace: agent-stack
data:
  # The same starter policy `up.sh` seeds, scoped to fire-drill identities only
  # so a fresh cluster denies something real without touching a live fleet.
  #
  # agent://mockryx.local/*, not agent://drill.local/*: this repo and
  # stack-single had drifted onto "drill.local" while stack-up and taipan both
  # seed "mockryx.local" for the exact same rehearsal identity. Aligned here on
  # mockryx.local because that is the name of the tool that actually generates
  # this traffic (`mockryx`, "shells out to fire the hostile drills at the
  # gateway" per this README's Fact 2), matching the convention every other
  # `agent://<thing>.local/*` identity in this stack already follows (name the
  # component, not a generic noun), and because it is the name taipan (the
  # Genaryx orchestrator this policy shape was first written for) and stack-up
  # (the public launcher) already agree on. security-tests.sh's check 11b
  # probes this exact target and was updated in the same change.
  policy.yaml: |
    - name: stack-up-demo-require-human-approval
      target: agent://mockryx.local/*
      require_human_above_usd: 1
    - name: stack-up-demo-deny-shell-exec
      target: agent://mockryx.local/*
      deny_tool:
        - shell_exec
