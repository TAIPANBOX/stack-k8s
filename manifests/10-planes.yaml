# The three long-running planes plus the enforcing proxy. Flags and env are
# copied from `stack-up/up.sh`'s real invocations, not invented: wardryx takes
# single-dash flags, idryx takes double-dash, and both tokenfuse binaries are
# configured entirely through env.
#
# Every image named here is PULLED, pinned to an immutable version tag. Since
# 2026-09-01 that is all of them and a node builds nothing. `BUILD_FROM_SOURCE=1`
# is the escape hatch and builds at `:dev`, which no manifest names, so it also
# means editing an image line. The rule is in ../CLAUDE.md, invariant 7.
#
# A pinned tag rather than `:latest` or `:dev`, deliberately: "which build is
# running" has to have an answer that does not change under the operator. It
# also means an upgrade is a visible edit to this file and a rollout somebody
# ran, rather than a pod that quietly came back different.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tokenfuse-cloud
  namespace: agent-stack
  labels: { app: tokenfuse-cloud, plane: money }
spec:
  replicas: 1
  # One RWO state volume, so never two pods at once: a rolling update would
  # wait for a second pod that cannot attach the same disk, and sit there.
  strategy: { type: Recreate }
  selector: { matchLabels: { app: tokenfuse-cloud } }
  template:
    metadata:
      labels: { app: tokenfuse-cloud, plane: money }
    spec:
      # fsGroup so uid 10001 can write the snapshot: a freshly provisioned
      # block volume comes up owned by root, and this container is not root.
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: cloud
          # Pulled, not built. `tokenfuse-control-plane` has been published
          # since v0.3.0 and this repository built it on a node anyway, on
          # every deploy, under a comment saying it was not published. The
          # entrypoint path is unchanged: measured 2026-09-01 on v0.4.1 and again
          # 2026-09-02 on v0.4.3, the published
          # image carries /usr/local/bin/tokenfuse-cloud exactly as the local
          # build did.
          image: ghcr.io/taipanbox/tokenfuse-control-plane:v0.4.3
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/tokenfuse-cloud"]
          env:
            - { name: PORT, value: "8080" }
            # tokenfuse-cloud binds 127.0.0.1 by DEFAULT, on purpose: a naive
            # local run must never publish the money-plane API. In a pod that
            # default is wrong in a way that looks like a broken app: the
            # container runs, the log says "listening", and the readiness probe
            # fails forever, because kubelet probes the pod IP and the Service
            # has no endpoint to send to.
            #
            # So this opts in through the escape hatch the code documents, and
            # opts in as narrowly as the code allows: the POD'S OWN address,
            # not `0.0.0.0`. The wildcard would also work and is what most
            # charts write, but it means "every interface this container ever
            # gets", which stops being loopback-equivalent the day something
            # adds hostNetwork or a second interface. The pod IP cannot drift
            # that way.
            #
            # What replaces loopback as the boundary is not politeness: the
            # default-deny NetworkPolicy in 30-network-policy.yaml admits port
            # 8080 only from `plane: console` and `plane: money`, the Service
            # is ClusterIP, and there is no host port and no NodePort. That is
            # a strictly smaller reachable set than loopback on a shared box,
            # where every local process of every local user can connect.
            # See ../GOTCHAS.md, item 9.
            - name: TOKENFUSE_CLOUD_HOST
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            # The money plane's admin credential, generated per cluster by
            # install.sh and never in this repo.
            #
            # What used to be here was `TOKENFUSE_CLOUD_ALLOW_DEVKEY=1` with an
            # empty key list, which makes the literal string `devkey` an admin
            # bearer. On one machine that is a dev convenience. In a cluster it
            # is a published credential: any pod that can reach port 8080 is an
            # admin, and the NetworkPolicy that decides who can reach 8080
            # authorises by a POD LABEL, which a pod assigns to itself. Proven
            # by attack on 2026-07-25: a pod labelled `plane: console` deleted a
            # freeze with `Bearer devkey` and the agent resumed. See
            # ../GOTCHAS.md, item 20.
            - name: TOKENFUSE_CLOUD_KEYS
              valueFrom: { secretKeyRef: { name: stack-keys, key: cloud_keys } }
            # Durable state, autosaved every 2s and reloaded on startup.
            # Without it every restart is a factory reset of the money plane
            # (see the cloud-state claim in 00-base.yaml).
            - { name: TOKENFUSE_CLOUD_DATA, value: "/var/lib/stack/cloud/state.json" }
            # The incident exporter, and the reason the notification plane had
            # nothing to read until 2026-08-02. This plane is where the
            # detectors live: budget_exhausted, sustained_loop,
            # fanout_explosion, spend_spike, budget_threshold. Without a path
            # the exporter is disabled by design (zero cost on the ingest hot
            # path), so every one of those incidents reached the console's
            # stream and its own API, and NOTHING reached the shared event log.
            # heraldyx read an empty directory and stayed silent, correctly and
            # uselessly, and the install gave no sign: the file existed, owned
            # and zero bytes, because the GATEWAY creates it and no call had
            # gone through the gateway either.
            #
            # Its own file rather than the gateway's. Both would be appending
            # to one log, which is safe for lines under a page and unclear
            # above it, and idryx loads `tokenfuse.ndjson` specifically to
            # build an identity graph from per-call events. heraldyx reads the
            # whole directory, so it sees both without being told.
            - name: TOKENFUSE_EVENTS_PATH
              valueFrom: { configMapKeyRef: { name: stack-wiring, key: TOKENFUSE_CLOUD_EVENTS_PATH } }
          ports: [{ name: http, containerPort: 8080 }]
          volumeMounts:
            - { name: events, mountPath: /var/lib/stack/events }
            - { name: state, mountPath: /var/lib/stack/cloud }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: events
          persistentVolumeClaim: { claimName: stack-events }
        - name: state
          persistentVolumeClaim: { claimName: cloud-state }
---
apiVersion: v1
kind: Service
metadata: { name: tokenfuse-cloud, namespace: agent-stack }
spec:
  selector: { app: tokenfuse-cloud }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tokenfuse-gateway
  namespace: agent-stack
  labels: { app: tokenfuse-gateway, plane: money }
spec:
  replicas: 1
  selector: { matchLabels: { app: tokenfuse-gateway } }
  template:
    metadata:
      labels: { app: tokenfuse-gateway, plane: money }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: gateway
          # Pulled, and the command CHANGES with it. The local image was one
          # workspace with two binaries in it, named for the two things they
          # do; the published one is the gateway alone and the binary in it is
          # called `tokenfuse`. Measured 2026-09-01 on v0.4.1 and 2026-09-02 on
          # v0.4.3 by listing /usr/local/bin
          # in the published image, which is the only way to know.
          image: ghcr.io/taipanbox/tokenfuse:v0.4.3
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/tokenfuse"]
          env:
            - { name: TOKENFUSE_ADDR, value: "0.0.0.0:4100" }
            # enforce, not observe: an over-budget call gets a hard 402 rather
            # than a log line. This is the whole point of the gateway.
            - { name: TOKENFUSE_MODE, value: "enforce" }
            # Two settings the gateway leaves OFF by default, and this stack
            # must not, because they are the difference between a deployment
            # that is governed and one that only looks governed.
            #
            # Measured on 2026-08-04 with real agents against the real
            # provider: a call with no `x-fuse-run-id` reached Anthropic and
            # was recorded in NO ledger, trace or event stream (all three
            # NDJSON files stayed at 0 bytes), and secret scanning was off, so
            # nothing looked at what the prompts contained. Both are correct
            # defaults for a drop-in evaluation and wrong ones here: this
            # stack's claim is that every call is accounted for.
            - { name: TOKENFUSE_REQUIRE_RUN_ID, value: "1" }
            # `block`, not `shadow`: shadow reports a leak it already let out.
            # Note what this does and does not buy, so nobody reads more into
            # it than is there. Measured the same day: a whole AWS key is
            # stopped before the provider sees it, the 40-character secret
            # half ALONE is not, and splitting a key across two phrases
            # ("part one is AKIAIOSF and part two is ...") passes untouched.
            # It catches carelessness. It does not stop intent.
            - { name: TOKENFUSE_DLP, value: "block" }
            - { name: TOKENFUSE_DATA_DIR, value: "/var/lib/stack/traces/gateway" }
            # WHERE THE CALLS ACTUALLY GO. Leave this unset and the gateway does
            # not fail and does not warn: it answers every request itself from
            # `StubProvider`, with a fabricated body and a fixed 1000 input /
            # 500 output tokens, and meters that as real spend. So an operator
            # gets model answers that are not from a model and a console full of
            # money that was never spent, all of it plausible. Measured on
            # 2026-07-25: `{"stub": true, "usage": {"input_tokens": 1000,
            # "output_tokens": 500}}`, metered at \$0.0035. See ../GOTCHAS.md,
            # item 22.
            # The FULL endpoint, not a base: the gateway POSTs to exactly this URL
            # (its own module doc says so, and a base alone answers 404).
            - { name: TOKENFUSE_UPSTREAM, value: "https://api.anthropic.com/v1/messages" }
            # The gateway's own org key for the control plane. Without it the
            # cloud sink never starts: the gateway meters locally, the console
            # shows nothing, and the deployment looks fine from both ends while
            # the money plane is deaf. `TOKENFUSE_CLOUD_URL` comes from
            # `stack-wiring`; this is the other half it needs.
            - name: TOKENFUSE_CLOUD_KEY
              valueFrom: { secretKeyRef: { name: stack-keys, key: cloud_admin } }
            # The policy hook on the DATA PATH, and the reason this block is
            # long: without these four variables the gateway never asks the PDP
            # anything. It defaults to `mode: off`, and it reads
            # TOKENFUSE_WARDRYX_URL - not the `WARDRYX_URL` in `stack-wiring`,
            # which every other component uses. So a cluster wired the obvious
            # way had a policy plane that answered the console and was never
            # consulted by the traffic. Measured on 2026-07-25: a frozen agent's
            # calls went through untouched, because a freeze only stopped
            # whoever ASKED. See ../GOTCHAS.md, item 21.
            - { name: TOKENFUSE_WARDRYX_MODE, value: "enforce" }
            - { name: TOKENFUSE_WARDRYX_URL, value: "http://wardryx:8090" }
            # Least privilege: /v1/decide needs any authenticated principal, not
            # an admin, so the gateway gets a VIEWER key. An admin key here
            # would let the enforcement point rewrite the policy it enforces.
            - name: TOKENFUSE_WARDRYX_KEY
              valueFrom: { secretKeyRef: { name: stack-keys, key: wardryx_gateway } }
            # Fail CLOSED. The default is open, which means an unreachable PDP
            # turns into a permitted call, and on Kubernetes "unreachable" is an
            # ordinary rollout. For a plane whose whole job is to say no, the
            # honest failure is to say no. The cost is a deny window while
            # wardryx restarts, which is why the policy plane got durable
            # storage (15-policy-store.yaml) before this line was written.
            - { name: TOKENFUSE_WARDRYX_FAILMODE, value: "closed" }
            # Measured cross-node PDP latency on this cluster: p50 2.8ms,
            # p95 3.7ms, p99 18.8ms. The default 50ms timeout is fine on one
            # host and thin against that p99 once fail-closed makes a timeout a
            # DENIAL, so it is widened deliberately rather than left at a
            # value tuned for loopback.
            - { name: TOKENFUSE_WARDRYX_TIMEOUT_MS, value: "250" }
            # Decisions are cached for this long. Stated explicitly because it
            # is the answer to "how fast does a freeze take effect on live
            # traffic": up to this many milliseconds later, not instantly.
            - { name: TOKENFUSE_WARDRYX_CACHE_TTL_MS, value: "3000" }
          envFrom:
            - configMapRef: { name: stack-wiring }
          ports: [{ name: http, containerPort: 4100 }]
          volumeMounts:
            - { name: events, mountPath: /var/lib/stack/events }
            - { name: traces, mountPath: /var/lib/stack/traces }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 512Mi }
        # focus-export, AS A SIDECAR AND NOT A CRONJOB, AND THE REASON IS THE
        # VOLUME RATHER THAN A PREFERENCE.
        #
        # 40-routines-and-secrets.yaml recorded this as a finding on
        # 2026-08-06: four of stack-up's five routines have a CronJob here and
        # this one does not, so a Kubernetes install produced no focus export
        # at all. `tokenfuse-gateway focus-export --traces <dir>` reads the
        # gateway's local Parquet directory straight off disk, and that
        # directory is the `traces` emptyDir below. An emptyDir is mountable
        # ONLY by containers inside its own pod, by Kubernetes' own design, so
        # no CronJob can reach it whatever its affinity says.
        #
        # The other way out was to give `traces` a PersistentVolumeClaim. That
        # is a real solution and it provisions a real disk, billed from
        # creation, so it is a spending decision rather than a fix. A sidecar
        # is in the pod already and costs nothing.
        #
        # It prints rather than storing, which is what quality-drift does one
        # file over: in this deployment a routine's artifact is its log. The
        # CSV goes to an emptyDir of its own so that the export never writes
        # into the directory it reads.
        - name: focus-export
          # The gateway's image, because this sidecar reads the gateway's own
          # trace directory and runs beside it. It needs a SHELL, which is the
          # one thing worth checking before swapping a distroless-looking image
          # in underneath it: measured 2026-09-01 on v0.4.1 and 2026-09-02 on
          # v0.4.3, the published image has one (/usr/bin/dash).
          image: ghcr.io/taipanbox/tokenfuse:v0.4.3
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u
              traces=/var/lib/stack/traces/gateway
              out=/var/lib/stack/focus
              # First run waits, so the gateway has served something before
              # the first export asks what it served.
              sleep "${FOCUS_EXPORT_INTERVAL:-3600}"
              while :; do
                stamp=$(date -u +%Y%m%dT%H%M%SZ)
                if [ ! -d "$traces" ]; then
                  echo "focus-export: skipped, no trace directory at $traces yet"
                else
                  # It exits non-zero with "no calls found in the trace" on an
                  # idle window, which is not a failure of the export. Same
                  # judgement stack-up's routine makes.
                  if tokenfuse-gateway focus-export --traces "$traces" \
                       --out "$out/focus-$stamp.csv" 2>&1; then
                    echo "focus-export: wrote $out/focus-$stamp.csv"
                  else
                    echo "focus-export: nothing to export in this window"
                  fi
                fi
                sleep "${FOCUS_EXPORT_INTERVAL:-3600}"
              done
          env:
            - { name: FOCUS_EXPORT_INTERVAL, value: "3600" }
          volumeMounts:
            # Read only: this reads what the gateway wrote and must not be
            # able to edit it. The gateway's own mount above stays writable.
            - { name: traces, mountPath: /var/lib/stack/traces, readOnly: true }
            - { name: focus, mountPath: /var/lib/stack/focus }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: events
          persistentVolumeClaim: { claimName: stack-events }
        - name: traces
          emptyDir: {}
        # The export's own scratch, so it never writes into the directory it
        # reads. emptyDir rather than a claim: the artifact is the log line,
        # and a CSV that outlives the pod would need a disk somebody pays for.
        - name: focus
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: { name: tokenfuse-gateway, namespace: agent-stack }
spec:
  selector: { app: tokenfuse-gateway }
  ports: [{ name: http, port: 4100, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wardryx
  namespace: agent-stack
  labels: { app: wardryx, plane: policy }
spec:
  replicas: 1
  selector: { matchLabels: { app: wardryx } }
  template:
    metadata:
      labels: { app: wardryx, plane: policy }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: wardryx
          image: ghcr.io/taipanbox/wardryx:v0.1.0
          imagePullPolicy: IfNotPresent
          # Single-dash flags, exactly as up.sh calls it.
          args:
            - "serve"
            - "-addr"
            - "0.0.0.0:8090"
            - "-events"
            - "/var/lib/stack/events/wardryx.ndjson"
            - "-policy"
            - "/etc/wardryx/policy.yaml"
          env:
            # Durable policy + approval store (15-policy-store.yaml). Without
            # it wardryx keeps both in MEMORY, so a pod restart silently drops
            # every `console-block:*` policy the console wrote and UNFREEZES
            # the fleet while the console still shows it stopped. Serve flags
            # fall back to their WARDRYX_* variable, so this is `-db` by
            # another name. See ../GOTCHAS.md, item 14.
            # Bearer auth on the policy plane. With WARDRYX_KEYS unset wardryx
            # accepts ANY bearer, so `Authorization: Bearer devkey` was enough
            # to rewrite policy - including deleting the console's own freezes
            # (GOTCHAS 20). Generated per cluster by install.sh.
            - name: WARDRYX_KEYS
              valueFrom: { secretKeyRef: { name: stack-keys, key: wardryx_keys } }
            - name: WARDRYX_DB
              valueFrom: { secretKeyRef: { name: stack-policy-db, key: dsn } }
            # A policy can say "hold anything above $25 for a human". Without
            # this secret wardryx accepts such a policy and can then never
            # GRANT the hold - it says so in one startup line and nowhere the
            # operator will look.
            - name: WARDRYX_APPROVAL_SECRET
              valueFrom: { secretKeyRef: { name: stack-policy-db, key: approval_secret } }
            # Read from stack-wiring rather than repeated here, so the path
            # has ONE source: anything else that needs to find this archive
            # (a replay routine, an operator) reads the same key.
            - name: WARDRYX_POLICY_ARCHIVE
              valueFrom: { configMapKeyRef: { name: stack-wiring, key: WARDRYX_POLICY_ARCHIVE } }
          ports: [{ name: http, containerPort: 8090 }]
          volumeMounts:
            - { name: events, mountPath: /var/lib/stack/events }
            - { name: policy, mountPath: /etc/wardryx, readOnly: true }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: events
          persistentVolumeClaim: { claimName: stack-events }
        - name: policy
          configMap: { name: wardryx-policy }
---
apiVersion: v1
kind: Service
metadata: { name: wardryx, namespace: agent-stack }
spec:
  selector: { app: wardryx }
  ports: [{ name: http, port: 8090, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idryx
  namespace: agent-stack
  labels: { app: idryx, plane: identity }
spec:
  replicas: 1
  selector: { matchLabels: { app: idryx } }
  template:
    metadata:
      labels: { app: idryx, plane: identity }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: idryx
          image: ghcr.io/taipanbox/idryx:v0.3.0
          imagePullPolicy: IfNotPresent
          # Double-dash flags here, and :8081 because idryx's own default 8080
          # collides with the cloud plane. Both quirks are up.sh's, kept so the
          # cluster and the one-command local run behave identically.
          args:
            - "serve"
            - "--addr"
            - "0.0.0.0:8081"
            - "--load"
            - "tokenfuse:/var/lib/stack/events/tokenfuse.ndjson"
          ports: [{ name: http, containerPort: 8081 }]
          volumeMounts:
            # Read-only: idryx builds its graph FROM the log and never writes
            # to it, and the mount should say so.
            - { name: events, mountPath: /var/lib/stack/events, readOnly: true }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: events
          persistentVolumeClaim: { claimName: stack-events }
---
apiVersion: v1
kind: Service
metadata: { name: idryx, namespace: agent-stack }
spec:
  selector: { app: idryx }
  ports: [{ name: http, port: 8081, targetPort: http }]
