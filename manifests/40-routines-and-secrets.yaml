# The governance routines `stack-up/routines.sh` installs as OS timers, as
# CronJobs. Same idea: the evidence keeps producing whether or not anyone is
# watching, which is the difference between a control and a dashboard.
#
# Each runs the tool that already exists rather than a bespoke script, and each
# writes into the shared state so the console's Routines tab sees the history.
#
# Three of stack-up's five routines are here: crypto-trend (qryx-trend) and
# identity-sweep (idryx-detect) already were; quality-drift (verdryx-drift) is
# added in this change. drills (mockryx-drill) is the fourth, opt-in and
# suspended below, same as there.
#
# The fifth, focus-export, is NOT here, and that is a finding, not an
# oversight. `tokenfuse-gateway focus-export --traces <dir> --out <file>`
# (tokenfuse/crates/gateway/src/focusexport.rs) reads the gateway's own local
# Parquet trace directory straight off disk: a filesystem operation, not an
# HTTP call. In this deployment that directory is 10-planes.yaml's `traces`
# volume on the `tokenfuse-gateway` Deployment, and it is an `emptyDir`:
# ephemeral, and by Kubernetes' own design mountable ONLY by containers inside
# that same pod, no matter what a second pod's node affinity says. Contrast
# quality-drift below, which reaches `verdryx.db` on `console-state`, a real
# PersistentVolumeClaim: an RWO claim plus required pod affinity onto the
# right node is a genuine solution there, the same one crypto-trend already
# uses, because the volume is a PVC to begin with. There is no equivalent move
# for an `emptyDir`; making focus-export possible would mean giving the
# gateway's trace directory a PVC of its own, which is a change to an
# already-deployed, already-measured Deployment, not a CronJob addition, so it
# is out of scope here. See GOTCHAS.md, item 81, and README.md's "What runs as
# what" table, which now names three routines here, not four.
#
# Five of the planes are PULLED, pinned to an immutable version tag, and two
# are still built on the node: `stack/tokenfuse:dev` (Rust, not published) and
# `stack/genaryx-console:dev` (built from source per install). The rule for
# which is which is in ../CLAUDE.md, invariant 7.
#
# A pinned tag rather than `:latest` or `:dev`, deliberately: "which build is
# running" has to have an answer that does not change under the operator. It
# also means an upgrade is a visible edit to this file and a rollout somebody
# ran, rather than a pod that quietly came back different.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: crypto-trend
  namespace: agent-stack
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          # It has to land on the node the console is on, and this is not a
          # preference: it scans `console-state`, which is ReadWriteOnce, and
          # the console holds that volume for as long as it runs. A ReadWriteOnce
          # volume can be mounted by several pods on ONE node and by no pod
          # anywhere else, so a Job scheduled elsewhere does not fail fast: it
          # sits Pending with a Multi-Attach error until somebody looks.
          #
          # Measured on a live three-node cluster 2026-08-03, where this job had
          # never actually run before: scheduled onto a different node than the
          # console, Pending forever, and a daily scan that silently never
          # happens is worse than one that errors.
          #
          # required, not preferred: landing on the wrong node is not a
          # degraded run, it is no run at all, and Pending-until-timeout is a
          # clearer signal than a Multi-Attach nobody reads.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app: genaryx-console
          securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: qryx
              image: ghcr.io/taipanbox/qryx:v0.3.0
              # The volume it mounts, not a subdirectory of it that nothing
              # creates. This said `/var/lib/stack/scan` until 2026-08-03, and
              # the first time the job ever ran it exited with
              # `open /var/lib/stack/scan: no such file or directory`. Nobody
              # had seen that, because the job could not be scheduled at all
              # (see the affinity above): two independent faults, each hiding
              # the other, in a routine that was meant to run every night.
              args: ["scan", "/var/lib/stack"]
              volumeMounts:
                - { name: state, mountPath: /var/lib/stack }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 512Mi }
          volumes:
            - name: state
              persistentVolumeClaim: { claimName: console-state }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: identity-sweep
  namespace: agent-stack
spec:
  schedule: "42 4 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: idryx-rescan
              image: ghcr.io/taipanbox/idryx:v0.3.0
              # A fresh detect pass over the same event log the serving idryx
              # loaded, so declared-versus-observed drift is caught on a
              # schedule rather than only when an operator happens to look.
              args:
                - "detect"
                - "--load"
                - "tokenfuse:/var/lib/stack/events/tokenfuse.ndjson"
              volumeMounts:
                - { name: events, mountPath: /var/lib/stack/events, readOnly: true }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 512Mi }
          volumes:
            - name: events
              persistentVolumeClaim: { claimName: stack-events }
---
# quality-drift: verdryx's own drift check, the same invocation
# stack-up/routines.sh's routine_verdryx_drift runs on main, ported rather
# than reinvented. verdryx is not one of the five published planes (README,
# "Fact 2"): it lives only inside the console image
# (images/console.Dockerfile: `pip install /opt/verdryx` registers it as a
# real console-invokable command), so this uses stack/genaryx-console:dev with
# its own ENTRYPOINT overridden, the same reason the console Deployment itself
# exists.
#
# Preconditions are checked inline, mirroring routine_verdryx_drift exactly,
# because otherwise a fresh cluster's first weeks of runs would be "error"
# where routines.sh itself reports "skipped, nothing to compare yet":
#   - no store yet (verdryx.db absent): skip. Nothing has been evaluated, so
#     there is nothing to check drift against.
#   - no baseline configured (ROUTINE_VERDRYX_BASELINE empty, see 00-base.yaml):
#     skip. A baseline names which run counts as "before"; there is no default
#     that would not be a guess.
#
# VERDRYX_DB is named explicitly rather than left to resolve on its own,
# because it has to agree with where the CONSOLE looks, not merely somewhere
# verdryx would be content to write. Two independent sources agree on that
# path: genaryx's crates/api/src/quality/env.rs (well_known_db_path) and
# verdryx's own verdryx/config.py (default_taipan_home + resolve_db_path) both
# land on $HOME/.taipan/verdryx.db, and the console sets HOME=/var/lib/stack
# (20-console.yaml). Nothing here sets TAIPAN_HOME, so verdryx's own fallback
# chain would land in the same place unassisted, but the path is named
# explicitly anyway rather than trusted to keep resolving identically in a
# container nobody promised would.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: quality-drift
  namespace: agent-stack
spec:
  # 3:57, between crypto-trend (3:17) and identity-sweep (4:42): the three
  # never collide.
  schedule: "57 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          # Same reason as crypto-trend above: verdryx.db lives on
          # console-state, a ReadWriteOnce claim the console already holds,
          # and an RWO claim can be mounted by several pods on ONE node and by
          # no pod anywhere else (GOTCHAS 76). Required, not preferred:
          # landing elsewhere is not a degraded run, it is no run.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app: genaryx-console
          securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: verdryx
              image: stack/genaryx-console:dev
              # Overrides the image's own ENTRYPOINT (genaryx-web, the console
              # server): verdryx is on PATH in this image, but nothing here
              # wants the console server itself.
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  db="/var/lib/stack/.taipan/verdryx.db"
                  if [ ! -f "$db" ]; then
                    echo "quality-drift: skipped, missing store $db (no verdryx eval has run here yet)"
                    exit 0
                  fi
                  if [ -z "${ROUTINE_VERDRYX_BASELINE:-}" ]; then
                    echo "quality-drift: skipped, ROUTINE_VERDRYX_BASELINE is not set"
                    exit 0
                  fi
                  VERDRYX_DB="$db" exec verdryx drift --baseline "$ROUTINE_VERDRYX_BASELINE" --window "${ROUTINE_VERDRYX_WINDOW:-5}"
              env:
                - { name: ROUTINE_VERDRYX_BASELINE, valueFrom: { configMapKeyRef: { name: stack-wiring, key: ROUTINE_VERDRYX_BASELINE } } }
                - { name: ROUTINE_VERDRYX_WINDOW, valueFrom: { configMapKeyRef: { name: stack-wiring, key: ROUTINE_VERDRYX_WINDOW } } }
              volumeMounts:
                - { name: state, mountPath: /var/lib/stack }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 512Mi }
          volumes:
            - name: state
              persistentVolumeClaim: { claimName: console-state }
---
# Hostile drills: the five scenarios fired AT the operator's own gateway. Not
# scheduled by default. A drill spends real budget proving the breaker trips,
# so it is opt-in (`kubectl create job --from=cronjob/drills drills-now`) and
# suspended until someone means it.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: drills
  namespace: agent-stack
spec:
  schedule: "0 5 * * 1"
  suspend: true
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          # What the two NetworkPolicies beside this select on. Without it the
          # drill reaches nothing and reports every guardrail as a gap.
          labels: { role: drills }
        spec:
          restartPolicy: Never
          securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: mockryx
              # v0.1.1 is the first image of this tool that carries its own
              # scenarios; v0.1.0 was a binary that refused to start without a
              # directory nothing provided. The path is passed explicitly
              # rather than relying on a default, because `mockryx run` takes
              # it as a positional argument and an operator swapping in their
              # own set changes this line and the mount, nothing else.
              image: ghcr.io/taipanbox/mockryx:v0.1.1
              args: ["run", "--gateway", "http://tokenfuse-gateway:4100", "/scenarios"]
              # Without these two the drill is invisible to the rest of the
              # box. mockryx emits sim_run, sim_finding and
              # blast_radius_measured only when MOCKRYX_EVENTS_PATH is set,
              # and it is best-effort by design, so an unset path is silence
              # rather than an error. A guardrail that failed a rehearsal and
              # told nobody is the one finding this job exists to produce.
              env:
                - name: MOCKRYX_EVENTS_PATH
                  valueFrom: { configMapKeyRef: { name: stack-wiring, key: MOCKRYX_EVENTS_PATH } }
              volumeMounts:
                - { name: events, mountPath: /var/lib/stack/events }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 256Mi }
          volumes:
            - name: events
              persistentVolumeClaim: { claimName: stack-events }
