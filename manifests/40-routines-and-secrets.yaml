# The governance routines `stack-up/routines.sh` installs as OS timers, as
# CronJobs. Same idea: the evidence keeps producing whether or not anyone is
# watching, which is the difference between a control and a dashboard.
#
# Each runs the tool that already exists rather than a bespoke script, and each
# writes into the shared state so the console's Routines tab sees the history.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: crypto-trend
  namespace: agent-stack
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: qryx
              image: stack/qryx:dev
              args: ["scan", "/var/lib/stack/scan"]
              volumeMounts:
                - { name: state, mountPath: /var/lib/stack }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 512Mi }
          volumes:
            - name: state
              persistentVolumeClaim: { claimName: console-state }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: identity-sweep
  namespace: agent-stack
spec:
  schedule: "42 4 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: idryx-rescan
              image: stack/idryx:dev
              # A fresh detect pass over the same event log the serving idryx
              # loaded, so declared-versus-observed drift is caught on a
              # schedule rather than only when an operator happens to look.
              args:
                - "detect"
                - "--load"
                - "tokenfuse:/var/lib/stack/events/tokenfuse.ndjson"
              volumeMounts:
                - { name: events, mountPath: /var/lib/stack/events, readOnly: true }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 512Mi }
          volumes:
            - name: events
              persistentVolumeClaim: { claimName: stack-events }
---
# Hostile drills: the five scenarios fired AT the operator's own gateway. Not
# scheduled by default. A drill spends real budget proving the breaker trips,
# so it is opt-in (`kubectl create job --from=cronjob/drills drills-now`) and
# suspended until someone means it.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: drills
  namespace: agent-stack
spec:
  schedule: "0 5 * * 1"
  suspend: true
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels: { plane: console } # so the NetworkPolicy lets it reach the gateway
        spec:
          restartPolicy: Never
          securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: mockryx
              image: stack/mockryx:dev
              args: ["run", "--gateway", "http://tokenfuse-gateway:4100"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 256Mi }
