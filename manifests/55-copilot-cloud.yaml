# Felyx, the console's copilot, on a larger model. A model switch only.
#
# NOT in kustomization.yaml, and it grants nothing by itself: the copilot already
# reaches Anthropic through this stack's gateway (20-console.yaml), and the
# gateway holds the provider key (CLAUDE.md invariant 53). This patch adds one
# thing on top: a larger model than the default Haiku, on the same gateway path,
# so the console never holds a provider key and the meter sees every call.
#
# The deploy scripts apply it when they are given --anthropic-key-file, the one
# provider key the gateway reads (lib/upstream-key.sh). Applying it by hand:
#
#   kubectl -n agent-stack patch deployment genaryx-console \
#     --patch-file manifests/55-copilot-cloud.yaml
#
# METERED, on the provider account of the key the gateway holds. Use a key with a
# spend limit. To go back to the default model:
#
#   kubectl -n agent-stack set env deployment/genaryx-console GENARYX_COPILOT_MODEL=claude-haiku-4-5
#
# (`kubectl patch --patch-file` is not in apply's last-applied annotation, so a
# later `kubectl apply -k` does not revert it; CLAUDE.md invariant 24.)
spec:
  template:
    spec:
      containers:
        - name: console
          env:
            - { name: GENARYX_COPILOT_PROVIDER, value: "anthropic" }
            - { name: GENARYX_COPILOT_MODEL, value: "claude-sonnet-5" }
