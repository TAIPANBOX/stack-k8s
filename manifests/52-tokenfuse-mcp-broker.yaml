# tokenfuse's MCP credential broker, fronting typryx (the typed-answer plane,
# 51-typryx.yaml) so an agent reaches it through the money plane's own door
# rather than with typryx's own key in hand, and, where the operator runs it,
# fronting scopyx (47-scopyx.yaml, 48-scopyx-browser.yaml) the same way (G2.1).
#
# NOT in kustomization.yaml, for 51-typryx.yaml's own reason: this plane is
# reachable with no broker at all (the operator's tunnel, or
# `kubectl -n agent-stack port-forward svc/typryx 4320:4320`), so wiring a
# broker in front of it is a second, separable decision an install must not
# make on the operator's behalf. Applied by the same `--with-typed` path as
# 51-typryx.yaml, after it, in `deploy.sh` and both cloud deploys:
#
#   kubectl apply -f manifests/51-typryx.yaml
#   kubectl apply -f manifests/52-tokenfuse-mcp-broker.yaml
#
# This is `ghcr.io/taipanbox/tokenfuse`'s own `mcp-broker` subcommand, the
# same published tag `10-planes.yaml` pins for `tokenfuse-gateway`, run with
# a different ENTRYPOINT argument rather than as a second published artifact:
# one binary, two process invocations, tokenfuse's own CLAUDE.md invariant
# 34. Nothing in that repository's code changes here; this file is
# configuration only.
#
# `@decided 2026-09-26`: the reason 51-typryx.yaml gave in its own prior
# header for leaving this unwired (the broker forwarded no credential) has
# lapsed without any change to the broker: typryx#6 lets a caller present its
# key inside a `tools/call`'s own `_meta` object
# (`TYPRYX_ACCEPT_KEY_IN_META=1`, set in 51-typryx.yaml), which is exactly the
# shape the broker's `TOKENFUSE_MCP_SECRETS` vault already fills a
# `{{secret:NAME}}` handle into.
#
# Needs typryx v0.2.0 or later: v0.1.0 predates typryx#6, requires
# `X-Typryx-Key` on every `/mcp` call, and this broker forwards no such header
# (tokenfuse `mcpbroker.rs` forwards content-type only), so against v0.1.0
# every call is refused 401 (GOTCHAS 106). @measured on kind v0.33, 2026-09-26,
# with 30-network-policy.yaml, 51-typryx.yaml and 52-tokenfuse-mcp-broker.yaml applied as
# committed:
# an `ask` carrying `"_meta":{"typryx/key":"{{secret:typryx_key}}"}` through
# this broker was answered, and the broker wrote its own `tool_call` line
# before the forward, as tokenfuse's invariant 36 says; a call with no broker
# key was refused 401; a pod with neither the console nor the money label
# timed out reaching this broker and typryx.
#
#
# ## Two Secrets, one value shared between them, minted by the deploy
#
# `TOKENFUSE_MCP_SECRETS` needs the SAME bearer value that appears in
# `typryx-keys`' own `TYPRYX_KEYS` (51-typryx.yaml), because that is the
# credential typryx's door actually checks. `@decided 2026-10-14`: the deploy
# scripts mint both Secrets when absent and never overwrite one, as
# stack-single's installer already does. Until then both were made by hand, and
# measured on GCP 2026-10-14 a typed deploy without them left this pod and
# typryx Pending, the rollout waiting 300 s for each and verify red. `typed/mode.sh door-secrets`, the one copy for the three deploy
# scripts, decides in their typed branch before the render (CLAUDE.md invariant
# 42, `scripts/typed-door-is-minted.sh`): both there, both kept; neither, both
# minted with fresh 40-character values, this vault carrying typryx's bearer;
# only `typryx-keys`, this one minted from its bearer; only this one, the deploy
# stops, because a new typryx key would not be the one this vault holds. The
# documents go to `kubectl create -f -` on stdin, which never replaces a Secret
# (`apply` would, and would keep every value again in its last-applied
# annotation), and no value is printed. Both are read whole through `envFrom`,
# so CLAUDE.md invariant 17, which reads `secretKeyRef`s against `create secret
# generic` blocks, has nothing to compare here; invariant 42 holds them.
#
# `TOKENFUSE_MCP_KEYS` is a SEPARATE credential from the typryx one: it is
# the door on the BROKER itself (`secret:key_id`, tokenfuse's own
# `TOKENFUSE_CLIENT_KEYS` form), presented as `x-fuse-key: <secret>` by
# whatever calls the broker. Reusing the typryx key here would mean anything
# that can reach typryx directly can also reach the broker, and the reverse,
# which collapses two doors into one; a caller of the broker never needs to
# know typryx's own key at all, which is the point of fronting it. The deploy
# mints the two from separate reads, and its gate refuses them equal.
#
# Its two static callers, `broker-caller` (the typed door's caller) and `drills-broker` (the drills, the
# CronJob at the end of this file), are gateway keys of the same ids and secrets (CLAUDE.md invariant 85):
# the broker asks the gateway's tool-call check about every tool call with the CALLER's own key (tokenfuse
# invariant 118), and a key the gateway does not hold is refused there with 401, so the broker refuses the
# call closed. lib/identity-mint.sh mints both into gateway-client-keys, door-secrets copies them into a
# broker Secret it mints, and `typed/mode.sh door-callers` appends one a kept broker Secret lacks, or stops
# the deploy when one is not the gateway's. Measured on forge 2026-11-08 (scripts/broker-drills-pass.sh):
# with `broker-caller` known to the broker alone, every call through the typed door was refused that way.
#
# Made by hand before a deploy, which still wins over minting, with the two callers copied from the gateway:
#
#   TYPRYX_KEY="$(kubectl -n agent-stack get secret typryx-keys \
#     -o jsonpath='{.data.TYPRYX_KEYS}' | base64 -d | cut -d, -f1 | cut -d= -f1)"
#   kubectl -n agent-stack create secret generic tokenfuse-mcp-broker-keys \
#     --from-literal=TOKENFUSE_MCP_KEYS="$(kubectl -n agent-stack get secret gateway-client-keys \
#       -o jsonpath='{.data.client_keys}' | base64 -d | tr ',' '\n' | grep -E ':(broker-caller|drills-broker)$' | paste -sd, -)" \
#     --from-literal=TOKENFUSE_MCP_SECRETS="typryx_key=${TYPRYX_KEY}" \
#     --from-literal=TOKENFUSE_MCP_SECRET_SCOPES='typryx_key=tools:ask|ask_freeform|list_questions'
#
# Each entry is `secret:key_id`, so the value has this shape:
#
#   TOKENFUSE_MCP_KEYS='pick-a-different-long-secret:broker-caller,and-another-long-secret:drills-broker'
#
# The key id (`broker-caller`) is a bare name, never an `agent://` id:
# tokenfuse's `ClientKeys::from_spec` splits each entry on its LAST colon,
# because a secret may itself contain colons, so `secret:agent://x/y` would
# be read as the secret `secret:agent` and the key id `//x/y`. The pod starts
# and every caller presenting the real secret is refused 401. Held by
# `scripts/client-key-ids-are-bare.sh`.
#
# The two `cut`s pull the bearer out of `TYPRYX_KEYS`' own
# `key=agent://identity` shape, the same extraction 47-scopyx.yaml's header
# already uses on `stack-keys`' `wardryx_keys` for the same reason: the
# secret is the FIRST field before either separator, not the whole pair.
#
# Without this Secret the pod does not start at all: the `envFrom` below is not
# optional, so its container waits in CreateContainerConfigError and the pod
# stays Pending (measured on GCP 2026-10-14), the same stance every opt-in
# plane's own door takes here. With a
# `TOKENFUSE_MCP_KEYS` that parses to no key, or a vault with no `typryx_key`,
# it starts and refuses every caller or every `{{secret:typryx_key}}` handle.
#
#
# ## What TOKENFUSE_MCP_SECRET_SCOPES buys
#
# Scoped to the three tools typryx actually exposes
# (`tools:ask|ask_freeform|list_questions`) rather than left unscoped, so a
# caller of a DIFFERENT upstream this broker fronts cannot resolve typryx's
# key by naming a tool typryx never registered. Since G2.1 the rules are in the
# SAME Secret as the keys they scope (`TOKENFUSE_MCP_SECRET_SCOPES`, minted by
# `typed/mode.sh door-secrets` with the typryx rule), not in the env block
# below: a rule for scopyx names an agent, and an agent is the operator's, so no
# manifest can write it. `TOKENFUSE_MCP_REQUIRE_SECRET_SCOPES` is on, so a vault
# entry with no rule stops the broker at start instead of being resolvable by
# any agent for any tool. A `tokenfuse-mcp-broker-keys` made before G2.1 has no
# rules and the broker will not start on it until the key is added:
#
#   kubectl -n agent-stack patch secret tokenfuse-mcp-broker-keys --type merge -p \
#     '{"stringData":{"TOKENFUSE_MCP_SECRET_SCOPES":"typryx_key=tools:ask|ask_freeform|list_questions"}}'
#
#
# ## scopyx behind the broker (G2.1)
#
# `47-scopyx.yaml` is applied by hand and so is this half. An agent reads the
# web by calling THIS broker with `X-Fuse-Mcp-Upstream: scopyx`, the run it
# belongs to in `x-fuse-run-id`, and its scopyx key as a handle:
#
#   "params": { "name": "fetch_url", "arguments": {"url": "https://example.com"},
#               "_meta": {"scopyx/key": "{{secret:scopyx_key_<agent>}}"} }
#
# The broker fills the key in from its vault on the last hop; scopyx
# (`SCOPYX_ACCEPT_KEY_IN_META`) reads it from `_meta` and removes it at its
# door. The agent holds a handle and never the key, and scopyx admits nobody
# but this broker (`scopyx-ingress`), so a read of the web cannot go round the
# broker. That is what lets the broker label the run `web` from the fetch it
# saw (`TOKENFUSE_MCP_UPSTREAM_LABELS`, tokenfuse invariant 143) and not from a
# tool name the agent reported. One key per agent, three places that must
# agree, for an agent `<id>` (the id on its agent token) and a name `<agent>`
# (the last segment of `<id>`):
#
#   scopyx-keys          SCOPYX_KEYS                      <key>=<id>   (comma-separated)
#   tokenfuse-mcp-broker-keys
#                        TOKENFUSE_MCP_SECRETS            scopyx_key_<agent>=<key>
#                        TOKENFUSE_MCP_SECRET_SCOPES      scopyx_key_<agent>=agents:<id>;tools:browse|fetch_url
#
# Append each to what the Secret already holds; the typryx entries stay.
# `scopyx` is a named upstream here whether or not scopyx runs: with none, a
# call that names it is refused when the connection fails.
#
#
# ## The NetworkPolicies, narrower than the gateway's own
#
# Two pairs. `broker-egress-typryx` and `typryx-ingress-broker` are the one
# connection this plane needs: nothing else in the namespace is given a rule
# to reach typryx's port 4320, so typryx keeps the same "reachable by
# nothing but what this file names" posture it had with no NetworkPolicy at
# all. `broker-ingress` admits exactly the peers `30-network-policy.yaml`'s
# `planes-ingress` already admits into the gateway, `plane: console` and
# `plane: money`, on this broker's own port instead of the gateway's four;
# `console-egress-broker` is the matching half on the console's own egress
# side, additive beside `console-egress` in that file rather than editing it,
# the same pattern `47-scopyx.yaml`'s `scopyx-to-policy-plane` already uses
# for itself.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tokenfuse-mcp-broker
  namespace: agent-stack
  labels: { app: tokenfuse-mcp-broker, plane: money }
spec:
  replicas: 1
  selector: { matchLabels: { app: tokenfuse-mcp-broker } }
  template:
    metadata:
      labels: { app: tokenfuse-mcp-broker, plane: money }
    spec:
      # No workload here talks to the Kubernetes API; see CLAUDE.md
      # invariant 15. Without this every pod carries a projected token for
      # the namespace default ServiceAccount, bound to nothing today but
      # usable by a compromised container for discovery and SelfSubjectReview,
      # and by any future RBAC binding an operator adds to `default`.
      automountServiceAccountToken: false
      # uid and group 20012, the broker's own as in stack-single (CLAUDE.md
      # invariant 89): tokenfuse-mcp.ndjson is the bus owner's file in group
      # 20012. fsGroup 10001 enters the bus and reads the key files below.
      securityContext: { runAsNonRoot: true, runAsUser: 20012, runAsGroup: 20012, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      # Leave a dead node in 30 s, not the default 300 s. CLAUDE.md invariants 21
      # and 22: one replica, so the default would charge five minutes of outage
      # after the node is marked NotReady.
      tolerations:
        - { key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
        - { key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
      # The broker's copy of vouchryx's key set (CLAUDE.md invariant 54), as the gateway's: fetched before start,
      # into a memory volume, and retried until vouchryx answers.
      # bus-ready (CLAUDE.md invariant 89, GAPS G3.16): this pod mounts the bus as subPath streams, which
      # the bus-owner Job (manifests/11-bus.yaml) makes. kubelet would make a missing subPath itself, as
      # root 0777, so the pod waits for the owner's marker first, reading the volume root READ ONLY.
      initContainers:
        - name: bus-ready
          image: busybox@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          securityContext: { runAsNonRoot: true, runAsUser: 20012, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          command: ["sh", "-c", "i=0; until [ -f /bus/streams/.layout ]; do i=$((i+1)); if [ $i -gt 300 ]; then echo 'streams/.layout is not there: the bus-owner Job has not made the bus'; exit 1; fi; sleep 2; done"]
          volumeMounts: [{ name: events, mountPath: /bus, readOnly: true }]
        - name: fetch-vouchryx-jwks
          image: busybox@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          securityContext: { runAsNonRoot: true, runAsUser: 20012, runAsGroup: 20012, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          command: ["sh", "-c", "i=0; until wget -q -T 5 -O /jwks/jwks.json http://vouchryx:4310/.well-known/jwks.json && grep -q keys /jwks/jwks.json; do i=$((i+1)); [ $i -gt 150 ] && exit 1; sleep 2; done"]
          volumeMounts: [{ name: vouchryx-jwks, mountPath: /jwks }]
      containers:
        - name: broker
          # The gateway's own image and pin, exactly (see pinned-images.sh
          # and CLAUDE.md invariant 7): this is a subcommand of the same
          # binary, not a separate published artifact.
          image: ghcr.io/taipanbox/tokenfuse:v1.24.0@sha256:bc9ee4b657bbb332f7c8a345beeaaa1e071f05f6af2ce46882d0601a153eb7c5
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/tokenfuse"]
          args: ["mcp-broker"]
          env:
            # 0.0.0.0 because a pod binding loopback is reachable by nothing;
            # paired with TOKENFUSE_MCP_KEYS below, which is what makes a wide
            # bind here safe rather than an open proxy (tokenfuse CLAUDE.md
            # invariant 20).
            - { name: TOKENFUSE_MCP_ADDR, value: "0.0.0.0:4200" }
            - { name: TOKENFUSE_MCP_UPSTREAM, value: "http://typryx:4320/mcp" }
            - { name: TOKENFUSE_MCP_UPSTREAMS, value: "typryx=http://typryx:4320/mcp,scopyx=http://scopyx:4300" }
            # What scopyx's answers carry (tokenfuse v1.21.0, invariant 143): the web. The broker labels a
            # run from the fetch it saw, through the taint gateway below, which is always set here. With
            # this set a tools/call to scopyx must name its run in x-fuse-run-id, and an answer whose label
            # the gateway did not take is withheld. scripts/scopyx-reads-go-through-the-broker.sh holds it.
            - { name: TOKENFUSE_MCP_UPSTREAM_LABELS, value: "scopyx=web" }
            # Which agent and tool may resolve which secret: TOKENFUSE_MCP_SECRET_SCOPES is in
            # tokenfuse-mcp-broker-keys beside the vault it scopes (see the header), and a vault entry with
            # no rule stops the broker at start.
            - { name: TOKENFUSE_MCP_REQUIRE_SECRET_SCOPES, value: "1" }
            # The broker's own personal-data scanner, over tool arguments and tool responses.
            # shadow for the same reason as the gateway's: the call goes through, the count and
            # kinds are logged, never the text. On a tool response the broker marks _tokenfuse.dlp_pii with
            # the count and kinds, which the agent reads. The same `--pii-mode` switch changes it,
            # applied after the typed render that applies this file. scripts/pii-is-shadow-by-default.sh
            # holds it (CLAUDE.md invariant 38).
            - { name: TOKENFUSE_MCP_DLP_PII, value: "shadow" }
            # This broker's own line on the shared bus, beside
            # tokenfuse.ndjson and tokenfuse-cloud.ndjson: a tool call through
            # it is a metered, recorded act, same reason those two get their
            # own file rather than sharing one.
            - { name: TOKENFUSE_EVENTS_PATH, value: "/var/lib/stack/events/tokenfuse-mcp.ndjson" }
            # A raw secret found in tool arguments is refused (-32002), not
            # forwarded, and a tool listing the scanner flags is refused, not passed
            # with a log line. tokenfuse's own defaults are shadow and warn, which
            # forward both (finding F-009 of the 2026-10-17 review, measured on
            # stack-single's environment). A {{secret:NAME}} handle is not a raw
            # secret: the vault resolves it on the way out, as before.
            # scripts/broker-blocks-raw-secrets.sh holds these and the hook below
            # (CLAUDE.md invariant 51).
            - { name: TOKENFUSE_MCP_DLP, value: "block" }
            - { name: TOKENFUSE_MCP_SCAN, value: "block" }
            # The broker's policy hook: it asks wardryx about every tools/call, so
            # the policy judges tool calls as it judges model calls, and a call it
            # cannot attribute (no x-fuse-agent-id) is refused. Until 2026-10-17 the
            # broker had no hook unless the typed risk signal was on, so a tool the
            # policy denied was called anyway. Fail closed, as the gateway does; the
            # gateway's own PEP key, which may ask /v1/decide and /v1/filter-tools and read what a viewer reads.
            # With --typed-risk-signal, typed/mode.sh moves only the URL to typryx's
            # wardryx-proxy and gives a tool call the longer wait the proxy needs.
            - { name: TOKENFUSE_WARDRYX_MODE, value: "enforce" }
            - { name: TOKENFUSE_WARDRYX_URL, value: "http://wardryx:8090" }
            - name: TOKENFUSE_WARDRYX_KEY
              valueFrom: { secretKeyRef: { name: stack-keys, key: wardryx_gateway } }
            - { name: TOKENFUSE_WARDRYX_FAILMODE, value: "closed" }
            - { name: TOKENFUSE_WARDRYX_TIMEOUT_MS, value: "250" }
            - { name: TOKENFUSE_MCP_WARDRYX_TIMEOUT_MS, value: "1000" }
            - { name: TOKENFUSE_WARDRYX_CACHE_TTL_MS, value: "3000" }
            # tokenfuse v1.19.0 governed profile (invariant 62), as on the gateway.
            - { name: TOKENFUSE_PROFILE, value: "governed" }
            # The door (invariant 54): an agent's own token bound to its DPoP proof. A static key is admitted only from the list below.
            - { name: TOKENFUSE_AGENT_TOKENS, value: "require" }
            # broker static key broker-caller: the typed-answer door's own caller key, minted with the door (typed/mode.sh). It does not sign a DPoP proof.
            # broker static key drills-broker: the scheduled mockryx drills' key for this broker (Secret drills-broker-key). mockryx does not sign. CLAUDE.md invariant 85.
            # Each must also be in TOKENFUSE_MCP_KEYS, which the broker reads from tokenfuse-mcp-broker-keys; the broker refuses to start otherwise.
            # And each is a gateway client key of the same id and secret, on the gateway's list too: the tool-call check below is asked with
            # the caller's own key (tokenfuse invariant 118), and a key the gateway does not hold is refused 401 there, so the call is refused closed.
            - { name: TOKENFUSE_MCP_AGENT_TOKENS_STATIC_KEYS, value: "broker-caller,drills-broker" }
            - { name: TOKENFUSE_DELEGATION_ISSUER, value: "http://vouchryx:4310" }
            - { name: TOKENFUSE_DELEGATION_JWKS, value: "/etc/tokenfuse/delegation/jwks.json" }
            - { name: TOKENFUSE_DELEGATION_AUDIENCE, value: "https://vouchryx.agent-stack.invalid" }
            # Every address the broker is reached at in the cluster (CLAUDE.md invariant 74). This list serves this broker's
            # delegation door and its MCP proof door; a proof minted for the gateway is refused here.
            - { name: TOKENFUSE_DELEGATION_URL, value: "http://tokenfuse-mcp-broker:4200" }
            - { name: TOKENFUSE_DELEGATION_ORIGINS, value: "http://tokenfuse-mcp-broker:4200,http://tokenfuse-mcp-broker.agent-stack.svc.cluster.local:4200" }
            - { name: TOKENFUSE_MCP_PROOF_ORIGINS, value: "http://tokenfuse-mcp-broker:4200,http://tokenfuse-mcp-broker.agent-stack.svc.cluster.local:4200" }
            - { name: TOKENFUSE_DELEGATION_REVOCATIONS, value: "http://vouchryx:4310/v1/revocations" }
            - { name: TOKENFUSE_DELEGATION_REVOCATIONS_INTERVAL_MS, value: "12000" }
            - { name: TOKENFUSE_DELEGATION_REVOCATIONS_FAILMODE, value: "closed" }
            - { name: TOKENFUSE_DELEGATION_REVOCATIONS_MAX_AGE_SECS, value: "60" }
            # The tool-call check: the gateway's, asked with the broker's own key (invariant 54). Closed when it does not answer.
            - { name: TOKENFUSE_MCP_TAINT_GATEWAY, value: "http://tokenfuse-gateway:4100" }
            - { name: TOKENFUSE_MCP_TAINT_GATEWAY_KEY_FILE, value: "/run/taint/key" }
            - { name: TOKENFUSE_MCP_TAINT_FAILMODE, value: "closed" }
          envFrom:
            # NOT optional. Missing here is not an unconfigured feature, it
            # is a door with nothing on it or a vault with nothing in it; see
            # the header for what each half does, and for how the deploy
            # scripts mint it when absent (CLAUDE.md invariant 42).
            - secretRef: { name: tokenfuse-mcp-broker-keys }
          ports: [{ name: mcp, containerPort: 4200 }]
          lifecycle: { preStop: { sleep: { seconds: 5 } } }
          volumeMounts:
            - { name: events, mountPath: /var/lib/stack/events, subPath: streams }
            - { name: vouchryx-jwks, mountPath: /etc/tokenfuse/delegation, readOnly: true }
            - { name: taint-key, mountPath: /run/taint, readOnly: true }
          readinessProbe:
            # /healthz needs no credential, the same stance every plane here
            # takes on its own probe.
            httpGet: { path: /healthz, port: mcp }
            initialDelaySeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 30m, memory: 64Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: events
          persistentVolumeClaim: { claimName: stack-events }
        - name: vouchryx-jwks
          emptyDir: { medium: Memory, sizeLimit: 1Mi }
        # The broker's own client key for the tool-call check (minted with the gateway's keys, lib/identity-mint.sh).
        # fsGroup 10001 above gives it group 10001, so the uid reads it at 0440 (invariant 32).
        - name: taint-key
          secret: { secretName: broker-taint-key, defaultMode: 0440, items: [{ key: client_key, path: key }] }
---
apiVersion: v1
kind: Service
metadata: { name: tokenfuse-mcp-broker, namespace: agent-stack }
spec:
  selector: { app: tokenfuse-mcp-broker }
  ports: [{ name: mcp, port: 4200, targetPort: mcp }]
---
# The broker's outbound connection to typryx; its only other one is wardryx, below.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: broker-egress-typryx
  namespace: agent-stack
spec:
  podSelector: { matchLabels: { app: tokenfuse-mcp-broker } }
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector: { matchLabels: { app: typryx } }
      ports:
        - { protocol: TCP, port: 4320 }
---
# The broker's outbound connection to scopyx (G2.1), the web-egress plane it fronts. The pod
# selector is scopyx's, plain or with the browser (both keep `app: scopyx`).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: broker-egress-scopyx
  namespace: agent-stack
spec:
  podSelector: { matchLabels: { app: tokenfuse-mcp-broker } }
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector: { matchLabels: { app: scopyx } }
      ports:
        - { protocol: TCP, port: 4300 }
---
# The broker's policy hook (CLAUDE.md invariant 51): it asks wardryx about every
# tools/call. wardryx already admits this pod (`planes-ingress` in
# 30-network-policy.yaml lets `plane: money` in on 8090); this is the egress half,
# additive beside the file every install ships. With --typed-risk-signal the
# broker asks typryx's wardryx-proxy instead (56-typryx-wardryx-proxy.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: broker-egress-gateway
  namespace: agent-stack
spec:
  podSelector: { matchLabels: { app: tokenfuse-mcp-broker } }
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector: { matchLabels: { app: tokenfuse-gateway } }
      ports:
        - { protocol: TCP, port: 4100 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: broker-egress-wardryx
  namespace: agent-stack
spec:
  podSelector: { matchLabels: { app: tokenfuse-mcp-broker } }
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector: { matchLabels: { app: wardryx } }
      ports:
        - { protocol: TCP, port: 8090 }
---
# typryx must accept the connection the rule above allows. This is the FIRST
# NetworkPolicy naming typryx at all: 51-typryx.yaml shipped with none,
# reachable by nothing but the operator's own tunnel or port-forward under
# default-deny, and this is additive beside that rather than a replacement
# for it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: typryx-ingress-broker
  namespace: agent-stack
spec:
  podSelector: { matchLabels: { app: typryx } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: tokenfuse-mcp-broker } }
      ports:
        - { protocol: TCP, port: 4320 }
---
# Who may ask this broker to call a tool: the same peers 30-network-policy.yaml
# already admits into the gateway on its own four ports (`planes-ingress`),
# mirrored onto this broker's one port. NOT `podSelector: {}`, for
# 47-scopyx.yaml's own reason: every pod in the namespace reaching a
# credential broker would make the Secret the only control.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: broker-ingress
  namespace: agent-stack
spec:
  podSelector: { matchLabels: { app: tokenfuse-mcp-broker } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: { matchLabels: { plane: console } }
        - podSelector: { matchLabels: { plane: money } }
      ports:
        - { protocol: TCP, port: 4200 }
---
# The matching egress half for the console, additive beside
# 30-network-policy.yaml's own `console-egress` rather than editing a file
# that ships to every install (the same choice 47-scopyx.yaml makes with
# `scopyx-to-policy-plane`).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: console-egress-broker
  namespace: agent-stack
spec:
  podSelector: { matchLabels: { plane: console } }
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector: { matchLabels: { app: tokenfuse-mcp-broker } }
      ports:
        - { protocol: TCP, port: 4200 }
---
# The broker drills (CLAUDE.md invariant 85): mockryx's three drills for this broker (`/scenarios/mcp` in the
# image), a raw secret and personal data in tool arguments and the tool hold, fired at THIS broker with the
# drills' own key. A CronJob of its own beside the broker, not a second container of `drills`
# (40-routines-and-secrets.yaml): the broker exists only with the typed-answer door, and mockryx refuses a run
# whose broker does not answer (exit 2), so a container in the gateway drills' pod would fail that Job on every
# cluster without the door, and a Job retries a failed pod. Here it exists exactly where the broker does, and each
# pod holds one key: the gateway's client key stays in `drills`, this broker's key in this one (mockryx refuses the
# same secret for both).
#
# Suspended, like `drills`: run it with `kubectl -n agent-stack create job --from=cronjob/drills-broker drills-broker-now`.
#
# The tool-hold drill is this cluster's own copy (the ConfigMap drills-broker-scenarios below), mounted over the
# image's /scenarios/mcp/mcp-ungranted-tool-held.yaml. mockryx's own asks its second call for a RESULT, so an MCP
# server behind the broker would have to answer `search_notes`; none in this stack does (the broker's default
# upstream is typryx), and a drill that is red on every cluster teaches its reader to skip red. The copy keeps the
# first step and the two identities and makes both calls carry the vault handle `{{secret:typryx_key}}`, whose
# scope rule (TOKENFUSE_MCP_SECRET_SCOPES, `typryx_key=tools:ask|ask_freeform|list_questions`, minted by
# typed/mode.sh) does not reach search_notes. The broker asks wardryx before it resolves a secret, so the ungranted
# id is held (-32004 naming when_no_grant) and the drill identity, which grant-drills lets past the hold, is refused
# by the vault (-32008 "not scoped to agent"): both calls stop inside the broker, and nothing is forwarded. A broker
# that held everybody answers the second -32004, a Finding. The run opens one approval on wardryx; later runs ask
# the same question and wardryx keeps one pending row. scripts/broker-drills-pass.sh runs this job as shipped with no
# MCP server at all, and mockryx's original set against a stand-in server.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: drills-broker
  namespace: agent-stack
spec:
  schedule: "30 5 * * 1"
  suspend: true
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      # A drill that finds a gap exits 1. Running it again finds the same gap and opens nothing new.
      backoffLimit: 0
      template:
        metadata:
          # What broker-ingress-drills and drills-broker-egress below select on, and nothing else does.
          labels: { role: drills-broker }
        spec:
          restartPolicy: Never
          # No workload here talks to the Kubernetes API; see CLAUDE.md invariant 15.
          automountServiceAccountToken: false
          # fsGroup: the key below is a 0440 file, readable through the group fsGroup adds (CLAUDE.md invariant 32).
          # mockryx v0.5.0 accepts a key file owned by root at 0640 or stricter.
          securityContext: { runAsNonRoot: true, runAsUser: 20040, runAsGroup: 20040, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
          # uid and group 20040, as `drills`: both append to mockryx.ndjson (CLAUDE.md invariant 89).
          initContainers:
            - name: bus-ready
              image: busybox@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
              securityContext: { runAsNonRoot: true, runAsUser: 20040, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
              command: ["sh", "-c", "i=0; until [ -f /bus/streams/.layout ]; do i=$((i+1)); if [ $i -gt 300 ]; then echo 'streams/.layout is not there: the bus-owner Job has not made the bus'; exit 1; fi; sleep 2; done"]
              volumeMounts: [{ name: events, mountPath: /bus, readOnly: true }]
          containers:
            - name: mockryx
              image: ghcr.io/taipanbox/mockryx:v0.5.1@sha256:3926512211a4609a402d3812ae0321df46baaa90406ea439e3f5c89316ef85ef
              # mockryx requires --gateway; no step in /scenarios/mcp sends it anything, and this pod cannot reach it.
              args: ["run", "--gateway", "http://tokenfuse-gateway:4100", "/scenarios/mcp"]
              env:
                - name: MOCKRYX_EVENTS_PATH
                  valueFrom: { configMapKeyRef: { name: stack-wiring, key: MOCKRYX_EVENTS_PATH } }
                # The broker as mockryx posts to it, and whose /healthz it probes at the same origin first.
                - { name: MOCKRYX_MCP_BROKER, value: "http://tokenfuse-mcp-broker:4200/mcp" }
                # The drills' key for this broker, sent as x-fuse-key on the JSON-RPC call alone. Minted by the deploy
                # into gateway-client-keys as drills-broker and into the Secret drills-broker-key (lib/identity-mint.sh),
                # and given to this broker under the same id (typed/mode.sh). Optional: the job is suspended, and a cluster
                # applied by hand without the mint runs it keyless, which the broker refuses 401.
                - { name: MOCKRYX_MCP_BROKER_KEY_FILE, value: "/run/drills-broker/broker_key" }
              volumeMounts:
                - { name: events, mountPath: /var/lib/stack/events, subPath: streams }
                - { name: drills-broker-key, mountPath: /run/drills-broker, readOnly: true }
                # This cluster's tool-hold drill over the image's own file of that name (see above); the other two
                # broker drills run as the image ships them.
                - { name: scenarios, mountPath: /scenarios/mcp/mcp-ungranted-tool-held.yaml, subPath: mcp-ungranted-tool-held.yaml, readOnly: true }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 256Mi }
          volumes:
            - name: events
              persistentVolumeClaim: { claimName: stack-events }
            - name: drills-broker-key
              secret: { secretName: drills-broker-key, optional: true, defaultMode: 0440, items: [{ key: broker_key, path: broker_key }] }
            - name: scenarios
              configMap: { name: drills-broker-scenarios, defaultMode: 0444 }
---
# This cluster's own tool-hold drill for the broker (see the CronJob above), a mirror of stack-single's
# drill-scenarios/mcp-ungranted-tool-held.yaml with a name of its own, so a report says which of the two ran.
# scripts/broker-drills-pass.sh holds its fields: requires tool-hold, two steps, both search_notes with the
# typryx_key handle, the first as an id no grant can name (-32004, when_no_grant), the second as a drill identity
# (-32008, not scoped to agent).
apiVersion: v1
kind: ConfigMap
metadata:
  name: drills-broker-scenarios
  namespace: agent-stack
data:
  mcp-ungranted-tool-held.yaml: |
    # mcp-ungranted-tool-held, as this cluster runs it: a fire drill for the tool hold, the rule that a tool call
    # nothing grants waits for a person (stack-k8s CLAUDE.md invariant 83). (OWASP Top 10 for LLM Applications 2025:
    # LLM06:2025 Excessive Agency.) Defensive intent: it sends this cluster's OWN MCP broker the same harmless
    # tools/call twice, as two identities, and reaches no MCP server: both calls stop inside the broker.
    name: mcp-ungranted-tool-held-on-this-cluster
    requires: tool-hold
    description: >
      An agent nothing grants calls an MCP tool through this cluster's broker. The broker should hold the call for a
      person, with JSON-RPC error -32004 naming when_no_grant. The same call from a drill identity, which grant-drills
      grants, should get past the hold and be refused by the broker's vault (-32008), because the secret handle it
      carries is scoped to other tools; nothing reaches an MCP server.
    steps:
      - name: an-id-no-grant-can-name-is-held
        mcp:
          method: tools/call
          params:
            name: search_notes
            arguments:
              query: "fire drill: nothing to find"
            _meta:
              typryx/key: "{{secret:typryx_key}}"
        headers:
          agent_id: agent://ungranted.invalid/rehearsal/no-grant
        expect:
          error_code: -32004
          error_contains: when_no_grant
      - name: a-drill-identity-under-grant-drills-gets-past-the-hold
        mcp:
          method: tools/call
          params:
            name: search_notes
            arguments:
              query: "fire drill: nothing to find"
            _meta:
              typryx/key: "{{secret:typryx_key}}"
        headers:
          agent_id: agent://mockryx.local/rehearsal/tool-hold
        expect:
          error_code: -32008
          error_contains: not scoped to agent
---
# The broker drills reach this broker on 4200 and nothing else (DNS aside, allow-dns in 30-network-policy.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: drills-broker-egress
  namespace: agent-stack
spec:
  podSelector: { matchLabels: { role: drills-broker } }
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector: { matchLabels: { app: tokenfuse-mcp-broker } }
      ports:
        - { protocol: TCP, port: 4200 }
---
# The broker's half: it accepts the broker drills on its one port. Not `role: drills`, the gateway drills' pod,
# which holds the gateway's client key and has no reason to reach this broker.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: broker-ingress-drills
  namespace: agent-stack
spec:
  podSelector: { matchLabels: { app: tokenfuse-mcp-broker } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: { matchLabels: { role: drills-broker } }
      ports:
        - { protocol: TCP, port: 4200 }
