# The broker's network for agent tokens (CLAUDE.md invariant 54). Applied only by agent-tokens/up.sh
# with the broker patch. The broker reaches the gateway's tool-call check and vouchryx's revocation
# list, and nothing else is added: the typryx and wardryx rules in 52-tokenfuse-mcp-broker.yaml
# stand. The gateway and vouchryx admit the broker on the same two ports.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: broker-egress-taint-and-revocations
  namespace: agent-stack
spec:
  podSelector: { matchLabels: { app: tokenfuse-mcp-broker } }
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector: { matchLabels: { app: tokenfuse-gateway } }
      ports:
        - { protocol: TCP, port: 4100 }
    - to:
        - podSelector: { matchLabels: { app: vouchryx } }
      ports:
        - { protocol: TCP, port: 4310 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-ingress-broker
  namespace: agent-stack
spec:
  podSelector: { matchLabels: { app: tokenfuse-gateway } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: tokenfuse-mcp-broker } }
      ports:
        - { protocol: TCP, port: 4100 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vouchryx-ingress-broker
  namespace: agent-stack
spec:
  podSelector: { matchLabels: { app: vouchryx } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: tokenfuse-mcp-broker } }
      ports:
        - { protocol: TCP, port: 4310 }
