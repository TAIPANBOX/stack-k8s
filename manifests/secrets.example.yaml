# Shape only. No real value is in this file, and none should ever be committed
# into one: create the Secret on your own cluster and keep it there.
#
#   kubectl -n agent-stack create secret generic stack-keys \
#     --from-literal=cloud_admin="$(cat ~/.taipan/live.keys.json | jq -r .secrets.cloud_admin)" \
#     --from-literal=wardryx_admin="$(cat ~/.taipan/live.keys.json | jq -r .secrets.wardryx_admin)"
#
# Then drop the devkey env pair from 10-planes.yaml and reference this instead:
#
#   env:
#     - name: TOKENFUSE_CLOUD_KEYS
#       valueFrom: { secretKeyRef: { name: stack-keys, key: cloud_admin } }
#
# The console's operator record and passkey store are NOT here on purpose: they
# are created by the operator inside the running console (a password they set, a
# passkey their own device holds) and live on the console-state volume. Nothing
# in this repo can mint an identity, which is the point.
apiVersion: v1
kind: Secret
metadata:
  name: stack-keys
  namespace: agent-stack
type: Opaque
stringData:
  cloud_admin: "REPLACE_ME_ON_YOUR_CLUSTER"
  wardryx_admin: "REPLACE_ME_ON_YOUR_CLUSTER"
