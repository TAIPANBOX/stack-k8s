# The agent registry and the cluster's workload issuer, on vouchryx (WAVE1-DESIGN 1.3, 1.2;
# CLAUDE.md invariant 54). Applied only by agent-tokens/up.sh, which writes the two
# ConfigMaps this reads. Both are data, not secrets: the registry holds sha256 digests of
# enrolment keys and workload subjects, and the workload JWKS is public.
#
#   VOUCHRYX_AGENTS            one line per agent: agent://<td>/<path>|<unit>|<org>|<credential>
#   VOUCHRYX_WORKLOAD_ISSUERS  <issuer>|<audience>|<jwks path>: the cluster's own service-account
#                              issuer, with the audience its projected tokens carry (this
#                              vouchryx) and the JWKS file mounted below
#   VOUCHRYX_ALLOWED_AUDIENCES the one audience agent tokens may carry: this vouchryx's issuer
#
# A ConfigMap read here is not optional: vouchryx refuses to start without the registry it
# was told to load, which is the point.
spec:
  template:
    spec:
      containers:
        - name: vouchryx
          env:
            - { name: VOUCHRYX_ALLOWED_AUDIENCES, value: "http://vouchryx:4310" }
            - name: VOUCHRYX_AGENTS
              valueFrom: { configMapKeyRef: { name: vouchryx-agents, key: agents } }
            - name: VOUCHRYX_WORKLOAD_ISSUERS
              valueFrom: { configMapKeyRef: { name: vouchryx-workload, key: issuers } }
          volumeMounts:
            - { name: workload-jwks, mountPath: /etc/vouchryx/workload, readOnly: true }
      volumes:
        - name: workload-jwks
          configMap: { name: vouchryx-workload-jwks, defaultMode: 0444, items: [{ key: jwks.json, path: jwks.json }] }
