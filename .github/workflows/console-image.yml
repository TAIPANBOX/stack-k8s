name: console image

# Publish the Genaryx console to ghcr.io, so an install stops building it.
#
#   ghcr.io/<owner>/genaryx-console:<tag>
#
# WHY THIS WORKFLOW IS HERE AND NOT IN genaryx
#
# The console's image is not one repository built into a container. It is a
# COMPOSITION of five, and the composition is defined by images/console.Dockerfile
# in this repository:
#
#   genaryx-a360  the console itself, Rust server and a Node front end
#   qryx          crypto scan       )
#   mockryx       hostile drills    )  four tools the console SPAWNS rather
#   verdryx       quality evals     )  than calls, so they have to be inside
#   engram        memory, over MCP  )  its image and not beside it as pods
#
# A sidecar cannot be another container's stdin, which is why engram in
# particular cannot be a pod: the console speaks MCP to it over a pipe. See the
# README's "the console is not a client of four services, it is a host of five
# tools". So genaryx alone cannot publish this image, because four fifths of
# what makes it useful is not in genaryx.
#
# WHY THE TAG IS THIS REPOSITORY'S
#
# The image is this repository's composition, so it carries this repository's
# version, and the five source commits ride along as labels. The alternative
# considered was naming it after the genaryx commit, which is immutable and
# would have kept this repository version-free; it was rejected because that
# name answers "which console" and says nothing about which four tools are
# inside it, and those four are half of what the image is.
#
# ARM64, BUILT NATIVELY
#
# The cheap trick that makes a Go image multi-arch, compiling from BUILDPLATFORM
# with GOARCH set, does not apply here: this is four languages and the Rust and
# Node stages have no equivalent. The other route is QEMU, which for a Rust
# compiler is tens of minutes.
#
# So each architecture is built on a runner of that architecture, pushed BY
# DIGEST with no tag, and a second job merges the digests into one manifest list
# carrying the tag. Both runners are free for public repositories.
#
# Six checkouts happen twice, once per architecture, which is the cost. It buys
# a console that pulls on a Graviton node with the same pinned tag as on an x86
# one, and nobody has to know which they got.
# The commits this image is built from, in one place (CLAUDE.md invariant 68). Each is the commit its release
# tag names (read with git ls-remote, the peeled commit). genaryx has no tags, so it is the merge commit of
# TAIPANBOX/genaryx#134, the Keyryx witness's findings read as a read-only extra stream pinned to its own
# source. Move one by changing this block and nothing else.
env:
  QRYX_REF: 432f0502f8d68623fdcd1a58b5e59711618527d9      # qryx v1.1.1
  MOCKRYX_REF: 81c78303a00eb74b50b783a40816be6110b4b64f   # mockryx v0.3.1
  VERDRYX_REF: 42617d2268500e46b93302a93de7412522668e91   # verdryx v0.1.0
  ENGRAM_REF: b0b72a87bda73b8ec1287ee6d2450dd60290a0b3    # engram v3.0.0
  GENARYX_REF: 869c1ce52a9ba8e32d2637d37a1a6cfe50123d2f   # genaryx #134 merge commit

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "The immutable tag to publish under, e.g. v0.1.2. Required on a dispatch: without it the image would be named after the branch."
        required: true
        type: string
  # build-pr below runs on a pull request that touches THIS file or
  # images/console.Dockerfile, and nothing else does: build and merge stay off
  # (see their `if`), so a pull request proves the image builds and every
  # bundled tool runs, and publishes nothing. Added 2026-09-02 after
  # tokenfuse's v0.4.2 failed on both Linux
  # runners the first time its own tag-only release.yml ever reached its musl
  # leg: a workflow gated on `push: tags: v*` alone is tested by exactly one
  # event in its whole life, and that event is the one where a mistake is
  # public.
  pull_request:
    paths:
      - ".github/workflows/console-image.yml"
      - "images/console.Dockerfile"

permissions:
  contents: read

jobs:
  build:
    # Pushes to the registry by digest, so it needs the package scope the
    # top level no longer grants; `contents: read` repeated for the checkout.
    permissions:
      contents: read
      packages: write
    name: console on ${{ matrix.arch }}
    # Never on a pull request: this job pushes by digest. build-pr below is
    # what a pull request runs instead.
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      # This repository into a subdirectory, because the build context is the
      # PARENT of all six checkouts: console.Dockerfile's COPY paths are
      # `genaryx-a360/...`, `qryx/...` and so on, exactly as the deploy scripts
      # arrange them on a builder node.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: stack-k8s

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TAIPANBOX/genaryx
          ref: ${{ env.GENARYX_REF }}
          path: genaryx-a360
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TAIPANBOX/qryx
          ref: ${{ env.QRYX_REF }}
          path: qryx
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TAIPANBOX/mockryx
          ref: ${{ env.MOCKRYX_REF }}
          path: mockryx
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TAIPANBOX/verdryx
          ref: ${{ env.VERDRYX_REF }}
          path: verdryx
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TAIPANBOX/engram
          ref: ${{ env.ENGRAM_REF }}
          path: engram

      # What went in, recorded where somebody can read it later. An image built
      # from five moving repositories and labelled with one tag is an image
      # nobody can reproduce, and "which qryx is in this console" is exactly the
      # question an incident asks.
      - name: record what this is built from
        id: sources
        run: |
          # The output KEY drops the -a360, because a GitHub Actions
          # expression cannot reach a property whose name carries a hyphen
          # with dot notation, and the checkout PATH has to keep it because
          # that is the directory name console.Dockerfile copies from.
          for r in genaryx-a360 qryx mockryx verdryx engram; do
            sha=$(git -C "$r" rev-parse HEAD)
            key="${r%-a360}"
            echo "$key=$sha" >> "$GITHUB_OUTPUT"
            echo "  $r $sha"
          done

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: lowercase the owner
        id: owner
        run: echo "name=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      # The tag these images will carry, and it must not be able to move.
      #
      # `github.ref_name` is the tag on a tag push and the BRANCH NAME on a
      # workflow_dispatch, so dispatching this from main would publish
      # `<image>:main`: exactly the moving tag invariant 7 forbids, produced by
      # a workflow that looks like it is doing the right thing. Nobody had hit
      # it because these workflows had only ever run on a tag.
      #
      # So a dispatch has to say which version it is publishing, and anything
      # that is not a v-prefixed tag is refused here rather than discovered in
      # the registry.
      - name: the version, and it must not move
        id: ver
        run: |
          v="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          case "$v" in
            v[0-9]*) ;;
            *)
              echo "refusing to publish under '$v': not a v-prefixed immutable tag." >&2
              echo "Push a tag, or dispatch with the version input set." >&2
              exit 1 ;;
          esac
          echo "tag=$v" >> "$GITHUB_OUTPUT"
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      # By digest and by nothing else. The merge below is what gives these a
      # name; until it runs they are unreferenced blobs, which is what a
      # half-finished release should be rather than a tag somebody's arm64 node
      # pulls and fails on.
      - name: build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: stack-k8s/images/console.Dockerfile
          outputs: type=image,name=ghcr.io/${{ steps.owner.outputs.name }}/genaryx-console,push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.version=${{ steps.ver.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            dev.taipanbox.source.genaryx=${{ steps.sources.outputs.genaryx }}
            dev.taipanbox.source.qryx=${{ steps.sources.outputs.qryx }}
            dev.taipanbox.source.mockryx=${{ steps.sources.outputs.mockryx }}
            dev.taipanbox.source.verdryx=${{ steps.sources.outputs.verdryx }}
            dev.taipanbox.source.engram=${{ steps.sources.outputs.engram }}
          cache-from: type=gha,scope=console-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=console-${{ matrix.arch }}

      # Does each binary EXECUTE on this architecture. That is the question,
      # and it is not the same as "does it exit 0".
      #
      # The first version of this ran `qryx --help` and required success. qryx
      # prints its usage and exits 1, because `--help` is not one of its
      # commands, so the check failed on a perfectly good image on both
      # architectures at once. A smoke test that fails on a correct build is
      # worse than none: the next person deletes it.
      #
      # A binary built for the wrong architecture does not exit non-zero. The
      # kernel refuses to run it at all and says `exec format error`, so that
      # is what this looks for, plus the plainer failure of producing no output
      # whatsoever. Exit codes are ignored on purpose.
      #
      # All four tools and not only the server: this image exists to HOST qryx,
      # mockryx, verdryx and engram, which the console spawns rather than calls.
      # One of them built for the wrong architecture gives a console with a
      # permanently empty tab, and the page still renders.
      - name: every bundled tool executes on the architecture that built it
        run: |
          set -eu
          img="ghcr.io/${{ steps.owner.outputs.name }}/genaryx-console@${{ steps.build.outputs.digest }}"
          echo "on $(uname -m), image $img"
          docker run --rm --entrypoint /bin/sh "$img" -c '
            fail=0
            for t in qryx mockryx verdryx genaryx-web; do
              out=$(command -v "$t" >/dev/null 2>&1 && "$t" 2>&1 | head -5 || echo "__NOT_ON_PATH__")
              case "$out" in
                *"exec format error"*)
                  echo "  $t: EXEC FORMAT ERROR, built for another architecture"; fail=1 ;;
                __NOT_ON_PATH__)
                  echo "  $t: not on PATH in this image"; fail=1 ;;
                "")
                  echo "  $t: ran and said nothing at all"; fail=1 ;;
                *)
                  echo "  $t: runs" ;;
              esac
            done
            uname -m
            exit $fail
          '

      - name: hand the digest on
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-console-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    # Pushes to the registry by digest, so it needs the package scope the
    # top level no longer grants; `contents: read` repeated for the checkout.
    permissions:
      contents: read
      packages: write
      # Keyless signature and provenance attestation: the OIDC token they are made
      # from, and the attestation record. Granted to this job only, which publishes;
      # the build jobs keep the narrower grant above.
      id-token: write
      attestations: write
    name: merge the manifest list
    needs: build
    # Never on a pull request: this job creates the manifest list under the
    # published tag. With build guarded off above, needs: build already skips
    # this on a pull request; the explicit if says so directly too.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-console-*
          merge-multiple: true
          path: /tmp/digests

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: lowercase the owner
        id: owner
        run: echo "name=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      # The tag these images will carry, and it must not be able to move.
      #
      # `github.ref_name` is the tag on a tag push and the BRANCH NAME on a
      # workflow_dispatch, so dispatching this from main would publish
      # `<image>:main`: exactly the moving tag invariant 7 forbids, produced by
      # a workflow that looks like it is doing the right thing. Nobody had hit
      # it because these workflows had only ever run on a tag.
      #
      # So a dispatch has to say which version it is publishing, and anything
      # that is not a v-prefixed tag is refused here rather than discovered in
      # the registry.
      - name: the version, and it must not move
        id: ver
        run: |
          v="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          case "$v" in
            v[0-9]*) ;;
            *)
              echo "refusing to publish under '$v': not a v-prefixed immutable tag." >&2
              echo "Push a tag, or dispatch with the version input set." >&2
              exit 1 ;;
          esac
          echo "tag=$v" >> "$GITHUB_OUTPUT"
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "ghcr.io/${{ steps.owner.outputs.name }}/genaryx-console:${{ steps.ver.outputs.tag }}" \
            $(printf 'ghcr.io/${{ steps.owner.outputs.name }}/genaryx-console@sha256:%s ' *)

      # Printed rather than assumed. A manifest list with one architecture in it
      # looks identical to a correct one from the outside, and that is the
      # failure this whole job exists to end.
      - name: say what is in it
        run: |
          docker buildx imagetools inspect \
            "ghcr.io/${{ steps.owner.outputs.name }}/genaryx-console:${{ steps.ver.outputs.tag }}"

      # The image is signed by digest and its provenance attested, keyless, the way
      # tokenfuse's release does it (the same action commits, the same cosign). The
      # signature is over the manifest list's own digest, the one a deployment pins:
      # a per-architecture digest would sign half an image. A stranger verifies with
      #   cosign verify ghcr.io/<owner>/genaryx-console:<tag> \
      #     --certificate-identity-regexp '^https://github.com/TAIPANBOX/stack-k8s/\.github/workflows/console-image\.yml@refs/tags/v' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      #   gh attestation verify oci://ghcr.io/<owner>/genaryx-console:<tag> -R TAIPANBOX/stack-k8s
      - name: the manifest list's digest, which is what gets signed
        id: created
        run: |
          tag="ghcr.io/${{ steps.owner.outputs.name }}/genaryx-console:${{ steps.ver.outputs.tag }}"
          digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest.Digest}}' | tr -d '"')
          case "$digest" in
            sha256:*) ;;
            *) echo "no manifest-list digest for $tag: got '$digest'" >&2; exit 1 ;;
          esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "signing ghcr.io/${{ steps.owner.outputs.name }}/genaryx-console@$digest"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # Legacy signature format: a .sig tag that policy-controller v0.15.1 reads. Both flags are
      # deprecated in cosign v3 but still accepted. Remove them when policy-controller reads the
      # bundle format for image signatures (upstream PR sigstore/policy-controller#1968).
      - name: sign the image by digest, keyless
        run: cosign sign --yes --new-bundle-format=false --use-signing-config=false "ghcr.io/${{ steps.owner.outputs.name }}/genaryx-console@${{ steps.created.outputs.digest }}"

      - name: provenance attestation for the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.owner.outputs.name }}/genaryx-console
          subject-digest: ${{ steps.created.outputs.digest }}
          push-to-registry: true

  # What a pull request runs instead of build/merge: the same six checkouts
  # and the same Dockerfile, loaded into the local daemon rather than pushed
  # by digest, so the smoke test below can run it. No registry login, no
  # owner-lowercasing, no version-must-not-move check: none of those matter to
  # an image that is never pushed and carries no tag but a local one.
  build-pr:
    name: console on ${{ matrix.arch }} (build only, no push)
    # Only on the pull request that exercises this file: build and merge
    # above already cover a tag push, and running both here would repeat the
    # six-checkout cost for nothing.
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      # This repository into a subdirectory, because the build context is the
      # PARENT of all six checkouts: console.Dockerfile's COPY paths are
      # `genaryx-a360/...`, `qryx/...` and so on, exactly as the deploy scripts
      # arrange them on a builder node.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: stack-k8s

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TAIPANBOX/genaryx
          ref: ${{ env.GENARYX_REF }}
          path: genaryx-a360
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TAIPANBOX/qryx
          ref: ${{ env.QRYX_REF }}
          path: qryx
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TAIPANBOX/mockryx
          ref: ${{ env.MOCKRYX_REF }}
          path: mockryx
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TAIPANBOX/verdryx
          ref: ${{ env.VERDRYX_REF }}
          path: verdryx
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TAIPANBOX/engram
          ref: ${{ env.ENGRAM_REF }}
          path: engram

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Loaded into the local daemon rather than pushed, so the smoke test
      # below can `docker run` it. BuildKit only, same as the real build: the
      # heredoc entrypoints these five repositories' Dockerfiles may carry
      # need it, and setup-buildx-action's default driver already is BuildKit,
      # so push: false plus load: true is the whole of the difference from the
      # real build step.
      - name: build (no push)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: stack-k8s/images/console.Dockerfile
          push: false
          load: true
          tags: genaryx-console:pr-${{ matrix.arch }}
          cache-from: type=gha,scope=console-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=console-${{ matrix.arch }}

      # The same question the real build asks: does each bundled tool EXECUTE
      # on this architecture, not merely "does it exit 0". See the comment on
      # the equivalent step in the `build` job above for why exit codes are
      # ignored on purpose here too.
      - name: every bundled tool executes on the architecture that built it
        run: |
          set -eu
          img="genaryx-console:pr-${{ matrix.arch }}"
          echo "on $(uname -m), image $img"
          docker run --rm --entrypoint /bin/sh "$img" -c '
            fail=0
            for t in qryx mockryx verdryx genaryx-web; do
              out=$(command -v "$t" >/dev/null 2>&1 && "$t" 2>&1 | head -5 || echo "__NOT_ON_PATH__")
              case "$out" in
                *"exec format error"*)
                  echo "  $t: EXEC FORMAT ERROR, built for another architecture"; fail=1 ;;
                __NOT_ON_PATH__)
                  echo "  $t: not on PATH in this image"; fail=1 ;;
                "")
                  echo "  $t: ran and said nothing at all"; fail=1 ;;
                *)
                  echo "  $t: runs" ;;
              esac
            done
            uname -m
            exit $fail
          '
