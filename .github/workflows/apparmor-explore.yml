# TEMPORARY, removed before this branch is ready: what AppArmor does to Chromium's user namespace
# in a pod on an Ubuntu 26.04 node, and which Localhost profile, if any, lets it through.
name: apparmor-explore
on:
  pull_request:
    paths:
      - .github/workflows/apparmor-explore.yml
permissions:
  contents: read
jobs:
  explore:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: k3s
        run: |
          set -euo pipefail
          v="$(sed -n 's/^K3S_VERSION="${K3S_VERSION:-\(v[^}]*\)}".*/\1/p' install.sh)"
          curl -sfL https://get.k3s.io -o "$RUNNER_TEMP/k3s-install.sh"
          INSTALL_K3S_VERSION="$v" INSTALL_K3S_EXEC="server --disable=traefik --disable=servicelb --disable=metrics-server --write-kubeconfig-mode=0644" sh "$RUNNER_TEMP/k3s-install.sh"
          for _ in $(seq 60); do kubectl get nodes >/dev/null 2>&1 && break; sleep 2; done
          kubectl wait --for=condition=Ready node --all --timeout=180s
      - name: facts
        run: |
          set -x
          cat /proc/self/attr/apparmor/current || true
          for n in k3s-server containerd containerd-shim-runc-v2 systemd; do for p in $(pgrep -x "$n" | head -2); do echo "$n $p: $(sudo cat /proc/$p/attr/apparmor/current)"; done; done
          sudo grep -E 'unconfined|unprivileged_userns|cri-containerd|runc' /sys/kernel/security/apparmor/profiles || true
          ls /etc/apparmor.d | head -100
          sudo cat /etc/apparmor.d/unprivileged_userns 2>/dev/null || true
          sudo cat /etc/apparmor.d/runc 2>/dev/null || true
          sudo cat /etc/apparmor.d/chromium 2>/dev/null || true
          sudo cat /etc/apparmor.d/chrome 2>/dev/null || true
          cat /etc/apparmor/parser.conf 2>/dev/null | grep -v '^#' | grep . || true
          ls /usr/share/apparmor-features 2>/dev/null || true
          ls /var/lib/rancher/k3s/data/current/bin/ | head -40
          /var/lib/rancher/k3s/data/current/bin/runc --version || true
          apparmor_parser --version | head -1
          sudo cat /sys/kernel/security/apparmor/features/namespaces/userns_create 2>/dev/null || ls /sys/kernel/security/apparmor/features/namespaces/ || true
      - name: profiles and pods
        run: |
          set -uo pipefail
          sudo mkdir -p /var/lib/kubelet/seccomp/taipanbox
          sudo cp seccomp/chromium-v1.json /var/lib/kubelet/seccomp/taipanbox/chromium-v1.json
          body='  #include <abstractions/base>
            network,
            capability,
            file,
            umount,
            signal (receive) peer=unconfined,
            signal (receive) peer=runc,
            signal (receive) peer=crun,
            signal (send,receive) peer=@@NAME@@,
            deny @{PROC}/* w,
            deny @{PROC}/{[^1-9],[^1-9][^0-9],[^1-9s][^0-9y][^0-9s],[^1-9][^0-9][^0-9][^0-9]*}/** w,
            deny @{PROC}/sys/[^k]** w,
            deny @{PROC}/sys/kernel/{?,??,[^s][^h][^m]**} w,
            deny @{PROC}/sysrq-trigger rwklx,
            deny @{PROC}/mem rwklx,
            deny @{PROC}/kmem rwklx,
            deny @{PROC}/kcore rwklx,
            deny mount,
            deny /sys/[^f]*/** wklx,
            deny /sys/f[^s]*/** wklx,
            deny /sys/fs/[^c]*/** wklx,
            deny /sys/fs/c[^g]*/** wklx,
            deny /sys/fs/cg[^r]*/** wklx,
            deny /sys/firmware/** rwklx,
            deny /sys/devices/virtual/powercap/** rwklx,
            deny /sys/kernel/security/** rwklx,
            ptrace (trace,tracedby,read,readby) peer=@@NAME@@,'
          mk() { # name header extra
            { printf '%s\n' "$2"; printf '#include <tunables/global>\nprofile %s flags=(attach_disconnected,mediate_deleted) {\n' "$1"; printf '%s\n' "${body//@@NAME@@/$1}"; printf '%s\n}\n' "$3"; } | sudo tee "/etc/apparmor.d/$1" >/dev/null
            sudo apparmor_parser -r -W "/etc/apparmor.d/$1" && echo "loaded $1" || echo "FAILED to load $1"
          }
          mk tbx-default-userns '' '  userns,'
          mk tbx-abi4-userns 'abi <abi/4.0>,' '  userns,'
          mk tbx-abi4-plain 'abi <abi/4.0>,' ''
          printf '#include <tunables/global>\nprofile tbx-unconfined-userns flags=(unconfined) {\n  userns,\n}\n' | sudo tee /etc/apparmor.d/tbx-unconfined-userns >/dev/null
          sudo apparmor_parser -r -W /etc/apparmor.d/tbx-unconfined-userns && echo loaded unconfined
          sudo grep tbx /sys/kernel/security/apparmor/profiles
          kubectl create namespace lab
          kubectl label namespace lab pod-security.kubernetes.io/enforce=restricted pod-security.kubernetes.io/enforce-version=latest
          img="$(sed -nE 's/^ +image: (ghcr\.io\/taipanbox\/scopyx:\S+-chromium@sha256:[0-9a-f]{64})$/\1/p' manifests/48-scopyx-browser.yaml)"
          for v in runtime tbx-default-userns tbx-abi4-userns tbx-abi4-plain tbx-unconfined-userns; do
            if [ "$v" = runtime ]; then aa=''; else aa="appArmorProfile: { type: Localhost, localhostProfile: $v },"; fi
            cat <<YAML | kubectl -n lab apply -f -
          apiVersion: v1
          kind: Pod
          metadata: { name: p-$v }
          spec:
            automountServiceAccountToken: false
            securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
            containers:
              - name: c
                image: $img
                command: ["sleep", "infinity"]
                securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] }, $aa seccompProfile: { type: Localhost, localhostProfile: taipanbox/chromium-v1.json } }
                volumeMounts: [{ name: tmp, mountPath: /tmp }, { name: shm, mountPath: /dev/shm }]
            volumes: [{ name: tmp, emptyDir: {} }, { name: shm, emptyDir: { medium: Memory } }]
          YAML
          done
          kubectl -n lab wait --for=condition=Ready pod --all --timeout=300s || kubectl -n lab get pods -o wide
          for v in runtime tbx-default-userns tbx-abi4-userns tbx-abi4-plain tbx-unconfined-userns; do
            echo "=== $v"
            kubectl -n lab exec "p-$v" -- sh -c 'cat /proc/1/attr/apparmor/current; for f in -Ur -Urm -Urn; do unshare $f true 2>/dev/null && echo "unshare $f allowed" || echo "unshare $f refused"; done; unshare -Ur cat /proc/self/attr/apparmor/current 2>&1; timeout 60 chromium --headless=new --no-first-run --disable-gpu --user-data-dir=/tmp/p$$ --dump-dom "data:text/html,<p>rendered-ok</p>" 2>/tmp/err.txt | grep -o rendered-ok; tail -3 /tmp/err.txt; (timeout 20 chromium --headless=new --no-first-run --disable-gpu --user-data-dir=/tmp/q$$ --remote-debugging-port=9222 "data:text/html,<p>x</p>" 2>/tmp/err2.txt &); sleep 6; for q in /proc/[0-9]*; do c="$(tr "\000" " " <$q/cmdline 2>/dev/null)"; case "$c" in *chromium*) echo "$(echo "$c" | grep -o -- "--type=[a-z-]*" | head -1) $(grep NSpid $q/status | tr -s "\t " " ") $(readlink $q/ns/user) $(grep Seccomp_filters $q/status | tr -s "\t " " ") $(cat $q/attr/apparmor/current)";; esac; done; grep -i sandbox /tmp/err2.txt | head -3' 2>&1
            sudo dmesg | grep DENIED | tail -3
          done
