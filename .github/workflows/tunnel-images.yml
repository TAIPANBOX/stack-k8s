name: tunnel images

# Publish the operator's door to ghcr.io, so no install builds it:
#
#   ghcr.io/<owner>/stack-caddy:<tag>   TLS for the console inside the tunnel
#   ghcr.io/<owner>/stack-wg:<tag>      the WireGuard server and its UAPI relay
#
# WHY THESE TWO AND WHY NOW
#
# Every other image the deployments name is published and pinned since
# 2026-09-01, and a cluster deploy now prints "nothing to build". These two were
# left behind, and they are the last reason a SINGLE-BOX install still needs a
# toolchain: `stack-single/install.sh` clones this repository and builds them on
# the operator's own machine, on a box that may be a 2-vCPU VPS.
#
# The number that belongs here is a measurement, and it is being taken as this
# is written: a from-scratch `stack-single` install on a GCP e2-standard-2, two
# vCPU, building all ten images on the box. It is filled in below when the run
# ends, and not before. An earlier draft of this comment carried an estimate
# written as though it were measured, which is the exact habit the estate's
# provenance rule exists to stop.
#
# WHY THE NAMES CARRY A `stack-` PREFIX
#
# `caddy` and `wg` are the two most generic names in this registry, and the
# package namespace is shared with every other image the estate publishes. A
# package called `caddy` under this owner would read as "upstream Caddy,
# mirrored", which it is not: this one carries a DNS-01 provider plugin and an
# entrypoint that writes its own Caddyfile. The prefix says whose it is.
#
# WHY BOTH ARCHITECTURES, BUILT NATIVELY
#
# Same reason as the console: these are Go builds inside a Dockerfile, so the
# BUILDPLATFORM trick would need the Dockerfiles rewritten, and QEMU for a Go
# toolchain plus `xcaddy` is minutes per architecture. Runners of both
# architectures are free for public repositories, so each builds on its own and
# a merge job makes one manifest list.
#
# WHAT THE SMOKE TEST ASKS, AND WHAT IT DELIBERATELY DOES NOT
#
# It asks whether the entrypoint EXISTS AND IS NON-EMPTY, and whether the
# binaries execute on the architecture that built them. Both questions come from
# failures this repository has already paid for:
#
#   - GOTCHAS 47: the heredoc entrypoint in both Dockerfiles requires BuildKit.
#     The legacy builder accepts the file, reports success, and produces an
#     EMPTY entrypoint. The container then dies with "exec format error" and
#     nothing in the build output hints why.
#   - 2026-09-01: a smoke test that ran `qryx --help` and required exit 0 failed
#     a perfectly good image on both architectures, because that command exits 1
#     by design. A check that goes red on a correct build is worse than no
#     check, because the next person deletes it and takes real coverage along.
#
# So exit codes are ignored on purpose here too. `exec format error` is the
# signal for a wrong architecture, and an empty entrypoint is checked by reading
# the file rather than by running the container, because running it would start
# a WireGuard daemon.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "The immutable tag to publish under, e.g. v0.1.2. Required on a dispatch: without it the image would be named after the branch."
        required: true
        type: string
  # build-pr below runs on a pull request that touches THIS file, and nothing
  # else does: build and merge stay off (see their `if`), so a pull request
  # proves both images build and their entrypoints run, and publishes
  # nothing. Added 2026-09-02 after tokenfuse's v0.4.2 failed on both Linux
  # runners the first time its own tag-only release.yml ever reached its musl
  # leg: a workflow gated on `push: tags: v*` alone is tested by exactly one
  # event in its whole life, and that event is the one where a mistake is
  # public.
  pull_request:
    paths: [".github/workflows/tunnel-images.yml"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.image }} on ${{ matrix.arch }}
    # Never on a pull request: this job pushes by digest. build-pr below is
    # what a pull request runs instead.
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        image: [caddy, wg]
        arch: [amd64, arm64]
        # `include` entries that name only an existing key VALUE add fields to
        # every combination carrying it, so this maps each architecture to its
        # runner without spelling out four rows.
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The owner, lowercased. ghcr.io refuses a repository path with an
      # uppercase letter in it, and this owner has one. `docker/metadata-action`
      # lowercases on the way past, so a workflow that uses it survives without
      # this step and one that talks to buildx directly does not: on 2026-09-01
      # that difference killed three workflows in a row, each fixed in the file
      # in front of me rather than in the template they were copied from.
      # Anything below that names the registry uses THIS output.
      - name: lowercase the owner
        id: owner
        run: echo "name=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      # The tag these images will carry, and it must not be able to move.
      #
      # `github.ref_name` is the tag on a tag push and the BRANCH NAME on a
      # workflow_dispatch, so dispatching this from main would publish
      # `<image>:main`: exactly the moving tag invariant 7 forbids, produced by
      # a workflow that looks like it is doing the right thing. Nobody had hit
      # it because these workflows had only ever run on a tag.
      #
      # So a dispatch has to say which version it is publishing, and anything
      # that is not a v-prefixed tag is refused here rather than discovered in
      # the registry.
      - name: the version, and it must not move
        id: ver
        run: |
          v="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          case "$v" in
            v[0-9]*) ;;
            *)
              echo "refusing to publish under '$v': not a v-prefixed immutable tag." >&2
              echo "Push a tag, or dispatch with the version input set." >&2
              exit 1 ;;
          esac
          echo "tag=$v" >> "$GITHUB_OUTPUT"
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      # By digest, unreferenced until the merge job names it. A tag that exists
      # with one architecture behind it is indistinguishable from a correct one
      # until somebody's arm64 node pulls it.
      - name: build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/${{ matrix.image }}.Dockerfile
          outputs: type=image,name=ghcr.io/${{ steps.owner.outputs.name }}/stack-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.version=${{ steps.ver.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: the entrypoint exists, is not empty, and runs on this architecture
        run: |
          set -eu
          img="ghcr.io/${{ steps.owner.outputs.name }}/stack-${{ matrix.image }}@${{ steps.build.outputs.digest }}"
          echo "on $(uname -m), image $img"
          case "${{ matrix.image }}" in
            caddy) entry=/usr/local/bin/caddy-entrypoint.sh; bins="caddy" ;;
            wg)    entry=/usr/local/bin/wg-entrypoint.sh;    bins="wireguard-go uapi-proxy wg socat" ;;
          esac
          docker run --rm --entrypoint /bin/sh "$img" -c "
            fail=0
            if [ ! -s '$entry' ]; then
              echo '  $entry is EMPTY or missing: built without BuildKit (GOTCHAS 47)'
              fail=1
            else
              echo '  $entry present, '\$(wc -c < '$entry')' bytes'
            fi
            for b in $bins; do
              out=\$(command -v \"\$b\" >/dev/null 2>&1 && \"\$b\" --version 2>&1 | head -3 || echo __NOT_ON_PATH__)
              case \"\$out\" in
                *'exec format error'*) echo \"  \$b: EXEC FORMAT ERROR, built for another architecture\"; fail=1 ;;
                __NOT_ON_PATH__)       echo \"  \$b: not on PATH in this image\"; fail=1 ;;
                *)                     echo \"  \$b: runs\" ;;
              esac
            done
            uname -m
            exit \$fail
          "

      - name: hand the digest on
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      # The name carries the image, and the merge job matches on it EXACTLY.
      # A pattern of `digest-*` here would collect both images' digests into one
      # manifest list: that is not hypothetical, it is what `digest-tokenfuse-*`
      # did on 2026-09-01 by matching four images through a shared prefix.
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge ${{ matrix.image }}
    needs: build
    # Never on a pull request: this job creates the manifest list under the
    # published tag. With build guarded off above, needs: build already skips
    # this on a pull request; the explicit if says so directly too.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [caddy, wg]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
          path: /tmp/digests

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: lowercase the owner
        id: owner
        run: echo "name=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      # The tag these images will carry, and it must not be able to move.
      #
      # `github.ref_name` is the tag on a tag push and the BRANCH NAME on a
      # workflow_dispatch, so dispatching this from main would publish
      # `<image>:main`: exactly the moving tag invariant 7 forbids, produced by
      # a workflow that looks like it is doing the right thing. Nobody had hit
      # it because these workflows had only ever run on a tag.
      #
      # So a dispatch has to say which version it is publishing, and anything
      # that is not a v-prefixed tag is refused here rather than discovered in
      # the registry.
      - name: the version, and it must not move
        id: ver
        run: |
          v="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          case "$v" in
            v[0-9]*) ;;
            *)
              echo "refusing to publish under '$v': not a v-prefixed immutable tag." >&2
              echo "Push a tag, or dispatch with the version input set." >&2
              exit 1 ;;
          esac
          echo "tag=$v" >> "$GITHUB_OUTPUT"
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "ghcr.io/${{ steps.owner.outputs.name }}/stack-${{ matrix.image }}:${{ steps.ver.outputs.tag }}" \
            $(printf 'ghcr.io/${{ steps.owner.outputs.name }}/stack-${{ matrix.image }}@sha256:%s ' *)

      # Printed rather than assumed: a one-architecture manifest list looks
      # exactly like a correct one from outside.
      - name: say what is in it
        run: |
          docker buildx imagetools inspect \
            "ghcr.io/${{ steps.owner.outputs.name }}/stack-${{ matrix.image }}:${{ steps.ver.outputs.tag }}"

  # What a pull request runs instead of build/merge: the same Dockerfile,
  # loaded into the local daemon rather than pushed by digest, so the smoke
  # test below can run it. No registry login, no owner-lowercasing, no
  # version-must-not-move check: none of those matter to an image that is
  # never pushed and carries no tag but a local one.
  build-pr:
    name: ${{ matrix.image }} on ${{ matrix.arch }} (build only, no push)
    # Only on the pull request that exercises this file: build and merge
    # above already cover a tag push.
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        image: [caddy, wg]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Loaded into the local daemon rather than pushed, so the smoke test
      # below can `docker run` it. BuildKit only, same as the real build: the
      # heredoc entrypoints (GOTCHAS 47) need it, and setup-buildx-action's
      # default driver already is BuildKit, so push: false plus load: true is
      # the whole of the difference from the real build step.
      - name: build (no push)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/${{ matrix.image }}.Dockerfile
          push: false
          load: true
          tags: stack-${{ matrix.image }}:pr-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: the entrypoint exists, is not empty, and runs on this architecture
        run: |
          set -eu
          img="stack-${{ matrix.image }}:pr-${{ matrix.arch }}"
          echo "on $(uname -m), image $img"
          case "${{ matrix.image }}" in
            caddy) entry=/usr/local/bin/caddy-entrypoint.sh; bins="caddy" ;;
            wg)    entry=/usr/local/bin/wg-entrypoint.sh;    bins="wireguard-go uapi-proxy wg socat" ;;
          esac
          docker run --rm --entrypoint /bin/sh "$img" -c "
            fail=0
            if [ ! -s '$entry' ]; then
              echo '  $entry is EMPTY or missing: built without BuildKit (GOTCHAS 47)'
              fail=1
            else
              echo '  $entry present, '\$(wc -c < '$entry')' bytes'
            fi
            for b in $bins; do
              out=\$(command -v \"\$b\" >/dev/null 2>&1 && \"\$b\" --version 2>&1 | head -3 || echo __NOT_ON_PATH__)
              case \"\$out\" in
                *'exec format error'*) echo \"  \$b: EXEC FORMAT ERROR, built for another architecture\"; fail=1 ;;
                __NOT_ON_PATH__)       echo \"  \$b: not on PATH in this image\"; fail=1 ;;
                *)                     echo \"  \$b: runs\" ;;
              esac
            done
            uname -m
            exit \$fail
          "
