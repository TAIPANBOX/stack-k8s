# These checks used to run only through .githooks/pre-push, which is local
# configuration: `core.hooksPath` is not committed and does not travel with a
# clone, so they enforced nothing for anybody else. The scripts are the ONE
# copy; the hook and this workflow both call them. Public repo, so standard
# runners cost nothing.
name: gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: every gotcha is classified
        run: ./scripts/gotchas-classified.sh

      - name: the cluster comes up closed
        run: ./scripts/closed-by-default.sh

      - name: every cloud claim is marked and dated
        run: ./scripts/portability-claims.sh

      - name: every image is pinned or built here
        run: ./scripts/pinned-images.sh

      - name: node names are pinned by the install, not by a boot
        run: ./scripts/node-name-is-pinned.sh

      # Added 2026-09-01. This gate existed, had cases in gates-have-teeth.sh,
      # and was called by NOTHING: not this workflow, not the pre-push hook,
      # not the gate list in CLAUDE.md. It caught a real omission the first
      # time anybody ran it.
      - name: components.json says what this launcher installs
        run: ./scripts/manifest-is-true.sh

      # Added 2026-09-01, in BOTH callers on the same commit, because the entry
      # above records what happens when a gate reaches only one of them.
      - name: every deploy path can set the trust domain, after the apply
        run: ./scripts/deploy-flags-agree.sh

      # Added 2026-09-13, in both callers on the same commit. Three installers
      # each carry a copy of the block that generates stack-keys; two of them
      # shipped without the key the manifests had read since 2026-09-07, and
      # the first fresh GCP cluster after that came up with no gateway and no
      # console. Same asymmetry as the flag above, one gate over the block.
      - name: every installer creates every Secret key the manifests read
        run: ./scripts/secret-keys-agree.sh

      # Added 2026-09-13, the same afternoon, in both callers. The second
      # deploy-aws.sh over a healthy cluster minted a fresh k3s token and the
      # first server refused to start; install.sh reused the token since
      # a0250b8 and install-gcp.sh was written with it. Third drift of a block
      # copied across the three clouds (GOTCHAS 90, 101, 102).
      - name: every installer reuses the cluster token before it installs
        run: ./scripts/k3s-token-is-reused.sh

      # Added 2026-09-14. R2 of the 1.0 proving run (2026-09-13): the GCP
      # preflight rewrote the operator's `c2d-highcpu-8` (the family with
      # quota) to its own default `c3d-highcpu-8` (capped at 24 vCPU, below
      # the 40 the cluster needs) and was set back by hand before the apply.
      # The real script runs under stubs over a seeded tfvars (GOTCHAS 103).
      - name: the GCP preflight keeps what the operator wrote in terraform.tfvars
        run: ./scripts/preflight-keeps-tfvars.sh

      # Added 2026-09-24. The gateway's semantic response cache defaults to
      # shadow mode whenever TOKENFUSE_CACHE is unset: one global mutex per
      # call, up to 10,000 cached entries walked for cosine similarity,
      # nothing served back (tokenfuse#319). Measured on a 4-core N150
      # appliance: 177 calls/s with 403 refusals in shadow mode, 1102 calls/s
      # and zero refusals with the cache off.
      - name: the gateway's semantic cache is off in every install
        run: ./scripts/gateway-cache-is-off.sh

      # Added 2026-10-04 (estate audit, wave 1). POST /v1/fuse/declassify lifts
      # a run's taint label and its credential is optional in the gateway, so a
      # launcher that sets none leaves it open to anything that reaches port
      # 4100. The key is minted into stack-keys by every installer, on stdin.
      # See CLAUDE.md invariant 27.
      - name: the gateway's declassify key is minted per cluster, never a literal (invariant 27)
        run: ./scripts/declassify-is-keyed.sh

      - name: a plane that can move leaves a dead node and drains (invariant 21)
        run: ./scripts/planes-leave-a-dead-node.sh

      - name: Longhorn releases a dead node's volumes (invariant 22)
        run: ./scripts/longhorn-releases-a-dead-node.sh

      # manifests/53-hub-entry.yaml is opt-in and, unlike every other gate
      # here, publishes something on purpose: a second site's one way in.
      # Nothing above catches a route that widens, a missing catch-all, or a
      # capability added beyond NET_BIND_SERVICE; only reading the Caddyfile's
      # own route list does. See CLAUDE.md invariant 23.
      - name: the hub entry routes exactly the eight allowed paths (invariant 23)
        run: ./scripts/hub-entry-is-narrow.sh

      # Felyx is an agent too: its calls go through the gateway, metered and
      # policy-checked, by Service name. See CLAUDE.md invariant 25.
      - name: Felyx reaches its model through the gateway (invariant 25)
        run: ./scripts/felyx-through-the-gateway.sh

      # manifests/54-delegation.yaml (vouchryx) is opt-in, applied only by
      # delegation/up.sh, never by the default apply set. See CLAUDE.md
      # invariant 24 and GOTCHAS.md entry 105.
      - name: delegation is off by default (invariant 24)
        run: ./scripts/delegation-off-by-default.sh

      # Added 2026-10-04 (estate audit, wave 1), tokenfuse v1.5.0 invariant 73.
      # A run's budget came from the header the agent sends and the next call
      # could widen it; the gateway has a ceiling for it and a launcher that
      # forgets the variable ships as unbounded as 1.4.1. The deploy-path half
      # (the flag, applied after the apply that reverts it) is in the
      # deploy-flags-agree step above. See CLAUDE.md invariant 28.
      - name: the gateway caps what a run may declare (invariant 28)
        run: ./scripts/run-budget-ceiling-is-set.sh

      # Added 2026-10-04. heraldyx v0.3.0 and idryx v1.1.0 refuse an event whose
      # source is not allowed for the file it was read from, so a stream this
      # launcher names differently, or a --load pair naming the wrong source,
      # silences a plane without an error. See CLAUDE.md invariant 30.
      - name: every bus file is a name the readers accept (invariant 30)
        run: ./scripts/bus-names-match-the-source-rule.sh

      # Added 2026-10-05. A Secret mounted at 0440 is root-owned, and only the
      # pod's fsGroup lets a non-root container read it: the typed risk proxy
      # had none and died at start on the jev key. See CLAUDE.md invariant 32
      # and GOTCHAS.md entry 117.
      - name: every mounted key is readable by its pod (invariant 32)
        run: ./scripts/mounted-keys-are-readable.sh

      # Added 2026-10-05. tokenfuse splits a client key entry on its LAST
      # colon, so a `secret:agent://...` example starts fine and refuses the
      # caller's real secret. See CLAUDE.md invariant 33.
      - name: every client key example splits the way tokenfuse splits it (invariant 33)
        run: ./scripts/client-key-ids-are-bare.sh

      # Added 2026-10-04. The on-box chain verifier (agent-stack-go v1.1.0):
      # in the default install, every 15 minutes, on the bus, its memory on a
      # claim that already exists, a new break kept visible. See CLAUDE.md
      # invariant 31.
      - name: the chain verifier watches the bus (invariant 31)
        run: ./scripts/chain-verifier-watches-the-bus.sh

      # No workload in this stack talks to the Kubernetes API from inside a
      # pod, so the projected token every pod gets for the namespace default
      # ServiceAccount is a live credential with nothing to authorize and
      # nothing gained by mounting it. In both callers on the same commit.
      - name: no pod automounts the default ServiceAccount token
        run: ./scripts/no-sa-token-by-default.sh

      # Added 2026-09-09, in both callers on the same commit. `git ls-files`
      # is checked for shape, not content: nothing above this step would have
      # caught cloud/gcp/terraform.tfvars.bak being tracked for 76 commits
      # (GOTCHAS.md entry 99). See scripts/no-operator-files-tracked.sh's own
      # header for what this can and cannot see.
      - name: no tracked file is shaped like an operator-only secret
        run: ./scripts/no-operator-files-tracked.sh

      # Pinned rather than left to whatever the runner ships. `go install` of a
      # module built against a newer toolchain fails on an older one, and the
      # error names a Go version rather than this step, which is a confusing
      # way to learn the runner image changed under you.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"

      # uapi-proxy is Go source in this repository, built into the wg image and
      # run beside the WireGuard daemon, where it is the thing standing between
      # a caller and the raw UAPI socket. Its tests assert that the bearer is
      # checked before anything reaches the daemon, that the private key is
      # swapped for its public half rather than read back, and that the four
      # ways to take the tunnel away are each refused by name.
      #
      # Until 2026-08-28 nothing ran them: the word `go test` did not appear
      # anywhere in this repository, and the module was compiled only inside a
      # docker build, where a failure reads as an image problem. A test nobody
      # runs is indistinguishable from one that passes.
      - name: the tunnel proxy still refuses what it claims to refuse
        working-directory: images/uapi-proxy
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l .; exit 1)
          go vet ./...
          go test ./...

      # kubeconform validates against the real schemas without a cluster.
      # `kubectl --dry-run=client` fetches its schema FROM a cluster, so a
      # check built on it would fail here for want of one and would then be a
      # check that never runs.
      #
      # Pinned to v0.8.0 (the current tagged release as of 2026-09-06)
      # rather than @latest, for the same reason the images in manifests/ are
      # pinned: a tool that moves under the operator can start failing, or
      # stop catching something, on a run nobody triggered. If v0.8.0 is ever
      # removed, move to the newest tagged release and say so here.
      - name: install kubeconform
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0

      - name: every manifest is a document Kubernetes would accept
        run: PATH="$PATH:$(go env GOPATH)/bin" ./scripts/manifests-valid.sh

      # After kubeconform is installed, because this gate validates every mode
      # typed/mode.sh can render, strictly, with it. The typed-answer data mode
      # is a bill and a data-egress decision, so it is asked for by name and the
      # key never becomes a literal. See CLAUDE.md invariant 26.
      - name: the typed-answer data mode is honest (invariant 26)
        run: PATH="$PATH:$(go env GOPATH)/bin" ./scripts/typed-mode-is-honest.sh

      # Last, because it mutates tracked files and restores them. It needs a
      # clean tree and says so plainly, so it also reports any earlier step
      # that starts writing into the checkout.
      - name: the gates above can still fail
        run: ./scripts/gates-have-teeth.sh
