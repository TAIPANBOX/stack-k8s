# These checks used to run only through .githooks/pre-push, which is local
# configuration: `core.hooksPath` is not committed and does not travel with a
# clone, so they enforced nothing for anybody else. The scripts are the ONE
# copy; the hook and this workflow both call them. Public repo, so standard
# runners cost nothing.
name: gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The gates run in two jobs. `fast-gates` holds every check below except the
# teeth run; `teeth` runs that run in four shards at once; `gates` is the one
# required check, and it passes only when both succeeded.
jobs:
  fast-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: every gotcha is classified
        run: ./scripts/gotchas-classified.sh

      - name: the cluster comes up closed
        run: ./scripts/closed-by-default.sh

      - name: every cloud claim is marked and dated
        run: ./scripts/portability-claims.sh

      - name: every image is pinned or built here
        run: ./scripts/pinned-images.sh

      - name: every image is pinned by digest, and the admission policy is held to invariant 58
        run: ./scripts/verified-images-are-enforced.sh

      - name: every stream file is created by its writer before it starts (invariant 59)
        run: ./scripts/stream-files-are-precreated.sh

      - name: node names are pinned by the install, not by a boot
        run: ./scripts/node-name-is-pinned.sh

      # Added 2026-09-01. This gate existed, had cases in gates-have-teeth.sh,
      # and was called by NOTHING: not this workflow, not the pre-push hook,
      # not the gate list in CLAUDE.md. It caught a real omission the first
      # time anybody ran it.
      - name: components.json says what this launcher installs
        run: ./scripts/manifest-is-true.sh

      # Added 2026-09-01, in BOTH callers on the same commit, because the entry
      # above records what happens when a gate reaches only one of them.
      - name: every deploy path can set the trust domain, after the apply
        run: ./scripts/deploy-flags-agree.sh

      # Added 2026-10-14, in BOTH callers on the same commit. The GCP and AWS launchers are one
      # launcher for two clouds, so every flag the GCP one takes, the AWS one takes too, or is
      # allow-listed by name in the gate with its reason (CLAUDE.md invariant 40).
      - name: the AWS launcher takes every flag the GCP one takes (invariant 40)
        run: ./scripts/aws-takes-every-gcp-flag.sh

      # Added 2026-09-13, in both callers on the same commit. Three installers
      # each carry a copy of the block that generates stack-keys; two of them
      # shipped without the key the manifests had read since 2026-09-07, and
      # the first fresh GCP cluster after that came up with no gateway and no
      # console. Same asymmetry as the flag above, one gate over the block.
      - name: every installer creates every Secret key the manifests read
        run: ./scripts/secret-keys-agree.sh

      # Added 2026-09-13, the same afternoon, in both callers. The second
      # deploy-aws.sh over a healthy cluster minted a fresh k3s token and the
      # first server refused to start; install.sh reused the token since
      # a0250b8 and install-gcp.sh was written with it. Third drift of a block
      # copied across the three clouds (GOTCHAS 90, 101, 102).
      - name: every installer reuses the cluster token before it installs
        run: ./scripts/k3s-token-is-reused.sh

      # Added 2026-09-14. R2 of the 1.0 proving run (2026-09-13): the GCP
      # preflight rewrote the operator's `c2d-highcpu-8` (the family with
      # quota) to its own default `c3d-highcpu-8` (capped at 24 vCPU, below
      # the 40 the cluster needs) and was set back by hand before the apply.
      # The real script runs under stubs over a seeded tfvars (GOTCHAS 103).
      - name: the GCP preflight keeps what the operator wrote in terraform.tfvars
        run: ./scripts/preflight-keeps-tfvars.sh

      # Added 2026-09-24. The gateway's semantic response cache defaults to
      # shadow mode whenever TOKENFUSE_CACHE is unset: one global mutex per
      # call, up to 10,000 cached entries walked for cosine similarity,
      # nothing served back (tokenfuse#319). Measured on a 4-core N150
      # appliance: 177 calls/s with 403 refusals in shadow mode, 1102 calls/s
      # and zero refusals with the cache off.
      - name: the gateway's semantic cache is off in every install
        run: ./scripts/gateway-cache-is-off.sh

      # Added 2026-10-04 (estate audit, wave 1). POST /v1/fuse/declassify lifts
      # a run's taint label and its credential is optional in the gateway, so a
      # launcher that sets none leaves it open to anything that reaches port
      # 4100. The key is minted into stack-keys by every installer, on stdin.
      # See CLAUDE.md invariant 27.
      - name: the gateway's declassify key is minted per cluster, never a literal (invariant 27)
        run: ./scripts/declassify-is-keyed.sh

      - name: a plane that can move leaves a dead node and drains (invariant 21)
        run: ./scripts/planes-leave-a-dead-node.sh

      - name: Longhorn releases a dead node's volumes (invariant 22)
        run: ./scripts/longhorn-releases-a-dead-node.sh

      - name: the policy store keeps a readable replica (invariant 43)
        run: ./scripts/policy-store-survives-a-partition.sh

      - name: a deploy refuses an old policy-db claim before apply (invariant 43)
        run: ./scripts/policy-store-refuses-an-old-claim.sh

      # manifests/53-hub-entry.yaml is opt-in and, unlike every other gate
      # here, publishes something on purpose: a second site's one way in.
      # Nothing above catches a route that widens, a missing catch-all, or a
      # capability added beyond NET_BIND_SERVICE; only reading the Caddyfile's
      # own route list does. See CLAUDE.md invariant 23.
      - name: the hub entry routes exactly the eight allowed paths (invariant 23)
        run: ./scripts/hub-entry-is-narrow.sh

      # Felyx is an agent too: its calls go through the gateway, metered and
      # policy-checked, by Service name. See CLAUDE.md invariant 25.
      - name: Felyx reaches its model through the gateway (invariant 25)
        run: ./scripts/felyx-through-the-gateway.sh

      # manifests/54-delegation.yaml (vouchryx) is in the default apply set and runs agents-only; an
      # upstream identity provider stays opt-in (delegation/up.sh). CLAUDE.md invariant 24, as amended.
      - name: vouchryx runs agents-only in the default install (invariant 24)
        run: ./scripts/vouchryx-runs-agents-only.sh
      - name: closing a retained reservation is off by default (invariant 36)
        run: ./scripts/closure-off-by-default.sh

      # Added 2026-10-04 (estate audit, wave 1), tokenfuse v1.5.0 invariant 73.
      # A run's budget came from the header the agent sends and the next call
      # could widen it; the gateway has a ceiling for it and a launcher that
      # forgets the variable ships as unbounded as 1.4.1. The deploy-path half
      # (the flag, applied after the apply that reverts it) is in the
      # deploy-flags-agree step above. See CLAUDE.md invariant 28.
      - name: the gateway caps what a run may declare (invariant 28)
        run: ./scripts/run-budget-ceiling-is-set.sh

      # Added 2026-10-13. The agent firewall refuses a run that read untrusted input and
      # then asks for a dangerous capability only in enforce, and the gateway's own default
      # is shadow. Every gateway start sets enforce, and one switch (--firewall on the deploy
      # scripts) changes it. The deploy-path half is in the deploy-flags-agree step above.
      # See CLAUDE.md invariant 37.
      - name: the agent firewall runs in enforce by default (invariant 37)
        run: ./scripts/firewall-is-enforce-by-default.sh

      # Added 2026-10-13. The PII scanners run in shadow on every gateway and every MCP broker
      # this launcher starts, so personal data in prompts and tool arguments is reported and the
      # call still goes through. One switch (--pii-mode on the deploy scripts) changes it. The
      # deploy-path half is in the deploy-flags-agree step above. See CLAUDE.md invariant 38.
      - name: the PII scanners run in shadow by default (invariant 38)
        run: ./scripts/pii-is-shadow-by-default.sh

      # Added 2026-10-13. The gateway's client keys and identity map come in as files through
      # identity/up.sh: the keys as a Secret, the map as a ConfigMap mounted read only, both
      # optional in the manifest, both checked by the pinned gateway image in a throwaway
      # container with no network before anything is written, and the gateway rolled exactly
      # when what it reads changed. Needs Docker, which the hosted runner has, and pulls the
      # public gateway image the manifest pins. See CLAUDE.md invariant 39.
      - name: client keys and the identity map are checked before they are applied (invariant 39)
        run: ./scripts/identity-files-are-checked.sh

      # Added 2026-10-17 (the agent-security review, wave 0). The gateway requires its client
      # keys and runs strict, and a deploy given no files mints a key for Felyx and one for the
      # operator's agents, each bound to its own ids; the mint runs against a stand-in cluster
      # and the pinned gateway image reads what it made. See CLAUDE.md invariant 50.
      - name: the gateway requires client keys, minted when none are given (invariant 50)
        run: ./scripts/metered-doors-require-keys.sh
      # The MCP broker blocks raw secrets and flagged tool listings and asks wardryx about every
      # tool call, failing closed: in 52, in every typed render, and in the pinned image run with
      # 52's switches and no network. See CLAUDE.md invariant 51.
      - name: the MCP broker blocks raw secrets and asks the policy plane (invariant 51)
        run: ./scripts/broker-blocks-raw-secrets.sh

      # The gateway's policy-plane key is a pep on a new cluster and on one installed again (invariant 52).
      - name: the gateway's policy-plane key is a pep, and an installed cluster is migrated from viewer
        run: ./scripts/wardryx-gateway-key-is-pep.sh

      # The provider key is held by the gateway, from a file, and no other container holds one (invariant 53).
      - name: the provider key is held by the gateway from a file, and no other container holds one
        run: ./scripts/no-provider-key-outside-the-gateway.sh

      # The agent token is the door credential in the default install (invariant 54), and every door verifies it the same way.
      - name: agent tokens are required at the doors, with one audience and a closed revocation list
        run: ./scripts/agent-tokens-are-required.sh
      # Static client keys are admitted only from the named allow-lists (invariant 62).
      - name: a static client key is admitted only from the named lists
        run: ./scripts/static-keys-are-named.sh
      # wardryx verifies the agent's token and its DPoP proof itself (invariant 63, decision D3(b)).
      - name: wardryx verifies agent tokens and proofs
        run: ./scripts/wardryx-verifies-agent-tokens.sh

      # Added 2026-10-04. heraldyx v0.3.0 and idryx v1.1.0 refuse an event whose
      # source is not allowed for the file it was read from, so a stream this
      # launcher names differently, or a --load pair naming the wrong source,
      # silences a plane without an error. See CLAUDE.md invariant 30.
      - name: every bus file is a name the readers accept (invariant 30)
        run: ./scripts/bus-names-match-the-source-rule.sh

      # Added 2026-10-05. A Secret mounted at 0440 is root-owned, and only the
      # pod's fsGroup lets a non-root container read it: the typed risk proxy
      # had none and died at start on the jev key. See CLAUDE.md invariant 32
      # and GOTCHAS.md entry 117.
      - name: every mounted key is readable by its pod (invariant 32)
        run: ./scripts/mounted-keys-are-readable.sh

      # Added 2026-10-05. tokenfuse splits a client key entry on its LAST
      # colon, so a `secret:agent://...` example starts fine and refuses the
      # caller's real secret. See CLAUDE.md invariant 33.
      - name: every client key example splits the way tokenfuse splits it (invariant 33)
        run: ./scripts/client-key-ids-are-bare.sh

      # Added 2026-10-08. This repository is public: no quote of the owner,
      # no owner provenance marker, no attribution by name. See CLAUDE.md
      # invariant 34.
      - name: no quote of the owner in a public file (invariant 34)
        run: ./scripts/no-owner-quotes.sh

      # Added 2026-10-08. The costcrew console and its crew run with a
      # read-only root, and SQLite needs a temp directory to VACUUM: without
      # one the v0.4.0 session migration could not erase the old tokens. See
      # CLAUDE.md invariant 35 and GOTCHAS.md entry 120.
      - name: a read-only container that needs a temp has one (invariant 35)
        run: ./scripts/read-only-root-has-a-temp.sh

      # Added 2026-10-14, in BOTH callers on the same commit. A secret is minted from a bounded
      # read by one generator, lib/gen.sh, because `tr </dev/urandom | head -c N` never ends where
      # SIGPIPE is ignored, as it is under a git hook. See CLAUDE.md invariant 41 and GOTCHAS 125.
      - name: a secret is minted from a bounded read (invariant 41)
        run: ./scripts/gen-is-bounded.sh

      # Added 2026-10-14, in BOTH callers on the same commit. k3s ships coredns with no
      # disruption budget; the installers add one of their own and never patch k3s's
      # Deployment. See CLAUDE.md invariant 45 and GOTCHAS 128.
      - name: cluster DNS keeps a replica through a drain (invariant 45)
        run: ./scripts/cluster-dns-has-a-budget.sh
      - name: every node stops its pods before its network goes
        run: ./scripts/nodes-stop-their-pods-first.sh
      - name: every shell script parses under the bash a Mac ships
        run: ./scripts/shell-scripts-parse.sh

      - name: node checks read only their own answer
        run: ./scripts/node-checks-read-their-own-answer.sh
      - name: every k3s server starts with --secrets-encryption
        run: ./scripts/servers-encrypt-secrets.sh

      # CLAUDE.md invariant 60 (stack-k8s v1.4.0 wave): no secret value on a command line.
      - name: no secret value on any command line (invariant 60)
        run: ./scripts/no-secret-on-argv.sh

      # CLAUDE.md invariant 61: the cloud host keys are verified before the first connection.
      - name: every cloud host key is verified before the first connection (invariant 61)
        run: ./scripts/hostkeys-are-verified.sh

      # CLAUDE.md invariant 64: a command fed on stdin over ssh gets that stdin once.
      - name: a stdin-fed remote command reads its stdin once (invariant 64)
        run: ./scripts/stdin-is-read-once.sh

      # Added 2026-10-04. The on-box chain verifier (agent-stack-go v1.1.0):
      # in the default install, every 15 minutes, on the bus, its memory on a
      # claim that already exists, a new break kept visible. See CLAUDE.md
      # invariant 31.
      - name: the chain verifier watches the bus (invariant 31)
        run: ./scripts/chain-verifier-watches-the-bus.sh

      # No workload in this stack talks to the Kubernetes API from inside a
      # pod, so the projected token every pod gets for the namespace default
      # ServiceAccount is a live credential with nothing to authorize and
      # nothing gained by mounting it. In both callers on the same commit.
      - name: no pod automounts the default ServiceAccount token
        run: ./scripts/no-sa-token-by-default.sh

      # Added 2026-09-09, in both callers on the same commit. `git ls-files`
      # is checked for shape, not content: nothing above this step would have
      # caught cloud/gcp/terraform.tfvars.bak being tracked for 76 commits
      # (GOTCHAS.md entry 99). See scripts/no-operator-files-tracked.sh's own
      # header for what this can and cannot see.
      - name: no tracked file is shaped like an operator-only secret
        run: ./scripts/no-operator-files-tracked.sh

      # Pinned rather than left to whatever the runner ships. `go install` of a
      # module built against a newer toolchain fails on an older one, and the
      # error names a Go version rather than this step, which is a confusing
      # way to learn the runner image changed under you.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"

      # uapi-proxy is Go source in this repository, built into the wg image and
      # run beside the WireGuard daemon, where it is the thing standing between
      # a caller and the raw UAPI socket. Its tests assert that the bearer is
      # checked before anything reaches the daemon, that the private key is
      # swapped for its public half rather than read back, and that the four
      # ways to take the tunnel away are each refused by name.
      #
      # Until 2026-08-28 nothing ran them: the word `go test` did not appear
      # anywhere in this repository, and the module was compiled only inside a
      # docker build, where a failure reads as an image problem. A test nobody
      # runs is indistinguishable from one that passes.
      - name: the tunnel proxy still refuses what it claims to refuse
        working-directory: images/uapi-proxy
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l .; exit 1)
          go vet ./...
          go test ./...

      # kubeconform validates against the real schemas without a cluster.
      # `kubectl --dry-run=client` fetches its schema FROM a cluster, so a
      # check built on it would fail here for want of one and would then be a
      # check that never runs.
      #
      # Pinned to v0.8.0 (the current tagged release as of 2026-09-06)
      # rather than @latest, for the same reason the images in manifests/ are
      # pinned: a tool that moves under the operator can start failing, or
      # stop catching something, on a run nobody triggered. If v0.8.0 is ever
      # removed, move to the newest tagged release and say so here.
      - name: install kubeconform
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0

      - name: every manifest is a document Kubernetes would accept
        run: PATH="$PATH:$(go env GOPATH)/bin" ./scripts/manifests-valid.sh

      # After kubeconform is installed, because this gate validates every mode
      # typed/mode.sh can render, strictly, with it. The typed-answer data mode
      # is a bill and a data-egress decision, so it is asked for by name and the
      # key never becomes a literal. See CLAUDE.md invariant 26.
      - name: the typed-answer data mode is honest (invariant 26)
        run: PATH="$PATH:$(go env GOPATH)/bin" ./scripts/typed-mode-is-honest.sh

      # Added 2026-10-14, in BOTH callers on the same commit, after kubeconform is installed
      # because it validates the Secrets it mints. A typed deploy comes up green on its own: the
      # two Secrets the typed planes' doors read are minted when absent and never overwritten.
      # See CLAUDE.md invariant 42 and GOTCHAS 126.
      - name: the typed-answer door is minted by the deploy (invariant 42)
        run: PATH="$PATH:$(go env GOPATH)/bin" ./scripts/typed-door-is-minted.sh

      # Added 2026-10-19 with invariant 65. With --typed-risk-signal the policy plane holds a brokered call
      # that arrives with no risk signal, and only with the flag. See GOTCHAS and CLAUDE.md invariant 65.
      - name: the risk hold follows --typed-risk-signal (invariant 65)
        run: PATH="$PATH:$(go env GOPATH)/bin" ./scripts/risk-hold-follows-the-flag.sh

      # Added 2026-10-19 with invariant 66. The CostCrew run ceiling is validated before any install and written
      # after the last apply, and the crew CronJob is suspended. See CLAUDE.md invariant 66.
      - name: the CostCrew ceiling is validated and written after apply (invariant 66)
        run: PATH="$PATH:$(go env GOPATH)/bin" ./scripts/costcrew-ceiling-is-set.sh

      # Added 2026-10-19 with invariant 68. A workflow checks out another repository at a full commit, never a
      # branch or no ref. See CLAUDE.md invariant 68.
      - name: every workflow checkout of another repository is a full commit (invariant 68)
        run: PATH="$PATH:$(go env GOPATH)/bin" ./scripts/workflow-checkouts-are-pinned.sh

      # Added 2026-10-19. hub/add-site.sh reads the Cloud's version from a name:tag@sha256 reference, the form
      # the manifests pin. v1.5.3 read the digest as the tag and refused every pinned install.
      - name: hub/add-site.sh reads a digest-pinned tokenfuse-cloud image
        run: PATH="$PATH:$(go env GOPATH)/bin" ./scripts/hub-add-site-reads-the-pinned-image.sh

      # Added 2026-10-19 with invariant 67. The console's approver key is minted once; wardryx verifies
      # the console's statements with its public half, and no bearer key decides a hold. See CLAUDE.md invariant 67.
      - name: the console approver key is minted once and wardryx verifies with it (invariant 67)
        run: PATH="$PATH:$(go env GOPATH)/bin" ./scripts/approver-key-is-minted.sh

      # Added 2026-10-19 with invariant 69. Keyryx is installed by default in every launcher, and the record and
      # the approvals are signed through custody. See CLAUDE.md invariant 69.
      - name: Keyryx is installed by default, with --without-keyryx as the opt-out (invariant 69)
        run: PATH="$PATH:$(go env GOPATH)/bin" ./scripts/keyryx-is-default.sh

      # Added 2026-10-19 with invariant 70. The Keyryx witness reads the record it countersigns, and the record-seal
      # reads the witness's attestations, through volumes the two share. See CLAUDE.md invariant 70.
      - name: the Keyryx witness reads the record and the record-seal reads attestations through shared volumes (invariant 70)
        run: PATH="$PATH:$(go env GOPATH)/bin" ./scripts/keyryx-witness-shares-the-record.sh

      # Added 2026-10-19 with invariant 71. A failed record-seal pack ends the run non-zero; only the known empty
      # case exits 0. See GOTCHAS 151.
      - name: the record-seal fails closed on a failed pack, and exits zero only when nothing is sealed (invariant 71)
        run: PATH="$PATH:$(go env GOPATH)/bin" ./scripts/record-seal-fails-closed.sh

      # Added 2026-10-19 with invariants 72 and 73. The Keyryx images and the record seal's trailryx-node are the
      # release pins, and the record seal is pinned to custody's one ES384 key. See GOTCHAS 152.
      - name: the Keyryx images and the record seal's trailryx-node are the release pins (invariant 72)
        run: PATH="$PATH:$(go env GOPATH)/bin" ./scripts/keyryx-release-pins.sh

      - name: the record seal is pinned to custody's one ES384 key, kept on a re-run (invariant 73)
        run: PATH="$PATH:$(go env GOPATH)/bin" ./scripts/keyryx-kid-is-pinned.sh

      # Added 2026-10-20 with invariant 74. tokenfuse v1.20.0 is pinned by digest, and the gateway and the MCP broker
      # name every address they are reached at as their door origins.
      - name: tokenfuse v1.20.0 is pinned by digest and the door origins name every address (invariant 74)
        run: PATH="$PATH:$(go env GOPATH)/bin" ./scripts/tokenfuse-door-origins.sh

      # Added 2026-10-20. Invariants 55 to 57 named these three gates and no caller ran them, so they held
      # nothing; they run here now, beside the gate of invariant 75, which the witness's findings need.
      - name: a Keyryx root key never reaches a process as an environment value (invariant 55)
        run: ./scripts/keyryx-root-is-not-in-env.sh
      - name: the Keyryx witness and custody share nothing but the image (invariant 56)
        run: ./scripts/witness-is-separate.sh
      - name: only labelled consumers reach a Keyryx role, and neither has egress (invariant 57)
        run: ./scripts/keyryx-reaches-only-consumers.sh

      # Added 2026-10-20 with invariant 75. The Keyryx witness's findings stay on its own claim, written by the
      # witness alone and read only by the console and heraldyx through subPath alerts; the witness mounts the bus
      # read only.
      - name: the witness's findings reach the console and heraldyx read only, and the witness never writes the bus (invariant 75)
        run: ./scripts/keyryx-alerts-reach-readers.sh

      # Every patch under keyryx/ applies to its object and its unpatch takes it back exactly, run with
      # `kubectl patch --local` (the runner's kubectl, no cluster). A volumeMount deleted by name instead of
      # its merge key, mountPath, was refused and reverted nothing, which no text check here caught.
      - name: every Keyryx patch applies and its unpatch reverts it exactly (invariants 69, 70, 75)
        run: ./scripts/keyryx-patches-round-trip.sh

      # Added 2026-10-20 with invariant 76. keyryx/down.sh and the opt-out leave no record-seal Job bound to the
      # witness (a Job keeps the template it was made from, and a Pending one holds back every later seal), and a
      # read they cannot make stops them. Run against a stand-in kubectl, no cluster.
      - name: turning Keyryx off leaves no record-seal Job bound to the witness, and a failed read stops it (invariant 76)
        run: ./scripts/keyryx-off-leaves-nothing-bound.sh

      # Added 2026-10-14 with invariant 44. A cost report that meets a machine type with no
      # rate exits non-zero and names it, instead of counting it as zero. See GOTCHAS 127.
      - name: a cost report refuses an unknown machine rate (invariant 44)
        run: ./scripts/cost-live-refuses-unknown-rates.sh

      # Invariant 49. The teeth run below is split into four shards, and a case
      # that falls in no shard, or in two, changes no exit code. This lists the
      # whole run and each shard without running any case, and compares them.
      - name: the teeth shards cover every case once (invariant 49)
        run: ./scripts/teeth-shards-cover-every-case.sh

  # The teeth run (invariant 9), split into four shards that run in parallel.
  # Each shard runs the cases whose position is its own number mod 4; the cover
  # step above proves that together they run every case once. The setup is the
  # fast job's, because the cases run the gates above. Standard runners: the
  # repository is public.
  teeth:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"

      - name: install kubeconform
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0

      # Last inside each shard, because it mutates tracked files and restores
      # them. It needs a clean tree and says so plainly, so it also reports any
      # earlier step that starts writing into the checkout.
      - name: the gates above can still fail (shard ${{ matrix.shard }} of 4)
        env:
          TEETH_SHARD: ${{ matrix.shard }}/4
        run: ./scripts/gates-have-teeth.sh

  # The one required check, named `gates`. `if: always()` makes a needed job
  # that failed or was cancelled read as a red result here, not as a skip.
  gates:
    needs: [fast-gates, teeth]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every fast gate and every teeth shard passed
        env:
          FAST: ${{ needs.fast-gates.result }}
          TEETH: ${{ needs.teeth.result }}
        run: |
          echo "fast-gates: $FAST, teeth (all four shards): $TEETH"
          test "$FAST" = success && test "$TEETH" = success
