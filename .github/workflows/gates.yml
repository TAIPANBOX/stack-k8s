# These checks used to run only through .githooks/pre-push, which is local
# configuration: `core.hooksPath` is not committed and does not travel with a
# clone, so they enforced nothing for anybody else. The scripts are the ONE
# copy; the hook and this workflow both call them. Public repo, so standard
# runners cost nothing.
name: gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: every gotcha is classified
        run: ./scripts/gotchas-classified.sh

      - name: the cluster comes up closed
        run: ./scripts/closed-by-default.sh

      - name: every cloud claim is marked and dated
        run: ./scripts/portability-claims.sh

      - name: every image is pinned or built here
        run: ./scripts/pinned-images.sh

      - name: node names are pinned by the install, not by a boot
        run: ./scripts/node-name-is-pinned.sh

      # Added 2026-09-01. This gate existed, had cases in gates-have-teeth.sh,
      # and was called by NOTHING: not this workflow, not the pre-push hook,
      # not the gate list in CLAUDE.md. It caught a real omission the first
      # time anybody ran it.
      - name: components.json says what this launcher installs
        run: ./scripts/manifest-is-true.sh

      # Pinned rather than left to whatever the runner ships. `go install` of a
      # module built against a newer toolchain fails on an older one, and the
      # error names a Go version rather than this step, which is a confusing
      # way to learn the runner image changed under you.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"

      # uapi-proxy is Go source in this repository, built into the wg image and
      # run beside the WireGuard daemon, where it is the thing standing between
      # a caller and the raw UAPI socket. Its tests assert that the bearer is
      # checked before anything reaches the daemon, that the private key is
      # swapped for its public half rather than read back, and that the four
      # ways to take the tunnel away are each refused by name.
      #
      # Until 2026-08-28 nothing ran them: the word `go test` did not appear
      # anywhere in this repository, and the module was compiled only inside a
      # docker build, where a failure reads as an image problem. A test nobody
      # runs is indistinguishable from one that passes.
      - name: the tunnel proxy still refuses what it claims to refuse
        working-directory: images/uapi-proxy
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l .; exit 1)
          go vet ./...
          go test ./...

      # kubeconform validates against the real schemas without a cluster.
      # `kubectl --dry-run=client` fetches its schema FROM a cluster, so a
      # check built on it would fail here for want of one and would then be a
      # check that never runs.
      - name: install kubeconform
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@latest

      - name: every manifest is a document Kubernetes would accept
        run: PATH="$PATH:$(go env GOPATH)/bin" ./scripts/manifests-valid.sh

      # Last, because it mutates tracked files and restores them. It needs a
      # clean tree and says so plainly, so it also reports any earlier step
      # that starts writing into the checkout.
      - name: the gates above can still fail
        run: ./scripts/gates-have-teeth.sh
